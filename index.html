<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中文詞語 88 關：究極挑戰版</title>
    <style>
        :root { 
            --p1-color: #3182ce; 
            --p2-color: #d53f8c; 
            --cell-size: 100px; /* 1. 縮小格子高度 (原本是 140px) */
            --road-height: 90px; /* 新增：路軌的高度 */
        }
        
        body { 
            font-family: "Microsoft JhengHei", sans-serif; 
            margin: 0; 
            background: #f0f4f8; 
            overflow-y: scroll; 
            padding-bottom: 200px; 
        }

        #game-container { position: relative; width: 95%; max-width: 1400px; margin: 20px auto; }

        #board { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            gap: 50px 15px; 
            padding: 40px; 
            border-radius: 40px; 
            /* 修正：加入你的背景圖 */
            background-image: url('images/board-bg.jpg');
            background-size: cover;
            background-position: center;
            background-color: #ffffff; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.1); 
            border: 12px solid white;
        }

        .cell { 
            height: var(--cell-size);
            margin-bottom: var(--road-height); /* 為下方的路留出空間 */
            border-radius: 25px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            transition: 0.3s; 
            background-color: rgba(255, 255, 255, 0.85); /* 稍微透明，透出背景圖 */
            padding: 10px; 
            box-sizing: border-box; 
            border: 2px solid #e2e8f0;
            backdrop-filter: blur(5px);
        }
        .cell::after {
            content: "";
            position: absolute;
            bottom: calc(-1 * var(--road-height) - 10px); /* 貼在格子下方 */
            left: -10px; 
            right: -10px;
            height: var(--road-height);
            background: #4a5568; /* 深灰色馬路 */
            border-bottom: 4px solid #cbd5e0; /* 路邊石 */
            z-index: 1;
        }

        /* 加上馬路白線 */
        .cell::before {
            content: "";
            position: absolute;
            bottom: calc(-1 * var(--road-height) / 2 - 8px);
            left: 10%;
            right: 10%;
            height: 2px;
            border-top: 2px dashed rgba(255,255,255,0.3);
            z-index: 2;
        }

        .cell-text { font-size: 22px; font-weight: 900; color: #2d3748; z-index: 3; }
        .cell-index { position: absolute; top: 8px; left: 10px; font-size: 14px; color: #a0aec0; }
        
        /* 修正：換回你的小狗小貓圖片 */
        .player { 
            width: 65px; 
            height: 65px; 
            position: absolute; 
            z-index: 100; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }
        #p1 { background-image: url('images/p1.png'); }
        #p2 { background-image: url('images/p2.png'); }
        /* 當可以移動時，讓棋子跳動並發光 */
        .can-move { 
            animation: bounce 0.6s infinite alternate; 
            cursor: pointer; 
            filter: drop-shadow(0 0 15px #48bb78) brightness(1.2) !important; }
        @keyframes bounce { 
            from { transform: translateY(0); } 
            to { transform: translateY(-20px); }
        }

        #controls { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: rgba(255, 255, 255, 0.95); 
            display: flex; justify-content: center; align-items: center; 
            gap: 30px; padding: 20px; z-index: 100; 
            box-shadow: 0 -10px 30px rgba(0,0,0,0.05); 
            backdrop-filter: blur(10px);
        }

        #dice-box { font-size: 45px; padding: 10px 25px; background: #edf2f7; border-radius: 15px; min-width: 60px; text-align: center; }
        
        #btn-roll { 
            padding: 15px 40px; font-size: 22px; background: #48bb78; 
            color: white; border: none; border-radius: 50px; 
            cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        #btn-roll:hover { background: #38a169; transform: scale(1.05); }
        #btn-roll:disabled { background: #cbd5e0; transform: scale(1); }

        /* 彈窗樣式 */
        #modal { 
            display: none; position: fixed; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            background: white; padding: 40px; border-radius: 40px; 
            z-index: 300; box-shadow: 0 30px 100px rgba(0,0,0,0.4); 
            text-align: center; width: 90%; max-width: 450px;
            border: 10px solid #ebf8ff;
        }

        #modal-text { font-size: 70px; font-weight: 900; margin: 25px 0; cursor: pointer; color: #2b6cb0; }
        .event-icon { font-size: 30px; position: absolute; bottom: 5px; right: 8px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="board"></div>
    <div id="p1" class="player" onclick="handlePlayerClick(0)"></div>
    <div id="p2" class="player" onclick="handlePlayerClick(1)"></div>
</div>

<div id="controls">
    <div style="font-size: 20px; font-weight: bold; color: #4a5568;">
        <span style="color:var(--p1-color)">P1: <span id="s1">0</span></span> | 
        <span style="color:var(--p2-color)">P2: <span id="s2">0</span></span>
    </div>
    <div id="status" style="font-size: 20px; font-weight: bold;">輪到：<span id="player-turn-name" style="color:var(--p1-color)">玩家 1</span></div>
    <div id="dice-box">🎲</div>
    <button id="btn-roll" onclick="roll()">擲骰子</button>
</div>

<div id="modal">
    <div id="timer" style="font-size: 22px; color: #e67e22; font-weight: bold;">⏳ 剩餘時間: 60s</div>
    <div id="modal-text" onclick="speak()">詞語</div>
    <p style="font-size: 16px; color: #a0aec0; margin-bottom: 25px;">💡 點擊詞語可重複聽讀音</p>
    <div style="display: flex; gap: 15px; flex-direction: column;">
        <button onclick="startRecognition()" style="padding: 12px; background: #4299e1; color: white; border: none; border-radius: 15px; font-size: 18px; cursor: pointer; font-weight: bold;">🤖 AI 檢查讀音</button>
        <button onclick="closeModal()" style="padding: 18px; background: #48bb78; color: white; border: none; border-radius: 20px; font-size: 22px; cursor: pointer; font-weight: bold;">我讀好了！</button>
    </div>
</div>

<script>
    const words = ["起點", "學校", "禮堂", "校務處", "操場", "音樂室", "課室", "洗手間", "電腦室", "樓梯", "圖書館", "走廊", "升降機", "教員室", "草地上", "沙灘", "山頂", "運動場", "籃球場", "足球場", "燒烤場", "公園", "家裏", "客廳", "浴室", "睡房", "廚房", "清真寺", "商場", "超市", "街市", "麵包店", "理髮店", "便利店", "藥房", "餐廳", "醫院", "補習社", "博物館", "銀行", "地鐵站", "巴士站", "行人道", "刷牙", "洗澡", "洗手", "喝水", "吃飯", "睡覺", "穿衣服", "戴口罩", "做家務", "倒垃圾", "洗碗", "抹窗戶", "煮飯", "上課", "做功課", "溫習", "看書", "畫畫", "做早操", "跑步", "游泳", "跳繩", "踢足球", "打籃球", "騎單車", "遠足", "拍照", "表演", "唱歌", "跳舞", "慶祝", "排隊", "玩遊戲", "看手機", "打電話", "打招呼", "買水果", "比賽", "說話", "摺紙", "下棋", "玩拼圖", "🏆 終點"];
    const players = [{pos: 0, score: 0}, {pos: 0, score: 0}];
    const traps = [5, 12, 25, 40, 55, 70], boosts = [8, 20, 35, 50, 65, 80];
    const dinosaurs = [2]; // 🦖 新增恐龍位置
    
    // ✅ 修正 1：定義缺少的變數
    let turn = 0, dice = 0, moving = false, timerInterval;
    let waitingForClick = false; 

    function init() {
        const board = document.getElementById('board');
        board.innerHTML = "";
        words.forEach((w, i) => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = 'c' + i;
            
            // --- 修正後的圖標判斷邏輯 ---
            let iconText = "";
            if(traps.includes(i)) {
                iconText = "🍌";
            } else if(boosts.includes(i)) {
                iconText = "🚀";
            } else if(dinosaurs.includes(i)) {
                iconText = "🦖";
            }

            cell.innerHTML = `
                <span class="cell-index">${i}</span>
                <div class="cell-text">${w}</div>
                <span class='event-icon'>${iconText}</span>
            `;
            board.appendChild(cell);
        });
        setTimeout(updateDisplay, 200);
    }

        function updateDisplay() {
    players.forEach((p, i) => {
        const cell = document.getElementById('c' + p.pos);
        const pEl = document.getElementById('p' + (i + 1));
        
        // 1. 左右位置：兩隻都鎖定在格子中心
        // cell.offsetWidth / 2 是中心，再減去棋子寬度的一半 (約 32px)
        const centerX = cell.offsetLeft + (cell.offsetWidth / 2) - 32;
        pEl.style.left = centerX + 'px';
        
        // 2. 上下位置：根據玩家編號 (i) 分上下兩層
        // cell.offsetTop + cell.offsetHeight 是格子底部
        const baseTop = cell.offsetTop + cell.offsetHeight;
        
        if (i === 0) {
            // 玩家 1 (小貓)：站在馬路的上半部
            pEl.style.top = (baseTop - 5) + 'px';
        } else {
            // 玩家 2 (小狗)：站在馬路的下半部 (往下移 40px)
            pEl.style.top = (baseTop + 30) + 'px';
        }
    });
}

    async function roll() {
        if(moving || waitingForClick) return; 
        document.getElementById('btn-roll').disabled = true;

        for(let i=0; i<8; i++) {
            dice = Math.floor(Math.random()*6)+1;
            document.getElementById('dice-box').innerText = dice;
            await new Promise(r => setTimeout(r, 60));
        }

        // ✅ 進入等待點擊狀態
        waitingForClick = true; 
        document.getElementById('p' + (turn + 1)).classList.add('can-move'); 
        document.getElementById('player-turn-name').innerText = "👈 請點擊棋子行走！";
    }

    // ✅ 修正 2：補上處理棋子點擊的函數
    async function handlePlayerClick(pid) {
        if (!waitingForClick || pid !== turn || moving) return;

        waitingForClick = false;
        document.getElementById('p' + (turn + 1)).classList.remove('can-move');
        document.getElementById('player-turn-name').innerText = "正在行走...";
        
        await move(pid); 
    }
        
    async function move(pid) {
        moving = true;
        for(let i=0; i<dice; i++) {
            if (players[pid].pos < words.length - 1) {
                players[pid].pos++;
                updateDisplay();
                await new Promise(r => setTimeout(r, 300));
            }
        }
        
        // 檢查特殊事件
      if(traps.includes(players[pid].pos)) { 
            // 1. 先跳出提示
            alert("🍌 哎呀！踩到香蕉皮滑倒了！\n點擊棋子後退 3 格。"); 
            
            // 2. 準備後退的邏輯
            players[pid].pos = Math.max(0, players[pid].pos - 3);

          updateDisplay();
            
            // 3. 進入「等待點擊」狀態，讓玩家點了才執行移動
            prepareSpecialClick(pid);
            return; // 結束 move 函數，不要進入 showModal
        }

        if(boosts.includes(players[pid].pos)) { 
            // 1. 先跳出提示
            alert("🚀 太棒了！坐上火箭衝刺！\n點擊棋子前進 5 格。"); 
            
            // 2. 準備前進的邏輯
            players[pid].pos = Math.min(words.length-1, players[pid].pos + 5);

            updateDisplay();
            
            // 3. 進入「等待點擊」狀態
            prepareSpecialClick(pid);
            return; // 結束 move 函數，不要進入 showModal
        }
        
        // --- 🦖 處理恐龍事件 ---
           // --- 🦖 處理恐龍事件 ---
        if(dinosaurs.includes(players[pid].pos)) { 
            alert("🦖 糟了！遇到大恐龍！\n請點擊棋子後退 1 格。"); 
            
            // 預設好後退後的位置
            players[pid].pos = Math.max(0, players[pid].pos - 1); 

            updateDisplay();
            
            // 使用你寫好的 prepareSpecialClick 讓棋子開始跳動等待點擊
            prepareSpecialClick(pid);
            return; 
        }
        
        // 如果沒有觸發事件，則正常檢查終點或顯示詞語
        checkEndOrModal(pid);
    }

    // 💡 新增：專門處理「特殊移動前」的點擊準備
    function prepareSpecialClick(pid) {
        moving = false; 
        waitingForClick = true; 
        document.getElementById('p' + (pid + 1)).classList.add('can-move');
        // 提示玩家再次點擊
        document.getElementById('player-turn-name').innerText = "👈 請點擊棋子執行移動！";
    }

    // 💡 新增：將原本 move 結尾的判斷抽出來
    function checkEndOrModal(pid) {
        moving = false;
        if(players[pid].pos === words.length-1) {
            alert(`🏆 恭喜玩家 ${pid + 1} 成功挑戰 88 關！`);
            location.reload();
        } else {
            showModal();
        }
    }

    // 彈窗與語音功能
    function showModal() {
        document.getElementById('modal-text').innerText = words[players[turn].pos];
        document.getElementById('modal').style.display = 'block';
        speak();
        let timeLeft = 60;
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = `⏳ 剩餘時間: ${timeLeft}s`;
            if(timeLeft <= 0) closeModal(false);
        }, 1000);
    }

    function closeModal(addScore = true) {
        clearInterval(timerInterval);
        if(addScore) {
            players[turn].score += 10;
            document.getElementById('s' + (turn + 1)).innerText = players[turn].score;
        }
        document.getElementById('modal').style.display = 'none';
        turn = (turn === 0) ? 1 : 0;
        const turnName = document.getElementById('player-turn-name');
        turnName.innerText = `玩家 ${turn + 1}`;
        turnName.style.color = turn === 0 ? 'var(--p1-color)' : 'var(--p2-color)';
        document.getElementById('btn-roll').disabled = false;
        moving = false;
    }

    function speak() {
        window.speechSynthesis.cancel();
        const textToSpeak = document.getElementById('modal-text').innerText.trim();
        // ✨ 下一行要把括號裡的內容換成 textToSpeak
        const msg = new SpeechSynthesisUtterance(textToSpeak); 
        msg.lang = 'zh-HK';
        msg.rate = 0.85;
        window.speechSynthesis.speak(msg);
    }

    function startRecognition() { alert("AI 檢查功能需要權限。"); }
    window.onload = init;
    window.onresize = updateDisplay;
</script>

</body>
</html>
