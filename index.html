<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=">
    <title>語文大作戰</title>
    <link rel="stylesheet" href="style.css">
</head>
    
<body>
    <div id="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1999;"></div> 

    <div id="start-screen">
        <h1 class="start-title">語文大作戰</h1>

        <div class="selection-container">
            <div class="player-preview">
                <h3 id="p1-hint" class="hint-label p1-theme">點擊下面更換角色</h3>
                <div id="p1-big-preview" class="preview-box" onclick="resetSelection(1)">
                    <span class="placeholder-text">P1 棋子</span>
                </div>
            </div>

            <div id="character-pool-wrapper">
                <div id="selection-hint">請 玩家 1 選擇一個角色</div>
                <div id="character-pool">
                    <img src="images/dragon.png" class="char-opt" onclick="selectChar(this, 'images/dragon.png')">
                    <img src="images/fish.png" class="char-opt" onclick="selectChar(this, 'images/fish.png')">
                    <img src="images/snail.png" class="char-opt" onclick="selectChar(this, 'images/snail.png')">
                    <img src="images/octopus.png" class="char-opt" onclick="selectChar(this, 'images/octopus.png')">
                    <img src="images/cat.png" class="char-opt" onclick="selectChar(this, 'images/cat.png')">
                    <img src="images/dog.png" class="char-opt" onclick="selectChar(this, 'images/dog.png')">
                    <img src="images/bee.png" class="char-opt" onclick="selectChar(this, 'images/bee.png')">
                    <img src="images/fairy.png" class="char-opt" onclick="selectChar(this, 'images/fairy.png')">
                    <img src="images/turtle.png" class="char-opt" onclick="selectChar(this, 'images/turtle.png')">
                    <img src="images/knight.png" class="char-opt" onclick="selectChar(this, 'images/knight.png')">
                    <img src="images/star.png" class="char-opt" onclick="selectChar(this, 'images/star.png')">
                    <img src="images/panda.png" class="char-opt" onclick="selectChar(this, 'images/panda.png')">
                </div>
                <button id="start-game-btn" onclick="startGame()">開始大作戰</button>
            </div>

            <div class="player-preview">
                <h3 id="p2-hint" class="hint-label p2-theme">點擊下面更換角色</h3>
                <div id="p2-big-preview" class="preview-box" onclick="resetSelection(2)">
                    <span class="placeholder-text">P2 棋子</span>
                </div>
            </div>
        </div> 
    </div>

    <!-- 背景音樂開關 -->
    <button type="button" id="music-ctrl" class="music-ctrl-btn is-muted" aria-label="開啟背景音樂" title="開啟背景音樂">
        <span class="music-ctrl-icon" aria-hidden="true">🔇</span>
    </button>
    
    <!-- 遊戲容器：棋盤與玩家棋子（終點格由 script.js 動態建立） -->
    <div id="game-container" style="display:none;">
        <div id="board"></div>
        <div id="p1" class="player" onclick="handlePlayerClick(0)"></div>
        <div id="p2" class="player" onclick="handlePlayerClick(1)"></div>
    </div>

    <div id="controls"> 
        <div id="player-turn-name">玩家 1</div>
        <div id="dice-box">
            <div class="dice-face face-1">1</div>
            <div class="dice-face face-2">2</div>
            <div class="dice-face face-3">3</div>
            <div class="dice-face face-4">4</div>
            <div class="dice-face face-5">5</div>
            <div class="dice-face face-6">6</div>
        </div>
        <button id="btn-roll" onclick="roll()">擲骰子</button>
    </div>

<div id="modal" style="display:none; flex-direction:column;">
    <div id="reorder-meta-header" class="reorder-only" aria-hidden="true">
        <h2 class="reorder-main-title">【 重組句子 】</h2>
    </div>
    <div id="timer" class="modal-timer" aria-live="polite">⏳ 剩餘時間: 120s</div>
    <div id="modal-content"></div>
    <p id="reorder-structure-hint" class="reorder-only reorder-structure-hint" aria-hidden="true">時間 &gt; 人物 &gt; 地點 &gt; 事情</p>
    <div id="answer-celebration" class="answer-celebration" hidden aria-hidden="true">
        <div class="celebration-confetti" aria-hidden="true"></div>
        <p id="celebration-answer-text" class="celebration-answer-text"></p>
        <p id="celebration-praise-text" class="celebration-praise-text"></p>
    </div>
    <div id="modal-actions"></div>
</div>

    <div id="win-modal" style="display:none;" aria-hidden="true" role="presentation">
        <canvas id="win-confetti-canvas" class="win-confetti-canvas" aria-hidden="true"></canvas>
        <div class="win-content" role="dialog" aria-modal="true" aria-labelledby="win-headline">
            <h2 id="win-headline" class="win-headline">🏆 大獲全勝！</h2>
            <p id="win-subheadline" class="win-subheadline">👑 恭喜 玩家 <span id="win-player-num">1</span> 榮登中文棋王！</p>
            <button type="button" onclick="restartGame()" class="win-btn">再玩一局</button>
        </div>
    </div>

    <div id="test-panel" role="region" aria-label="題型測試面板">
        <div class="test-panel-drag-handle" title="拖曳移動面板">⋮⋮ 題型測試面板</div>
        <p class="test-panel-hint">遊戲中隨時可用：先點棋子，再點格子即可移動</p>
        <button type="button" class="test-panel-btn" data-test-type="fill">1. 供詞填充</button>
        <button type="button" class="test-panel-btn" data-test-type="reorder">2. 重組句子</button>
        <button type="button" class="test-panel-btn" data-test-type="match">3. 看圖配詞</button>
        <button type="button" class="test-panel-btn" data-test-type="radical">4. 部件辨析</button>
        <button type="button" class="test-panel-btn" data-test-type="punc">5. 標點符號</button>
        <button type="button" class="test-panel-btn" data-test-type="continue">6. 續寫句子</button>
        <button type="button" class="test-panel-btn" data-test-type="stroke">7. 筆順辨認</button>
        <button type="button" class="test-panel-btn" data-test-type="understand">8. 閱讀理解</button>
        <button type="button" id="test-panel-close" class="test-panel-btn test-panel-close">❌ 關閉測試面板</button>
    </div>

    <!-- 教師解鎖：左上角花朵，0.5 秒內連點 2 次 -->
    <button type="button" id="secret-flower" class="secret-flower" aria-label="裝飾" title="">🌸</button>

    <script src="freesound-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
