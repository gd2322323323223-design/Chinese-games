<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>詞語大作戰</title>
<style>
:root { 
    --p1-color: #3182ce; 
    --p2-color: #d53f8c; 
    --cell-size: 90px; 
    --road-height: 90px;
}

/* --- 1. 基礎背景與字體 --- */
body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url('images/forest-bg.jpg'); 
    background-size: cover;
    background-position: center;
    filter: blur(8px);
    z-index: -1;
}

body {
    font-family: "Microsoft JhengHei", sans-serif;
    margin: 0;
    background-color: transparent;   
    position: relative;
    overflow-y: scroll;
    padding-bottom: 200px;
    min-height: 100vh;
}

/* --- 2. 首頁 (Start Screen) 三欄式佈局 --- */
#start-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255, 255, 255, 0.1);
    z-index: 5000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
}

#game-title {
    font-size: 60px; color: #5d4037; font-weight: 900;
    text-shadow: 4px 4px 0px #fff, 8px 8px 15px rgba(0,0,0,0.1);
    margin-bottom: 20px;
}

.selection-container {
    display: flex; align-items: center; gap: 40px; width: 95%; max-width: 1400px;
}

.player-preview { flex: 1; display: flex; flex-direction: column; align-items: center; }
.player-preview h3 { color: #5d4037; font-size: 20px; margin-bottom: 10px; }

.preview-box {
    width: 250px; height: 250px;
    background: rgba(255,255,255,0.4); 
    border-radius: 30px; border: 8px solid white;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
}
.preview-box img { width: 85%; height: 85%; object-fit: contain; }
.preview-box p { color: #718096; font-weight: bold; }

.player-label {
    margin-top: 15px; padding: 8px 20px; border-radius: 10px; background: white;
    font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

#character-pool-wrapper { flex: 1.5; text-align: center; }

#character-pool {
    display: grid;
    grid-template-columns: repeat(4, 90px); 
    gap: 12px;
    padding: 25px;
    background: rgba(255, 255, 255, 0.6); 
    border-radius: 30px;
    border: 2px solid rgba(255, 255, 255, 0.8);
    box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    margin: 0 auto;
    width: fit-content;
}

.char-opt {
    width: 80px; height: 80px; background: white; border-radius: 20px;
    padding: 10px; cursor: pointer; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 4px 6px rgba(0,0,0,0.05); object-fit: contain; border: 4px solid transparent;
}
.char-opt:hover { transform: translateY(-10px) rotate(5deg) scale(1.1); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }

/* --- 3. 遊戲中棋盤樣式 (完整保留) --- */
#game-container { position: relative; width: 95%; max-width: 1400px; margin: 20px auto; }

#board { 
    display: grid; grid-template-columns: repeat(10, 1fr); gap: 140px 15px; 
    padding: 40px 40px 150px 40px; border-radius: 40px; 
    background-image: url("images/board-bg.png") !important; 
    background-size: cover; background-position: center; border: 12px solid #8d6e63;
    outline: 6px solid #5d4037; box-shadow: 0 15px 0 #5d4037, 0 30px 60px rgba(0,0,0,0.4); 
}

.cell { 
    height: var(--cell-size); border-radius: 20px; display: flex; flex-direction: column; 
    align-items: center; justify-content: center; position: relative; transition: 0.3s; 
    background-color: rgba(255, 255, 255, 0.9); border: 2px solid #e2e8f0; backdrop-filter: blur(5px);
}

.cell.goal-cell {
    grid-column: span 2; grid-row: span 2; height: auto;
    min-height: calc(var(--cell-size) * 2 + 130px); 
    background: linear-gradient(135deg, #fff5f5 0%, #fff 100%) !important;
    border: 6px solid #f56565 !important; z-index: 5;
    display: flex !important; flex-direction: column !important; justify-content: center !important;
}

.cell::after {
    content: ""; position: absolute; bottom: -110px; left: -10px; right: -10px;
    height: var(--road-height); background: #a1887f; border-bottom: 6px solid #795548; 
    z-index: 1; border-radius: 15px;
}

.cell::before {
    content: ""; position: absolute; bottom: calc(-110px + (var(--road-height) / 2));
    left: 10%; right: 10%; height: 2px; border-top: 2px dashed rgba(255, 255, 255, 0.4); z-index: 2;
}

.cell-text { font-size: 30px; font-weight: 900; color: #1a202c; z-index: 3; }

.player { 
    width: 65px; height: 65px; position: absolute; z-index: 100; 
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    background-size: contain; background-repeat: no-repeat; background-position: center;
}

#p1 { background-image: url('images/p1.png'); }
#p2 { background-image: url('images/p2.png'); }

/* --- 4. 控制區與按鈕 --- */
#controls { 
    position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.95); 
    display: flex; justify-content: center; align-items: center; gap: 30px; padding: 20px; 
    z-index: 100; box-shadow: 0 -10px 30px rgba(0,0,0,0.05); 
}

#start-game-btn {
    margin-top: 40px; padding: 18px 80px; font-size: 28px; font-weight: 900;
    color: white; border: none; border-radius: 50px; cursor: pointer;
    background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
    box-shadow: 0 10px 0 #2f855a, 0 15px 30px rgba(0,0,0,0.2);
    animation: pulse 2s infinite;
}

@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

#btn-roll { padding: 15px 40px; font-size: 22px; background: #48bb78; color: white; border: none; border-radius: 50px; cursor: pointer; }
#btn-roll:hover { background: #38a169; transform: scale(1.05); }

/* 響應式：手機版 */
@media (max-width: 800px) {
    .selection-container { flex-direction: column; gap: 20px; }
    #character-pool { grid-template-columns: repeat(3, 80px); }
    .preview-box { width: 150px; height: 150px; }
}
</style>
    
</head>
<body>
    <div id="start-screen">
    <h1 id="game-title">詞語大作戰</h1>

    <div class="selection-container">
        
        <div class="player-preview">
            <h3>P1 玩家已經選擇了</h3>
            <div class="preview-box" id="p1-big-preview">
                <p>等待選擇...</p>
            </div>
            <div class="player-label p1-label">P1 已選：<span id="p1-choice-name">無</span></div>
        </div>

        <div id="character-pool-wrapper">
            <p id="selection-hint">請 玩家 1 選擇一個角色</p>
            <div id="character-pool">
                <img src="images/dragon.png" class="char-opt" onclick="selectChar(this, 'images/dragon.png', '小恐龍')">
                <img src="images/fish.png" class="char-opt" onclick="selectChar(this, 'images/fish.png', '小丑魚')">
                <img src="images/snail.png" class="char-opt" onclick="selectChar(this, 'images/snail.png', '小蝸牛')">
                <img src="images/octopus.png" class="char-opt" onclick="selectChar(this, 'images/octopus.png', '小章魚')">
                <img src="images/cat.png" class="char-opt" onclick="selectChar(this, 'images/cat.png', '小花貓')">
                <img src="images/dog.png" class="char-opt" onclick="selectChar(this, 'images/dog.png', '柯基犬')">
                <img src="images/bee.png" class="char-opt" onclick="selectChar(this, 'images/bee.png', '小蜜蜂')">
                <img src="images/fairy.png" class="char-opt" onclick="selectChar(this, 'images/fairy.png', '小仙女')">
                <img src="images/turtle.png" class="char-opt" onclick="selectChar(this, 'images/turtle.png', '小海龜')">
                <img src="images/knight.png" class="char-opt" onclick="selectChar(this, 'images/knight.png', '小騎士')">
                <img src="images/star.png" class="char-opt" onclick="selectChar(this, 'images/star.png', '星星')">
                <img src="images/panda.png" class="char-opt" onclick="selectChar(this, 'images/panda.png', '大熊貓')">
            </div>
        </div>

        <div class="player-preview">
            <h3>P2 玩家已經選擇了</h3>
            <div class="preview-box" id="p2-big-preview">
                <p>等待選擇...</p>
            </div>
            <div class="player-label p2-label">P2 已選：<span id="p2-choice-name">無</span></div>
        </div>
    </div>

    <button id="start-game-btn" onclick="startGame()">開始大作戰</button>
</div>

    <div id="music-ctrl" onclick="toggleBGM()" style="position:fixed; top:20px; right:20px; z-index:1000; cursor:pointer; font-size:30px; background:white; border-radius:50%; width:50px; height:50px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,0.2);">
        🎵
    </div>
    
    <div id="game-container">
        <div id="board"></div>
        <div id="p1" class="player" onclick="handlePlayerClick(0)"></div>
        <div id="p2" class="player" onclick="handlePlayerClick(1)"></div>
    </div>
    
    <div id="controls">
        <div style="font-size: 20px; font-weight: bold; color: #4a5568;">
            <span style="color:var(--p1-color)">P1: <span id="s1">0</span></span> | 
            <span style="color:var(--p2-color)">P2: <span id="s2">0</span></span>
        </div>
        <div id="status" style="font-size: 20px; font-weight: bold;">輪到：<span id="player-turn-name" style="color:var(--p1-color)">玩家 1</span></div>
        <div id="dice-box">🎲</div>
        <button id="btn-roll" onclick="roll()">擲骰子</button>
    </div>

    <div id="modal">
        <div id="timer" style="font-size: 18px; color: #e67e22; font-weight: bold;">⏳ 剩餘時間: 120s</div>
        <div id="modal-text" onclick="speak()">詞語</div>
        <div id="ai-sentence-box" style="margin: 15px 0; padding: 15px; background: #f7fafc; border-left: 5px solid #4299e1; border-radius: 10px; text-align: left;">
            <div style="font-size: 14px; color: #4299e1; font-weight: bold; margin-bottom: 5px;">🤖 AI 老師造句：</div>
            <div id="ai-sentence-text" style="font-size: 20px; color: #4a5568; line-height: 1.4;">這是一個例句。</div>
        </div>
        <p style="font-size: 14px; color: #a0aec0; margin-bottom: 20px;">💡 點擊詞語可重複聽讀音</p>
        <div style="display: flex; gap: 15px; flex-direction: column;">
            <button onclick="startRecognition()" style="padding: 12px; background: #5d4037; color: white; border: none; border-radius: 15px; font-size: 18px; cursor: pointer; font-weight: bold;">🎤 AI 老師聽讀音</button>
            <button onclick="closeModal(true)" style="padding: 12px; background: #48bb78; color: white; border: none; border-radius: 15px; font-size: 18px; cursor: pointer; font-weight: bold;">✅ 我讀好了！</button>
        </div>
    </div>
    
<script>
// --- 核心變數與遊戲狀態 ---
let selectedP1 = "";
let selectedP2 = "";
let currentSelectingPlayer = 1; // 1 代表 P1 選, 2 代表 P2 選
let pendingSteps = 0; 
let turn = 0, dice = 0, moving = false, timerInterval;
let waitingForClick = false; 
let specialEventActive = false;

const players = [{pos: 0, score: 0}, {pos: 0, score: 0}];
const traps = [1, 16, 39, 48, 61, 76, 96];
const boosts = [8, 20, 32, 51, 68, 80, 90];
const dinosaurs = [5, 12, 27, 43, 55, 70, 86, 103]; 

function selectChar(element, imgPath) {
    if (imgPath === selectedP1 || imgPath === selectedP2) {
        alert("這個角色已經被選走囉！請選其他的。");
        return;
    }
    if (currentSelectingPlayer === 1) {
        selectedP1 = imgPath;
        document.getElementById('p1-choice-name').innerText = imgPath.split('/').pop().replace('.png', '');
        currentSelectingPlayer = 2;
        const hint = document.getElementById('selection-hint');
        if(hint) {
            hint.innerText = "請 玩家 2 選擇一個角色";
            hint.style.color = "var(--p2-color)";
        }
    } else {
        selectedP2 = imgPath;
        document.getElementById('p2-choice-name').innerText = imgPath.split('/').pop().replace('.png', '');
        currentSelectingPlayer = 1;
        const hint = document.getElementById('selection-hint');
        if(hint) {
            hint.innerText = "選擇完成！可以點擊下方按鈕開始遊戲。";
            hint.style.color = "#48bb78";
        }
    }
    updateHighlight();
}

// 更新視覺反饋
function updateHighlight() {
    const opts = document.querySelectorAll('.char-opt');
    opts.forEach(opt => {
        const path = opt.getAttribute('src');
        opt.style.border = "4px solid transparent";
        opt.style.opacity = "1";

        if (path === selectedP1) {
            opt.style.border = "5px solid var(--p1-color)";
        } 
        if (path === selectedP2) {
            opt.style.border = "5px solid var(--p2-color)";
            opt.style.opacity = "0.6";
        }
    });
}

// 開始遊戲按鈕
function startGame() {
    if (!selectedP1 || !selectedP2) {
        alert("兩位玩家都必須選擇角色喔！");
        return;
    }
    document.getElementById('p1').style.backgroundImage = `url('${selectedP1}')`;
    document.getElementById('p2').style.backgroundImage = `url('${selectedP2}')`;
    document.getElementById('start-screen').style.display = 'none';
    
    // 注意：這裡要確保你的音效對象 audio 已經在後面定義了
    if (typeof audio !== 'undefined' && audio.bgm.paused) toggleBGM();
}

// --- 音效初始化 ---
const audio = {
    bgm: new Audio('sounds/bgm.mp3'),
    dice: new Audio('sounds/sounds_dice.mp3'),
    win: new Audio('sounds/win.mp3')
};

// 背景音樂設定：循環播放、音量適中
audio.bgm.loop = true;
audio.bgm.volume = 0.1;

// 控制背景音樂開關
function toggleBGM() {
    if (audio.bgm.paused) {
        audio.bgm.play().catch(e => console.log("音樂播放被瀏覽器阻擋:", e));
        document.getElementById('music-ctrl').innerText = "🎶";
    } else {
        audio.bgm.pause();
        document.getElementById('music-ctrl').innerText = "🔇";
    }
}

// 播放音效輔助函式
function playSound(name) {
    if (audio[name]) {
        audio[name].currentTime = 0; // 每次播放重置時間，確保連點有效
        audio[name].play().catch(e => {});
    }
}

// --- 修改現有的函式來觸發音效 ---

// 1. 修改擲骰子函式
async function roll() {
    if(moving || waitingForClick) return;
    
    // 🎲 播放擲骰子音效
    playSound('dice');
    
    document.getElementById('btn-roll').disabled = true;
    for(let i=0; i<8; i++) {
        dice = Math.floor(Math.random()*6)+1;
        document.getElementById('dice-box').innerText = dice;
        await new Promise(r => setTimeout(r, 60));
    }
    waitingForClick = true;
    document.getElementById('p' + (turn + 1)).classList.add('can-move');
    document.getElementById('player-turn-name').innerText = "👈 請點擊棋子行走！";
}

// 2. 修改檢查終點與彈窗的函式
async function checkEndOrModal(pid) {
    const pos = players[pid].pos;
    const isGoal = (pos === words.length - 1);
    const isSpecial = traps.includes(pos) || boosts.includes(pos) || dinosaurs.includes(pos);

    if (isGoal) {
        // 🏆 播放獲勝音效
        playSound('win');
        
        await fancyAlert(`🏆 玩家 ${pid + 1} 奪冠！`, "goal");
        location.reload();
    } else if (isSpecial || pos === 0) {
        finishTurn();
    } else {
        showModal();
    }
}

// --- 1. 建立詞語與地圖對應表 ---
const rawWords = Object.keys(customDictionary);
let words = [];
let wordIdx = 0;

// 生成 110 格的地圖資料
for (let i = 0; i < 110; i++) {
    if (i === 0) {
        words.push("起點");
    } else if (traps.includes(i) || boosts.includes(i) || dinosaurs.includes(i)) {
        words.push(""); // 特殊格不放文字
    } else if (wordIdx < rawWords.length) {
        words.push(rawWords[wordIdx]); 
        wordIdx++;
    } else {
        words.push("終點 🏆"); 
        break; // 到達詞庫上限或終點就停止
    }
}

// --- 2. 棋盤渲染函數 ---
function init() {
    const board = document.getElementById('board');
    if (!board) return;
    board.innerHTML = "";
    let displayIndex = 1; 

    words.forEach((w, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = 'c' + i;
        
        const isGoal = (i === words.length - 1);
        const isStart = (i === 0);
        const isSpecial = traps.includes(i) || boosts.includes(i) || dinosaurs.includes(i);

        if (isGoal) cell.classList.add('goal-cell');

        let iconText = "";
        if(traps.includes(i)) iconText = "🍌";
        else if(boosts.includes(i)) iconText = "🚀";
        else if(dinosaurs.includes(i)) iconText = "🦖";

        // 生成編號（僅限普通詞語格）
        let numberHtml = "";
        if (!isStart && !isGoal && !isSpecial) {
            numberHtml = `<span class="cell-index">${displayIndex}</span>`;
            displayIndex++;
        }

        cell.innerHTML = `
            ${numberHtml}
            ${isGoal ? 
                `<div class="event-icon" style="font-size: 80px;">🏆</div><div class="cell-text">終點</div>` :
                (w !== "" ? 
                    `<div class="cell-text">${w}</div><span class="event-icon" style="position: absolute; bottom: 5px; right: 8px; font-size: 24px;">${iconText}</span>` :
                    `<div class="event-icon" style="font-size: 50px;">${iconText}</div>`
                )
            }
        `;
        board.appendChild(cell);
    });
    
    // 初始化後立即定位棋子
    setTimeout(updateDisplay, 100);
}

// --- 3. 棋子定位函數 ---
function updateDisplay() {
    players.forEach((p, i) => {
        const cell = document.getElementById('c' + p.pos);
        const pEl = document.getElementById('p' + (i + 1));
        if (!cell || !pEl) return;

        // 計算格子中心位置
        const centerX = cell.offsetLeft + (cell.offsetWidth / 2) - (pEl.offsetWidth / 2);
        pEl.style.left = centerX + 'px';

        if (cell.classList.contains('goal-cell')) {
            const centerY = cell.offsetTop + (cell.offsetHeight / 2) + (i === 0 ? -40 : 20);
            pEl.style.top = centerY + 'px';
        } else {
            // 讓棋子站在路徑（Road Area）上
            const roadAreaTop = cell.offsetTop + cell.offsetHeight + 15; 
            pEl.style.top = (i === 0 ? roadAreaTop - 10 : roadAreaTop + 35) + 'px';
        }
    });
}

// ✨ 修復核心：處理玩家點擊（包含正常移動與特殊事件後續移動）
async function handlePlayerClick(pid) {
    if (!waitingForClick || pid !== turn || moving) return;
    
    waitingForClick = false; // 立即關閉點擊許可，防止連點
    document.getElementById('p' + (turn + 1)).classList.remove('can-move');

    if (specialEventActive) {
        // 如果是特殊事件（如踩到香蕉）引發的點擊
        let steps = pendingSteps;
        specialEventActive = false;
        pendingSteps = 0;
        await moveSteps(pid, steps);
        checkEndOrModal(pid); // 移動完後再檢查
    } else {
        // 正常的擲骰子移動
        await move(pid);
        // 注意：move 內部會處理是否觸發特殊事件彈窗
        // 如果 move 沒觸發特殊事件彈窗，會在這裡檢查彈窗
        if (!specialEventActive) {
            checkEndOrModal(pid);
        }
    }
}

async function move(pid) {
    moving = true;
    for(let i=0; i<dice; i++) {
        if (players[pid].pos < words.length - 1) {
            players[pid].pos++;
            updateDisplay();
            await new Promise(r => setTimeout(r, 300));
        }
    }
    moving = false;

    const pos = players[pid].pos;
    if(traps.includes(pos)) {
        await fancyAlert("🍌 哎呀！踩到香蕉滑倒了。<br><small>點擊棋子後退 1 格</small>");
        prepareSpecialStep(pid, -1);
    } else if(boosts.includes(pos)) {
        await fancyAlert("🚀 哈哈！坐上火箭衝刺！<br><small>點擊棋子前進 5 格</small>");
        prepareSpecialStep(pid, 5);
    } else if(dinosaurs.includes(pos)) {
        await fancyAlert("🦖 哇！是大恐龍！快逃...<br><small>點擊棋子後退 3 格</small>");
        prepareSpecialStep(pid, -3);
    }
}

function prepareSpecialStep(pid, steps) {
    moving = false;
    waitingForClick = true;
    specialEventActive = true; 
    pendingSteps = steps;
    document.getElementById('p' + (pid + 1)).classList.add('can-move');
    document.getElementById('player-turn-name').innerText = "👈 請點擊棋子執行特殊事件！";
}

async function moveSteps(pid, steps) {
    moving = true;
    const isForward = steps > 0;
    const totalSteps = Math.abs(steps);
    for (let i = 0; i < totalSteps; i++) {
        if (isForward) {
            if (players[pid].pos < words.length - 1) players[pid].pos++;
        } else {
            if (players[pid].pos > 0) players[pid].pos--;
        }
        updateDisplay();
        await new Promise(r => setTimeout(r, 300));
    }
    moving = false;
}

async function checkEndOrModal(pid) {
    const pos = players[pid].pos;
    const isGoal = (pos === words.length - 1);
    const isSpecial = traps.includes(pos) || boosts.includes(pos) || dinosaurs.includes(pos);

    if (isGoal) {
        playSound('win'); // 播放獲勝音效
        await fancyAlert(`🏆 玩家 ${pid + 1} 奪冠！`, "goal");
        location.reload();
    } else if (isSpecial || pos === 0) {
        // 如果落在特殊格（如火箭、香蕉、起點），不彈窗，直接結束回合
        finishTurn();
    } else {
        // 落在普通詞語格，顯示題目彈窗
        showModal();
    }
}

function showModal() {
    const currentWord = words[players[turn].pos];
    if (!currentWord || currentWord === "" || currentWord === "起點" || currentWord === "終點 🏆") { 
        finishTurn(); 
        return; 
    }
    
    // 取得預設好的句子
    const specificSentence = customDictionary[currentWord] || "請用這個詞語造一個句子。";

    document.getElementById('modal-text').innerText = currentWord;
    document.getElementById('ai-sentence-text').innerText = specificSentence; // 直接顯示特定句子

    document.getElementById('modal').style.display = 'block';
    
    let timeLeft = 120;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = `⏳ 剩餘時間: ${timeLeft}s`;
        if(timeLeft <= 0) closeModal(false);
    }, 1000);
}

function speak() {
    window.speechSynthesis.cancel();
    const word = document.getElementById('modal-text').innerText;
    const sentence = document.getElementById('ai-sentence-text').innerText;
    
    // 朗讀詞語 + 句子
    const msg = new SpeechSynthesisUtterance(`${word}。句子練習：${sentence}`);
    msg.lang = 'zh-HK';
    msg.rate = 0.8;
    window.speechSynthesis.speak(msg);
}

function startRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert("請使用 Chrome 瀏覽器以支援語音辨識。");
        return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = 'zh-HK';
    const modalText = document.getElementById('modal-text');
    const originalWord = modalText.innerText;
    modalText.innerHTML = `<span style="color:#4299e1">🎤 正在聽...讀出「${originalWord}」</span>`;
    recognition.start();

    recognition.onresult = (event) => {
        const result = event.results[0][0].transcript;
        if (result.includes(originalWord)) {
            modalText.innerHTML = `<div style="color:#48bb78">✅ 太棒了！</div>`;
            players[turn].score += 5;
            document.getElementById('s' + (turn + 1)).innerText = players[turn].score;
        } else {
            modalText.innerHTML = `<div style="color:#f56565">❌ 聽成: ${result}</div>`;
        }
        setTimeout(() => { modalText.innerText = originalWord; }, 2000);
    };
}

function fancyAlert(msg, type = 'event') {
    return new Promise(resolve => {
        const notice = document.createElement('div');
        notice.className = `special-notice notice-${type}`;
        notice.innerHTML = `${msg}<br><span style="font-size:16px; opacity:0.8;">( 點擊關閉並移動 )</span>`;
        document.body.appendChild(notice);
        setTimeout(() => notice.classList.add('show'), 10);
        notice.onclick = () => {
            notice.classList.remove('show');
            setTimeout(() => { notice.remove(); resolve(); }, 400);
        };
    });
}

function closeModal(addScore = true) {
    if (timerInterval) clearInterval(timerInterval);
    if (addScore) {
        players[turn].score += 10;
        document.getElementById('s' + (turn + 1)).innerText = players[turn].score;
    }
    document.getElementById('modal').style.display = 'none';
    finishTurn();
}

function finishTurn() {
    turn = (turn === 0) ? 1 : 0;
    const nameEl = document.getElementById('player-turn-name');
    nameEl.innerText = `輪到：玩家 ${turn + 1}`;
    nameEl.style.color = (turn === 0) ? 'var(--p1-color)' : 'var(--p2-color)';
    document.getElementById('btn-roll').disabled = false;
    moving = false;
    waitingForClick = false;
    specialEventActive = false;
}

window.onload = init;
</script>
