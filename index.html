<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中文詞語 88 關：究極挑戰版</title>
    <style>
       <style>
    :root { --p1-color: #3182ce; --p2-color: #d53f8c; --cell-size: 160px; }
    body { 
        font-family: "Microsoft JhengHei", sans-serif; 
        margin: 0; 
        background: #f0f4f8; 
        overflow-y: scroll; 
        padding-bottom: 200px; /* 修正原本過大的 padding */
    }
    /* ... 保持你原本其餘的 CSS 樣式不變 ... */
    #game-container { position: relative; width: 95%; max-width: 1400px; margin: 20px auto; }
    #board { 
        display: grid; grid-template-columns: repeat(10, 1fr); gap: 15px; padding: 25px; border-radius: 40px; 
        background-color: #fff; box-shadow: 0 25px 50px rgba(0,0,0,0.15); border: 12px solid white;
    }
    .cell { 
        height: var(--cell-size); border-radius: 25px; display: flex; flex-direction: column; 
        align-items: center; justify-content: flex-end; position: relative; transition: 0.3s; 
        background-color: rgba(255, 255, 255, 0.7); padding: 15px; box-sizing: border-box; border: 3px solid #eee;
    }
    .cell-text { font-size: 24px; font-weight: 900; margin-bottom: 10px; }
    .player { width: 50px; height: 50px; position: absolute; z-index: 50; transition: 0.5s; background-size: contain; background-repeat: no-repeat; }
    #p1 { background-color: var(--p1-color); border-radius: 50%; } /* 暫時代替圖片 */
    #p2 { background-color: var(--p2-color); border-radius: 50%; }
    #controls { position: fixed; bottom: 0; left: 0; width: 100%; background: white; display: flex; justify-content: center; align-items: center; gap: 20px; padding: 20px; z-index: 100; }
    #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 40px; border-radius: 30px; z-index: 300; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
</style>
    </style>
</head>
<body>

<div id="game-container">
    <div id="board"></div>
    <div id="p1" class="player"></div>
    <div id="p2" class="player"></div>
</div>

<div id="controls">
    <div class="score-board">P1: <span id="s1">0</span> | P2: <span id="s2">0</span></div>
    <div id="status" style="font-size: 20px; font-weight: bold;">輪到：<span id="player-turn-name">玩家 1</span></div>
    <div id="dice-box">🎲</div>
    <button id="btn-roll" onclick="roll()">擲骰子</button>
</div>

<div id="modal">
    <div id="timer" style="font-size: 20px; color: #e67e22; font-weight: bold;">⏳ 剩餘時間: 60s</div>
    <div id="modal-text">詞語</div>
    <div style="display: flex; gap: 10px; flex-direction: column;">
        <button id="btn-ai" onclick="startRecognition()" style="padding: 15px; font-size: 20px; cursor: pointer; background: #4299e1; color: white; border: none; border-radius: 15px; font-weight: bold;">🤖 AI 檢查讀音</button>
        
        <button onclick="closeModal()" style="padding: 20px; font-size: 24px; cursor: pointer; background: #48bb78; color: white; border: none; border-radius: 20px; font-weight: bold;">我讀好了！</button>
    </div>
</div>

<script>
    <script>
    const words = ["起點", "學校", "禮堂", "校務處", "操場", "音樂室", "課室", "洗手間", "電腦室", "樓梯", "圖書館", "走廊", "升降機", "教員室", "草地上", "沙灘", "山頂", "運動場", "籃球場", "足球場", "燒烤場", "公園", "家裏", "客廳", "浴室", "睡房", "廚房", "清真寺", "商場", "超市", "街市", "麵包店", "理髮店", "便利店", "藥房", "餐廳", "醫院", "補習社", "博物館", "銀行", "地鐵站", "巴士站", "行人道", "刷牙", "洗澡", "洗手", "喝水", "吃飯", "睡覺", "穿衣服", "戴口罩", "做家務", "倒垃圾", "洗碗", "抹窗戶", "煮飯", "上課", "做功課", "溫習", "看書", "畫畫", "做早操", "跑步", "游泳", "跳繩", "踢足球", "打籃球", "騎單車", "遠足", "拍照", "表演", "唱歌", "跳舞", "慶祝", "排隊", "玩遊戲", "看手機", "打電話", "打招呼", "買水果", "比賽", "說話", "摺紙", "下棋", "玩拼圖", "🏆 終點"];
    const players = [{pos: 0, score: 0}, {pos: 0, score: 0}];
    const traps = [5, 12, 25, 40, 55, 70], boosts = [8, 20, 35, 50, 65, 80];
    let turn = 0, dice = 0, moving = false, timerInterval;

    function init() {
        const board = document.getElementById('board');
        board.innerHTML = ""; // 清空棋盤
        words.forEach((w, i) => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = 'c' + i;
            cell.innerHTML = `<span class="cell-index">${i}</span><div class="cell-text">${w}</div>`;
            board.appendChild(cell);
        });
        updateDisplay();
    }

    function speak() {
        const text = document.getElementById('modal-text').innerText;
        window.speechSynthesis.cancel(); 
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-HK';
        msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
    }

    function updateDisplay() {
        players.forEach((p, i) => {
            const cell = document.getElementById('c' + p.pos);
            const pEl = document.getElementById('p' + (i + 1));
            const rect = cell.getBoundingClientRect();
            const bRect = document.getElementById('board').getBoundingClientRect();
            pEl.style.left = (cell.offsetLeft + (i === 0 ? 10 : 60)) + 'px';
            pEl.style.top = (cell.offsetTop + 40) + 'px';
        });
    }

    async function roll() {
        if(moving) return;
        const btn = document.getElementById('btn-roll');
        btn.disabled = true;
        for(let i=0; i<8; i++) {
            dice = Math.floor(Math.random()*6)+1;
            document.getElementById('dice-box').innerText = dice;
            await new Promise(r => setTimeout(r, 60));
        }
        move(turn);
    }

    async function move(pid) {
        moving = true;
        for(let i=0; i<dice; i++) {
            if (players[pid].pos < words.length - 1) {
                players[pid].pos++;
                updateDisplay();
                await new Promise(r => setTimeout(r, 250));
            }
        }
        // 判斷陷阱與獎勵
        if(traps.includes(players[pid].pos)) { alert("🍌 滑倒後退 3 格！"); players[pid].pos = Math.max(0, players[pid].pos - 3); }
        if(boosts.includes(players[pid].pos)) { alert("🚀 火箭前進 5 格！"); players[pid].pos = Math.min(words.length-1, players[pid].pos + 5); }
        updateDisplay();
        
        if(players[pid].pos === words.length-1) { 
            alert("🏆 玩家 " + (pid+1) + " 到達終點！"); 
            location.reload(); 
        } else { 
            showModal(); 
        }
    }

    function showModal() {
        const currentWord = words[players[turn].pos];
        document.getElementById('modal-text').innerText = currentWord;
        document.getElementById('modal').style.display = 'block';
        speak();

        let timeLeft = 60;
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = `⏳ 剩餘時間: ${timeLeft}s`;
            if(timeLeft <= 0) {
                clearInterval(timerInterval);
                closeModal(false);
            }
        }, 1000);
    }

    function closeModal(addScore = true) {
        clearInterval(timerInterval);
        if(addScore) { 
            players[turn].score += 10; 
            document.getElementById('s' + (turn + 1)).innerText = players[turn].score; 
        }
        document.getElementById('modal').style.display = 'none';
        turn = (turn === 0) ? 1 : 0; // 換人
        document.getElementById('player-turn-name').innerText = `玩家 ${turn + 1}`;
        document.getElementById('btn-roll').disabled = false;
        moving = false;
    }

    function startRecognition() {
        alert("AI 功能開發中，請先手動朗讀！");
    }

    window.onload = init;
</script>
</html>
