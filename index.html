<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星星收集大冒險 (修復版)</title>
    <style>
        :root { --p1-color: #3182ce; --p2-color: #d53f8c; --cell-size: 160px; }
        
        body { 
            font-family: "Microsoft JhengHei", sans-serif; margin: 0; padding: 0; 
            background-color: #f7fafc; overflow-y: scroll; padding-bottom: 150px; 
        }

        #game-container { position: relative; width: 95%; max-width: 1400px; margin: 20px auto; }

        /* 核心修復：找回 10 欄網格佈局 */
        #board { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); /* 確保橫向有 10 格 */
            gap: 15px; 
            padding: 25px; 
            border-radius: 30px; 
            background-image: url('images/board-bg.jpg'); 
            background-size: cover; 
            background-position: center;
            background-color: #ffffff; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); 
            border: 10px solid white;
        }

        /* 格子佈局：文字在圖案上方 */
        .cell { 
            height: var(--cell-size); 
            border-radius: 20px; 
            display: flex; 
            flex-direction: column; /* 垂直排列 */
            align-items: center; 
            justify-content: flex-end; /* 內容沉到底部 */
            text-align: center; 
            position: relative; 
            transition: 0.3s; 
            backdrop-filter: blur(5px); 
            border: 3px solid rgba(255,255,255,0.6); 
            color: #1a202c; 
            padding: 10px; 
            box-sizing: border-box;
            background-color: rgba(255, 255, 255, 0.4); /* 增加一點底色提升可讀性 */
        }

        .cell-index { position: absolute; top: 7px; left: 10px; font-size: 14px; color: rgba(0,0,0,0.3); }
        
        /* 詞語文字：在星星頭上 */
        .cell-text {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 10px; /* 與星星的呼吸空間 */
            z-index: 2;
            text-shadow: 1px 1px 0 white;
        }

        /* 星星圖片 */
        .item-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            z-index: 1;
        }

        .start { background: white !important; border: 5px solid #3182ce !important; color: #3182ce; }
        .end { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important; color: white !important; }

        /* 動物棋子：使用 images 資料夾內的圖片 */
        .player { 
            width: 50px; height: 50px; 
            position: absolute; 
            z-index: 20; 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
        }
        #p1 { background-image: url('images/p1.png'); }
        #p2 { background-image: url('images/p2.png'); }

        .can-move { animation: bounce 0.6s infinite alternate; box-shadow: 0 0 25px #ecc94b; cursor: pointer; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }

        /* 控制台 */
        #controls { 
            position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,0.95); 
            display: flex; justify-content: center; align-items: center; gap: 30px; padding: 20px; 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1); z-index: 100; backdrop-filter: blur(10px);
        }
        #dice-box { font-size: 60px; background: #edf2f7; padding: 10px 30px; border-radius: 20px; }
        #btn-roll { 
            padding: 18px 60px; font-size: 28px; border-radius: 50px; border: none; background: #48bb78; 
            color: white; cursor: pointer; font-weight: bold; box-shadow: 0 10px 20px rgba(72,187,120,0.3);
        }

        /* 彈窗 */
        #modal { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: white; padding: 50px; border-radius: 40px; z-index: 300; 
            box-shadow: 0 30px 100px rgba(0,0,0,0.5); text-align: center; border: 12px solid #4299e1; width: 80%; max-width: 550px;
        }
        #modal-text { font-size: 90px; font-weight: 900; margin-bottom: 30px; color: #1a202c; }
        .btn-close { background: #48bb78; color: white; padding: 20px; border: none; border-radius: 20px; font-size: 28px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="board"></div>
    <div id="p1" class="player"></div>
    <div id="p2" class="player"></div>
</div>

<div id="controls">
    <div id="status" style="font-size: 22px; font-weight: bold;">輪到：<span id="player-turn-name">玩家 1</span></div>
    <div id="dice-box">🎲</div>
    <button id="btn-roll" onclick="roll()">擲骰子</button>
</div>

<div id="modal">
    <div id="modal-text">詞語</div>
    <button class="btn-close" onclick="closeModal()">我會讀了！</button>
</div>

<script>
    const baseWords = ["起點", "學校", "禮堂", "校務處", "操場", "音樂室", "課室", "洗手間", "電腦室", "樓梯", "圖書館", "走廊", "升降機", "教員室", "草地上", "沙灘", "山頂", "運動場", "籃球場", "足球場", "燒烤場", "公園", "家裏", "客廳", "浴室", "睡房", "廚房", "清真寺", "商場", "超市", "街市", "麵包店", "理髮店", "便利店", "藥房", "餐廳", "醫院", "補習社", "博物館", "銀行", "地鐵站", "巴士站", "行人道", "刷牙", "洗澡", "洗手", "喝水", "吃飯", "睡覺", "穿衣服", "戴口罩", "做家務", "倒垃圾", "洗碗", "抹窗戶", "煮飯", "上課", "做功課", "溫習", "看書", "畫畫", "做早操", "跑步", "游泳", "跳繩", "踢足球", "打籃球", "騎單車", "遠足", "拍照", "表演", "唱歌", "跳舞", "慶祝", "排隊", "玩遊戲", "看手機", "打電話", "打招呼", "買水果", "比賽", "說話", "摺紙", "下棋", "玩拼圖"];
    const words = [...baseWords, "🏆 終點"];
    const players = [{pos: 0, el: 'p1'}, {pos: 0, el: 'p2'}];
    let turn = 0, dice = 0, moving = false;

    function init() {
        const board = document.getElementById('board');
        words.forEach((w, i) => {
            const cell = document.createElement('div');
            cell.className = 'cell' + (i===0?' start':(i===words.length-1?' end':''));
            cell.id = 'c' + i;
            
            // 中間格子才放星星 (路徑包含 images/)
            let imgHTML = "";
            if (i > 0 && i < words.length - 1) {
                imgHTML = `<img src="images/star.png" class="item-img">`;
            }

            cell.innerHTML = `
                <span class="cell-index">${i}</span>
                <div class="cell-text">${w}</div>
                ${imgHTML}
            `;
            board.appendChild(cell);
        });
        setTimeout(() => updateDisplay(true), 300);
    }

    function updateDisplay(isFinal = false) {
        players.forEach((p, i) => {
            const cell = document.getElementById('c' + p.pos);
            const rect = cell.getBoundingClientRect();
            const bRect = document.getElementById('board').getBoundingClientRect();
            const pEl = document.getElementById(p.el);
            
            // 棋子避讓：左右分散
            const playerSep = i === 0 ? -35 : 35; 
            pEl.style.left = (rect.left - bRect.left + rect.width/2 - 25 + playerSep) + 'px';
            pEl.style.top = (rect.top - bRect.top + rect.height/2 - 10) + 'px';
        });
        if(isFinal) document.getElementById('c' + players[turn].pos).scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    async function roll() {
        document.getElementById('btn-roll').disabled = true;
        const diceIcons = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
        for(let i=0; i<8; i++) {
            dice = Math.floor(Math.random()*6)+1;
            document.getElementById('dice-box').innerText = diceIcons[dice-1];
            await new Promise(r => setTimeout(r, 60));
        }
        document.getElementById(players[turn].el).classList.add('can-move');
        document.getElementById(players[turn].el).onclick = () => move(turn);
    }

    async function move(pid) {
        if(moving) return; moving = true;
        document.getElementById(players[pid].el).classList.remove('can-move');
        for(let i=0; i<dice; i++) {
            if (players[pid].pos < words.length - 1) {
                players[pid].pos++;
                updateDisplay(false);
                await new Promise(r => setTimeout(r, 300));
            }
        }
        dice = 0;
        updateDisplay(true);
        if(players[pid].pos === words.length - 1) {
            setTimeout(() => { alert("🏆 恭喜到達終點！"); location.reload(); }, 500);
        } else {
            document.getElementById('modal-text').innerText = words[players[pid].pos];
            document.getElementById('modal').style.display = 'block';
            speak();
        }
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; endTurn(); }
    function endTurn() { 
        turn = turn === 0 ? 1 : 0; 
        document.getElementById('player-turn-name').innerText = `玩家 ${turn+1}`;
        document.getElementById('btn-roll').disabled = false; moving = false; 
    }
    function speak() { 
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(document.getElementById('modal-text').innerText); 
        msg.lang = 'zh-HK'; 
        window.speechSynthesis.speak(msg); 
    }
    window.onload = init;
    window.onresize = () => updateDisplay(true);
</script>
</body>
</html>
