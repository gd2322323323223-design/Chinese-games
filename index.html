<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貓狗詞語大作戰</title>
    <style>
    :root {
        --cell-size: 100px; /* 你可以根據需要調整格子大小 */
        --road-height: 40px;
}

    body {
        font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
        margin: 0;
        
        /* 🎨 修改：森林淺綠漸層底 */
        background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
        overflow-y: scroll;
        padding-bottom: 200px;
    }

    #game-container { 
        position: relative; 
        width: 95%; 
        max-width: 1400px; 
        margin: 20px auto; 
    }

    #board {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 140px 15px; /* 這裡的 140px 是上下格子的間距，確保道路有空間 */
    padding: 60px 40px 180px 40px; 
    border-radius: 40px;
    /* ✨ 強化木質邊框：使用雙層深棕色 */
    border: 15px solid #8d6e63; 
    outline: 5px solid #5d4037; /* 增加外輪廓線，讓木頭更厚實 */
    background-color: #ffffff;
    background-image: url('images/board-bg.jpg');
    background-size: cover;
    background-position: center;
    box-shadow: 0 30px 60px rgba(0,0,0,0.3);
}

/* --- 格子設計 --- */
.cell {
    height: var(--cell-size);
    background-color: rgba(255, 255, 255, 0.95);
    border: 3px solid #c8e6c9; /* 格子本身加一點淡綠色邊 */
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 4px 0 #81c784; /* 格子底部的綠色陰影 */
    z-index: 3;
}

.cell:hover {
    transform: translateY(-5px) scale(1.02);
}

/* 終點格 */
.cell.goal-cell {
    grid-column: span 2;
    grid-row: span 2;
    height: auto;
    min-height: calc(var(--cell-size) * 2 + 130px);
    /* 🎨 修改：黃金果實感漸層 */
    background: linear-gradient(135deg, #fff9c4 0%, #ffecb3 100%) !important;
    border: 6px solid #ffa000 !important;
    z-index: 5;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
    gap: 10px;
}

/* --- 道路設計 (保留你的邏輯，顏色改為泥土棕) --- */
.cell::after {
    content: "";
    position: absolute;
    /* ✨ 修正：讓道路比格子寬一點，確保兩隻棋子並排時不會出界 */
    bottom: -115px; /* 調整高度位置 */
    left: -20px; 
    right: -20px;
    height: 90px; /* ✨ 拓寬路面：由原本的 40px 增加到 90px */
    background: #a1887f; /* 泥土色 */
    border-radius: 15px;
    border-bottom: 8px solid #795548; /* 路面側邊陰影 */
    z-index: 1;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

/* 修正中間的虛線位置 */
.cell::before {
    content: "";
    position: absolute;
    bottom: -70px; /* 讓虛線正好在 90px 路面的中間 */
    left: 0;
    right: 0;
    height: 2px;
    border-top: 2px dashed rgba(255,255,255,0.5);
    z-index: 2;
}

.cell-text { 
    font-size: 28px; 
    font-weight: 900; 
    color: #2e7d32; /* 森林深綠色 */
    z-index: 3; 
    margin: 0; 
    line-height: 1.2; 
}

/* --- 棋子設計 (保留你的圖片路徑) --- */
.player {
    width: 65px;
    height: 65px;
    position: absolute;
    z-index: 100;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
}
#p1 { background-image: url('images/p1.png'); }
#p2 { background-image: url('images/p2.png'); }

.can-move {
    animation: bounce 0.6s infinite alternate;
    cursor: pointer;
    /* 🎨 修改：綠色光暈 */
    filter: drop-shadow(0 0 15px #81c784) brightness(1.1) !important;
}

/* --- 控制面板與按鈕 --- */
#controls {
    position: fixed; bottom: 0; left: 0; width: 100%;
    background: rgba(255, 252, 242, 0.95); /* 奶油色底 */
    display: flex; justify-content: center; align-items: center;
    gap: 30px; padding: 20px; z-index: 100;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.05);
    backdrop-filter: blur(10px);
    border-top: 5px solid #8d6e63;
}

#btn-roll {
    padding: 15px 45px; 
    font-size: 22px; 
    background: #66bb6a; /* 森林綠 */
    color: white; 
    border: none; 
    border-radius: 50px;
    cursor: pointer; 
    font-weight: bold; 
    box-shadow: 0 5px 0 #388e3c;
    transition: 0.1s;
}
#btn-roll:active { transform: translateY(3px); box-shadow: 0 2px 0 #388e3c; }

/* --- 彈窗 (羊皮紙風格) --- */
#modal {
    display: none; position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #fffaf0; 
    padding: 40px; 
    border-radius: 40px;
    z-index: 300; 
    box-shadow: 0 30px 100px rgba(0,0,0,0.4);
    text-align: center; 
    width: 90%; 
    max-width: 500px;
    border: 8px solid #a1887f;
}

#modal-text { 
    font-size: 60px; 
    font-weight: 900; 
    color: #2e7d32; 
    text-shadow: 2px 2px 0px #c8e6c9;
}

/* --- 特殊事件通知 --- */
.notice-event {
    background: linear-gradient(45deg, #66bb6a, #81c784);
    border: 6px solid #f1f8e9;
}
    </style>
</head>
<body>
<div id="music-ctrl" onclick="toggleBGM()" style="position:fixed; top:20px; right:20px; z-index:1000; cursor:pointer; font-size:30px; background:white; border-radius:50%; width:50px; height:50px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,0.2);">
    🎵
</div>
    
<div id="game-container">
    <div id="board"></div>
    <div id="p1" class="player" onclick="handlePlayerClick(0)"></div>
    <div id="p2" class="player" onclick="handlePlayerClick(1)"></div>
</div>

<div id="controls">
    <div style="font-size: 20px; font-weight: bold; color: #4a5568;">
        <span style="color:var(--p1-color)">P1: <span id="s1">0</span></span> | 
        <span style="color:var(--p2-color)">P2: <span id="s2">0</span></span>
    </div>
    <div id="status" style="font-size: 20px; font-weight: bold;">輪到：<span id="player-turn-name" style="color:var(--p1-color)">玩家 1</span></div>
    <div id="dice-box">🎲</div>
    <button id="btn-roll" onclick="roll()">擲骰子</button>
</div>

<div id="modal">
    <div id="timer" style="font-size: 18px; color: #e67e22; font-weight: bold;">⏳ 剩餘時間: 120s</div>
    <div id="modal-text" onclick="speak()">詞語</div>
    <div id="ai-sentence-box" style="margin: 15px 0; padding: 15px; background: #f7fafc; border-left: 5px solid #4299e1; border-radius: 10px; text-align: left;">
        <div style="font-size: 14px; color: #4299e1; font-weight: bold; margin-bottom: 5px;">🤖 AI 老師造句：</div>
        <div id="ai-sentence-text" style="font-size: 20px; color: #4a5568; line-height: 1.4;">這是一個例句。</div>
    </div>
    <p style="font-size: 14px; color: #a0aec0; margin-bottom: 20px;">💡 點擊詞語可重複聽讀音</p>
    <div style="display: flex; gap: 15px; flex-direction: column;">
        <button onclick="startRecognition()" style="padding: 12px; background: #4299e1; color: white; border: none; border-radius: 15px; font-size: 18px; cursor: pointer; font-weight: bold;">🤖 AI 檢查讀音</button>
        <button onclick="closeModal(true)" style="padding: 12px; background: #48bb78; color: white; border: none; border-radius: 15px; font-size: 18px; cursor: pointer; font-weight: bold;">✅ 我讀好了！</button>
    </div>
</div>

<script>
// --- 基礎變數定義 ---
let pendingSteps = 0; 
let turn = 0, dice = 0, moving = false, timerInterval;
let waitingForClick = false; 
let specialEventActive = false;

// --- 音效初始化 ---
const audio = {
    bgm: new Audio('sounds/bgm.mp3'),
    dice: new Audio('sounds/dice.mp3'),
    win: new Audio('sounds/win.mp3')
};

// 背景音樂設定：循環播放、音量適中
audio.bgm.loop = true;
audio.bgm.volume = 0.2;

// 控制背景音樂開關
function toggleBGM() {
    if (audio.bgm.paused) {
        audio.bgm.play().catch(e => console.log("音樂播放被瀏覽器阻擋:", e));
        document.getElementById('music-ctrl').innerText = "🎶";
    } else {
        audio.bgm.pause();
        document.getElementById('music-ctrl').innerText = "🔇";
    }
}

// 播放音效輔助函式
function playSound(name) {
    if (audio[name]) {
        audio[name].currentTime = 0; // 每次播放重置時間，確保連點有效
        audio[name].play().catch(e => {});
    }
}

// --- 修改現有的函式來觸發音效 ---

// 1. 修改擲骰子函式
async function roll() {
    if(moving || waitingForClick) return;
    
    // 🎲 播放擲骰子音效
    playSound('dice');
    
    document.getElementById('btn-roll').disabled = true;
    for(let i=0; i<8; i++) {
        dice = Math.floor(Math.random()*6)+1;
        document.getElementById('dice-box').innerText = dice;
        await new Promise(r => setTimeout(r, 60));
    }
    waitingForClick = true;
    document.getElementById('p' + (turn + 1)).classList.add('can-move');
    document.getElementById('player-turn-name').innerText = "👈 請點擊棋子行走！";
}

// 2. 修改檢查終點與彈窗的函式
async function checkEndOrModal(pid) {
    const pos = players[pid].pos;
    const isGoal = (pos === words.length - 1);
    const isSpecial = traps.includes(pos) || boosts.includes(pos) || dinosaurs.includes(pos);

    if (isGoal) {
        // 🏆 播放獲勝音效
        playSound('win');
        
        await fancyAlert(`🏆 玩家 ${pid + 1} 奪冠！`, "goal");
        location.reload();
    } else if (isSpecial || pos === 0) {
        finishTurn();
    } else {
        showModal();
    }
}

const players = [{pos: 0, score: 0}, {pos: 0, score: 0}];
const traps = [1, 16, 39, 48, 61, 76, 96];
const boosts = [8, 20, 32, 51, 68, 80, 90];
const dinosaurs = [5, 12, 27, 43, 55, 70, 86, 103]; 

// --- 1. 建立自定義詞語與特定句子對應表 ---
// 你可以在這裡輸入你想要的句子，確保邏輯百分之百正確
const customDictionary = {

    "客廳": "一家人坐在客廳裡看電視，其樂融融。",

    "洗手": "飯前洗手是良好的衛生習慣。",

    "吃飯": "我們在吃飯的時候不要說話。",
    "睡覺": "充足的睡覺能讓我們精神充沛。",
    "穿衣服": "我已經學會了自己穿衣服。",
    "戴口罩": "在人多的地方，我們要戴口罩保護自己。",
    "做家務": "我會幫媽媽做家務，減輕她的負擔。",
    "倒垃圾": "吃完飯後，我主動去倒垃圾。",
    "洗碗": "晚飯後，我幫媽媽洗碗。",
    "抹窗戶": "大掃除時，我負責抹窗戶。",
    "煮飯": "媽媽煮飯的味道是世界上最好的。",
    "上課": "上課時要專心聽講，積極發言。",
    "做功課": "我每天都會按時完成老師佈置的做功課。",
    "溫習": "考試前，我要認真溫習功課。",
    "看書": "看書能讓我們增加知識，開闊眼界。",

    "游泳": "夏天去游泳池游泳非常消暑。",
    "跳繩": "跳繩能鍛煉我們的協調能力。",
    "踢足球": "我和同學常在放學後一起踢足球。",
    "打籃球": "打籃球能讓我們長得更高。",
    "騎單車": "假日裡，我和爸爸去郊外騎單車。",
    "遠足": "秋高氣爽，正是遠足的好時節。",
    "拍照": "旅行時，我喜歡用相機拍照留念。",
    "表演": "我們在台上的表演贏得了熱烈的掌聲。",
    "唱歌": "姐姐唱歌的聲音非常動聽。",
    "跳舞": "妹妹從小就開始學習跳舞。",
    "慶祝": "我們開生日派對來慶祝生日。",
    "排隊": "排隊上車是文明行為。",
    "玩遊戲": "適當地玩遊戲可以放鬆心情。",
    "看手機": "我們不應該長時間看手機，保護視力。",
    "打電話": "我打電話給奶奶，問候她的近況。",
    "打招呼": "見到老師要主動打招呼。",
    "買水果": "市場裡的水果很新鮮，我們買了一些。",
    "比賽": "在比賽中，友誼第一，比賽第二。",
    "說話": "公共場所說話要小聲一點。",
    "摺紙": "勞作課上，老師教我們摺紙鶴。",
    "下棋": "爺爺最喜歡和鄰居在樹下下棋。",
    "玩拼圖": "玩拼圖需要耐心和觀察力。"
};

// --- 2. 處理資料與棋盤生成 (取代舊的 rawWords 和 words 循環) ---
const rawWords = Object.keys(customDictionary);
let words = [];
let wordIdx = 0;

for (let i = 0; i < 110; i++) {
    if (i === 0) {
        words.push("起點");
    } else if (traps.includes(i) || boosts.includes(i) || dinosaurs.includes(i)) {
        words.push(""); 
    } else if (wordIdx < rawWords.length) {
        words.push(rawWords[wordIdx]); 
        wordIdx++;
    } else {
        words.push("終點 🏆"); 
        break; 
    }
}

function init() {
    const board = document.getElementById('board');
    board.innerHTML = "";
    let displayIndex = 1; 

    words.forEach((w, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = 'c' + i;
        const isGoal = (i === words.length - 1);
        const isStart = (i === 0);
        const isSpecial = traps.includes(i) || boosts.includes(i) || dinosaurs.includes(i);

        if (isGoal) cell.classList.add('goal-cell');
        if (isSpecial) cell.style.backgroundColor = "rgba(255, 235, 200, 0.9)";

        let iconText = "";
        if(traps.includes(i)) iconText = "🍌";
        else if(boosts.includes(i)) iconText = "🚀";
        else if(dinosaurs.includes(i)) iconText = "🦖";

        let numberHtml = "";
        if (!isStart && !isGoal && !isSpecial) {
            numberHtml = `<span class="cell-index">${displayIndex}</span>`;
            displayIndex++;
        }

        cell.innerHTML = `
            ${numberHtml}
            ${isGoal ? 
                `<div class="event-icon" style="font-size: 120px; position: static; order: 1;">🏆</div>
                 <div class="cell-text" style="font-size: 30px; order: 2;">終點</div>` :
                (w !== "" ? 
                    `<div class="cell-text">${w}</div>
                     <span class="event-icon" style="position: absolute; bottom: 5px; right: 8px; font-size: 30px;">${iconText}</span>` :
                    `<div class="event-icon" style="font-size: 70px;">${iconText}</div>`
                )
            }
        `;
        board.appendChild(cell);
    });
    setTimeout(updateDisplay, 50);
}

function updateDisplay() {
    players.forEach((p, i) => {
        const cell = document.getElementById('c' + p.pos);
        const pEl = document.getElementById('p' + (i + 1));
        if (!cell || !pEl) return;
        
        const centerX = cell.offsetLeft + (cell.offsetWidth / 2) - 32;
        pEl.style.left = centerX + 'px';

        if (cell.classList.contains('goal-cell')) {
            const centerY = cell.offsetTop + (cell.offsetHeight / 2) + (i === 0 ? -40 : 20);
            pEl.style.top = centerY + 'px';
        } else {
            // ✨ 這裡要對應 CSS 的道路位置
            // cell.offsetTop + cell.offsetHeight 是格子的底部
            // 我們把路設在底部下方，所以這裡加的數值要讓棋子落在 90px 的路面上
            const roadBase = cell.offsetTop + cell.offsetHeight + 15; 
            pEl.style.top = (i === 0 ? roadBase : roadBase + 45) + 'px'; 
            // i=0 是第一隻，i=1 是第二隻，相差 45px 剛好在路面上並排
        }
    });
}

async function roll() {
    if(moving || waitingForClick) return;
    document.getElementById('btn-roll').disabled = true;
    for(let i=0; i<8; i++) {
        dice = Math.floor(Math.random()*6)+1;
        document.getElementById('dice-box').innerText = dice;
        await new Promise(r => setTimeout(r, 60));
    }
    waitingForClick = true;
    document.getElementById('p' + (turn + 1)).classList.add('can-move');
    document.getElementById('player-turn-name').innerText = "👈 請點擊棋子行走！";
}

// ✨ 修復核心：處理玩家點擊（包含正常移動與特殊事件後續移動）
async function handlePlayerClick(pid) {
    if (!waitingForClick || pid !== turn || moving) return;
    
    waitingForClick = false; // 立即關閉點擊許可，防止連點
    document.getElementById('p' + (turn + 1)).classList.remove('can-move');

    if (specialEventActive) {
        // 如果是特殊事件（如踩到香蕉）引發的點擊
        let steps = pendingSteps;
        specialEventActive = false;
        pendingSteps = 0;
        await moveSteps(pid, steps);
        checkEndOrModal(pid); // 移動完後再檢查
    } else {
        // 正常的擲骰子移動
        await move(pid);
        // 注意：move 內部會處理是否觸發特殊事件彈窗
        // 如果 move 沒觸發特殊事件彈窗，會在這裡檢查彈窗
        if (!specialEventActive) {
            checkEndOrModal(pid);
        }
    }
}

async function move(pid) {
    moving = true;
    for(let i=0; i<dice; i++) {
        if (players[pid].pos < words.length - 1) {
            players[pid].pos++;
            updateDisplay();
            await new Promise(r => setTimeout(r, 300));
        }
    }
    moving = false;

    const pos = players[pid].pos;
    if(traps.includes(pos)) {
        await fancyAlert("🍌 哎呀！踩到香蕉滑倒了。<br><small>點擊棋子後退 1 格</small>");
        prepareSpecialStep(pid, -1);
    } else if(boosts.includes(pos)) {
        await fancyAlert("🚀 哈哈！坐上火箭衝刺！<br><small>點擊棋子前進 5 格</small>");
        prepareSpecialStep(pid, 5);
    } else if(dinosaurs.includes(pos)) {
        await fancyAlert("🦖 哇！是大恐龍！快逃...<br><small>點擊棋子後退 3 格</small>");
        prepareSpecialStep(pid, -3);
    }
}

function prepareSpecialStep(pid, steps) {
    moving = false;
    waitingForClick = true;
    specialEventActive = true; 
    pendingSteps = steps;
    document.getElementById('p' + (pid + 1)).classList.add('can-move');
    document.getElementById('player-turn-name').innerText = "👈 請點擊棋子執行特殊事件！";
}

async function moveSteps(pid, steps) {
    moving = true;
    const isForward = steps > 0;
    const totalSteps = Math.abs(steps);
    for (let i = 0; i < totalSteps; i++) {
        if (isForward) {
            if (players[pid].pos < words.length - 1) players[pid].pos++;
        } else {
            if (players[pid].pos > 0) players[pid].pos--;
        }
        updateDisplay();
        await new Promise(r => setTimeout(r, 300));
    }
    moving = false;
}

async function checkEndOrModal(pid) {
    const pos = players[pid].pos;
    const isGoal = (pos === words.length - 1);
    const isSpecial = traps.includes(pos) || boosts.includes(pos) || dinosaurs.includes(pos);

    if (isGoal) {
        await fancyAlert(`🏆 玩家 ${pid + 1} 奪冠！`, "goal");
        location.reload();
    } else if (isSpecial) {
        // 如果移動後落點是特殊格，不顯示詞語彈窗（已由 move 或 moveSteps 處理完畢後調用此函數）
        finishTurn();
    } else if (pos === 0) {
        finishTurn();
    } else {
        showModal();
    }
}

function showModal() {
    const currentWord = words[players[turn].pos];
    if (!currentWord || currentWord === "" || currentWord === "起點" || currentWord === "終點 🏆") { 
        finishTurn(); 
        return; 
    }
    
    // 取得預設好的句子
    const specificSentence = customDictionary[currentWord] || "請用這個詞語造一個句子。";

    document.getElementById('modal-text').innerText = currentWord;
    document.getElementById('ai-sentence-text').innerText = specificSentence; // 直接顯示特定句子

    document.getElementById('modal').style.display = 'block';
    
    let timeLeft = 60;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = `⏳ 剩餘時間: ${timeLeft}s`;
        if(timeLeft <= 0) closeModal(false);
    }, 1000);
}

function speak() {
    window.speechSynthesis.cancel();
    const word = document.getElementById('modal-text').innerText;
    const sentence = document.getElementById('ai-sentence-text').innerText;
    
    // 朗讀詞語 + 句子
    const msg = new SpeechSynthesisUtterance(`${word}。句子練習：${sentence}`);
    msg.lang = 'zh-HK';
    msg.rate = 0.8;
    window.speechSynthesis.speak(msg);
}

function startRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert("請使用 Chrome 瀏覽器以支援語音辨識。");
        return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = 'zh-HK';
    const modalText = document.getElementById('modal-text');
    const originalWord = modalText.innerText;
    modalText.innerHTML = `<span style="color:#4299e1">🎤 正在聽...讀出「${originalWord}」</span>`;
    recognition.start();

    recognition.onresult = (event) => {
        const result = event.results[0][0].transcript;
        if (result.includes(originalWord)) {
            modalText.innerHTML = `<div style="color:#48bb78">✅ 太棒了！</div>`;
            players[turn].score += 5;
            document.getElementById('s' + (turn + 1)).innerText = players[turn].score;
        } else {
            modalText.innerHTML = `<div style="color:#f56565">❌ 聽成: ${result}</div>`;
        }
        setTimeout(() => { modalText.innerText = originalWord; }, 2000);
    };
}

function fancyAlert(msg, type = 'event') {
    return new Promise(resolve => {
        const notice = document.createElement('div');
        notice.className = `special-notice notice-${type}`;
        notice.innerHTML = `${msg}<br><span style="font-size:16px; opacity:0.8;">( 點擊關閉並移動 )</span>`;
        document.body.appendChild(notice);
        setTimeout(() => notice.classList.add('show'), 10);
        notice.onclick = () => {
            notice.classList.remove('show');
            setTimeout(() => { notice.remove(); resolve(); }, 400);
        };
    });
}

function closeModal(addScore = true) {
    if (timerInterval) clearInterval(timerInterval);
    if (addScore) {
        players[turn].score += 10;
        document.getElementById('s' + (turn + 1)).innerText = players[turn].score;
    }
    document.getElementById('modal').style.display = 'none';
    finishTurn();
}

function finishTurn() {
    turn = (turn === 0) ? 1 : 0;
    const nameEl = document.getElementById('player-turn-name');
    nameEl.innerText = `輪到：玩家 ${turn + 1}`;
    nameEl.style.color = (turn === 0) ? 'var(--p1-color)' : 'var(--p2-color)';
    document.getElementById('btn-roll').disabled = false;
    moving = false;
    waitingForClick = false;
    specialEventActive = false;
}

window.onload = init;
</script>
