<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>詞語大作戰</title>
    <style>
        :root { 
            --p1-color: #3182ce; 
            --p2-color: #d53f8c; 
            --cell-size: 90px; 
            --road-height: 90px;
        }
    
/* --- 第一部分：專門控制背景圖和模糊效果 --- */
body::before {
    content: "";
    position: fixed; 
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('images/board-bg-frontpage.png') !important;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 5;
    
    /* 這裡控制模糊，只會影響這張圖，不會影響你的棋盤文字 */
    filter: none !important; 
    -webkit-filter: none !important;
    z-index: 1;       /* 確保它在最底層 */
}

/* --- 第二部分：你原本的 body 樣式（微調） --- */
body {
    font-family: "Microsoft JhengHei", sans-serif;
    margin: 0;
    background-color: transparent !important;  
    background: transparent !important;  
    position: relative;
    overflow-y: scroll;
    padding-bottom: 200px;
    min-height: 100vh;
}
        
/* P1 選中效果：改用 outline 代替 border */
.char-opt[style*="var(--p1-color)"] {
    outline: 5px solid var(--p1-color); /* ✨ outline 不佔空間 */
    outline-offset: -5px;              /* 讓框線往內縮 */
    box-shadow: 0 0 20px var(--p1-color) !important;
    border: none !important;           /* 移除原本可能撐開空間的 border */
}

/* P2 選中效果 */
.char-opt[style*="var(--p2-color)"] {
    outline: 5px solid var(--p2-color);
    outline-offset: -5px;
    box-shadow: 0 0 20px var(--p2-color) !important;
    border: none !important;
}

/* [狀態 B] 被選取後的動作：hover 時乖乖站好不要亂跳 */
.char-opt[style*="var(--p1-color)"]:hover,
.char-opt[style*="var(--p2-color)"]:hover {
    transform: scale(1.05) translateY(0) !important; 
}

img {
  width: 100%;     /* 佔滿容器寬度 */
  height: 100%;    /* 佔滿容器高度 */
  object-fit: contain; /* 保持比例，完整顯示圖片 */
}
        
#game-container { position: relative; z-index: 10 !important; width: 95%; max-width: 1400px; margin: 20px auto; background: transparent !important;}

#board { 
    display: grid; 
    grid-template-columns: repeat(10, 1fr); 
    gap: 140px 15px; 
    padding: 40px 40px 150px 40px; 
    border-radius: 40px; 
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    border: 12px solid #8d6e63;
    outline: 6px solid #5d4037;
    box-shadow: 
        0 15px 0 #5d4037,           
        0 30px 60px rgba(0,0,0,0.4); 
}

.cell { 
    height: var(--cell-size);
    border-radius: 20px; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    position: relative; 
    transition: 0.3s; 
    background-color: rgba(255, 255, 255, 0.9); 
    padding: 5px; 
    box-sizing: border-box; 
    border: 2px solid #e2e8f0;
    backdrop-filter: blur(5px);
    box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }
/* --- 針對你目前結構的相容版 CSS --- */

/* --- 1. 香蕉格：修正空轉動態版 --- */

.trap-cell {
    background: radial-gradient(circle, #fff3bf 0%, #fab005 100%) !important;
    border: 3px dashed #873800 !important;
    position: relative;
    overflow: visible !important; 
    z-index: 10;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
}

/* 確保馬路被關閉 */
.trap-cell::after, 
.trap-cell::before {
    display: none !important;
}

/* 香蕉圖示：平時的搖擺動態 */
.trap-cell .event-icon {
    font-size: 50px !important;
    display: inline-block;
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
    /* ✅ 這裡改用 animation 複合寫法，確保初次載入會動 */
    animation: banana-wiggle 2s infinite ease-in-out; 
}

/* 鼠標移上去時：強制更換動畫為快速空轉 */
.trap-cell:hover .event-icon {
    /* 0.7s 表示轉一圈只要 0.7 秒，非常快 */
    animation: rotate-trap 0.3s infinite linear !important; 
}

/* --- 這裡是最重要的兩個動畫劇本 --- */

/* 1. 平時的搖擺 (Wiggle) */
@keyframes banana-wiggle {
    0%, 100% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(15deg) scale(1.1); }
}

/* 2. 觸發時的快速空轉 (Spin) - 確保這段在 CSS 裡 */
@keyframes rotate-trap {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* 鼠標移過去的背景變化 */
.trap-cell:hover {
    background: radial-gradient(circle, #fff3bf 0%, #e67e22 100%) !important;
    border-style: solid !important;
}
        
/* --- 2. 火箭格：星際穿越版 --- */

.boost-cell {
    /* ✨ 保留你最愛的 6 光點背景 */
    background: 
        radial-gradient(1.2px 1.2px at 15% 20%, white, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 80% 15%, white, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 50% 40%, white, rgba(255,255,255,0)),
        radial-gradient(1.3px 1.3px at 25% 75%, white, rgba(255,255,255,0)),
        radial-gradient(1.1px 1.1px at 70% 65%, white, rgba(255,255,255,0)),
        radial-gradient(1.4px 1.4px at 85% 85%, white, rgba(255,255,255,0)),
        linear-gradient(180deg, #0b1e3b 0%, #1a365d 100%) !important;
    
    border: 3px solid #63b3ed !important;
    position: relative;
    overflow: hidden !important; /* 為了讓流星效果不超出格線 */
    z-index: 10;
    box-shadow: 0 0 15px rgba(99, 179, 237, 0.4), inset 0 0 10px rgba(0,0,0,0.5);
    transition: all 0.5s ease;
}

/* 移除通用道路偽元素 */
.boost-cell::after, 
.boost-cell::before {
    display: none !important;
    content: none !important;
}

/* 火箭圖示設定 */
.boost-cell .event-icon {
    font-size: 50px !important;
    display: inline-block;
    filter: drop-shadow(0 0 8px rgba(66, 153, 225, 0.8));
    position: relative;
    z-index: 5;
    
    /* ✅ 常駐動態：火箭引擎的微小震動感 */
    animation: rocket-engine 0.2s infinite alternate;
}

/* 火箭引擎震動動畫 */
@keyframes rocket-engine {
    from { transform: translate(0, 0) rotate(-2deg); }
    to { transform: translate(1px, 1px) rotate(2deg); }
}

/* 鼠標移過去：啟動「超空間跳躍」效果 */
.boost-cell:hover {
    /* 背景光點拉長變成流星線條 */
    background: 
        linear-gradient(90deg, transparent, #fff, transparent) 10% 20% / 20px 1px no-repeat,
        linear-gradient(90deg, transparent, #fff, transparent) 80% 15% / 30px 1px no-repeat,
        linear-gradient(90deg, transparent, #fff, transparent) 40% 70% / 25px 1px no-repeat,
        linear-gradient(180deg, #0b1e3b 0%, #2c5282 100%) !important;
    
    box-shadow: 0 0 25px rgba(66, 153, 225, 0.8);
    transform: scale(1.05);
}

.boost-cell:hover .event-icon {
    /* 移過去時火箭向右上方衝刺出去 */
    animation: rocket-launch 0.5s infinite ease-in-out;
}

@keyframes rocket-launch {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(5px, -5px) scale(1.1); }
    100% { transform: translate(0, 0) scale(1); }
}

/* --- 3. 恐龍格：原始禁區綜合版 (方案A氛圍 + 方案B邊框) --- */

.dino-cell {
    /* ✨ 核心修改 1：深綠色原始叢林漸層背景 */
    background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 100%) !important;
    position: relative;
    overflow: hidden !important; /* 確保圓角裁剪 */
    z-index: 10;
    border-radius: 20px; /* 保持圓角一致 */
    
    /* ✨ 核心修改 2：使用 border-image 製作黃黑警告斜紋邊框 */
    border: 10px solid transparent !important; /* 設定邊框寬度 */
    border-image: repeating-linear-gradient(45deg, #f1c40f, #f1c40f 10px, #000 10px, #000 20px) 10 !important;
    
    box-shadow: inset 0 0 25px rgba(0,0,0,0.7); /* 強化內陰影，增加幽暗感 */
    transition: 0.3s;
}

/* 移除通用道路偽元素防止干擾 */
.dino-cell::after, 
.dino-cell::before {
    display: none !important;
    content: none !important;
}

/* 恐龍圖示設定 */
.dino-cell .event-icon {
    font-size: 55px !important;
    display: inline-block;
    filter: drop-shadow(2px 4px 10px rgba(0,0,0,0.6)); /* 強化陰影，更立體 */
    position: relative;
    z-index: 5;
    
    /* ✅ 保留方案 A 的常駐動態：呼吸般的上下浮動 */
    animation: dino-breath 2s infinite ease-in-out;
}

/* 恐龍呼吸動畫 (方案 A) */
@keyframes dino-breath {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-6px) scale(1.03); }
}

/* 鼠標移過去時的效果強化 (結合方案 B 的震動咆哮) */
.dino-cell:hover {
    box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 0 15px rgba(116, 195, 101, 0.4);
}

.dino-cell:hover .event-icon {
    /* 移過去會變成生氣的咆哮震動 (方案 B 動態) */
    animation: dino-roar 0.3s infinite;
}

@keyframes dino-roar {
    0% { transform: translate(1px, 1px) rotate(0deg); }
    20% { transform: translate(-1px, -1px) rotate(-1deg); }
    40% { transform: translate(-2px, 0px) rotate(1deg); }
    60% { transform: translate(2px, 1px) rotate(0deg); }
    80% { transform: translate(-1px, -1px) rotate(1deg); }
    100% { transform: translate(1px, -2px) rotate(-1deg); }
}

/* 4. 終點整合樣式 (發光 + 佈局) */
.cell.goal-cell {
    grid-column: span 2;
    grid-row: span 2;
    height: auto;
    min-height: calc(var(--cell-size) * 2 + 130px); 
    background: radial-gradient(circle, #ffffff 0%, #fff9db 100%) !important;
    border: 6px solid #f56565 !important;
    z-index: 5;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
    gap: 10px; 
    box-shadow: 0 0 30px rgba(252, 196, 25, 0.4) !important;
    animation: goal-shine 2s infinite alternate;
}
@keyframes goal-shine {
    from { box-shadow: 0 0 20px rgba(252, 196, 25, 0.3); }
    to { box-shadow: 0 0 40px rgba(252, 196, 25, 0.6); }
}
.goal-cell .cell-text {
    font-size: 60px !important; 
    font-weight: 900;
}
.goal-cell .event-icon {
    font-size: 120px !important; 
    position: static !important; 
    order: 1 
}
.goal-cell::after, .goal-cell::before {
    display: none !important; /* 終點不需要道路 */
}

/* 5. 道路與通用效果 */
.cell:hover {
    transform: translateY(-5px);
    background-color: #fff !important;
    box-shadow: 0 10px 20px rgba(0,0,0,0.15);
}
.cell::after {
    content: "";
    position: absolute;
    bottom: -110px;
    left: -10px; 
    right: -10px;
    height: var(--road-height);
    background: #8d6e63; 
    background-image: radial-gradient(#a1887f 10%, transparent 20%);
    border-bottom: 6px solid #795548; 
    z-index: 1;
    border-radius: 15px;
    background-size: 30px 30px;
}
.cell::before {
    content: "";
    position: absolute;
    bottom: calc(-110px + (var(--road-height) / 2));
    left: 10%;
    right: 10%;
    height: 2px;
    border-top: 2px dashed rgba(255, 255, 255, 0.4);
    z-index: 2;
}

.cell-text { font-size: 30px; font-weight: 900; color: #1a202c; z-index: 3; margin: 0; line-height: 1.2; }
.cell-index { position: absolute; top: 8px; left: 10px; font-size: 14px; color: #a0aec0; }

.player { 
    width: 65px; 
    height: 65px; 
    position: absolute; 
    z-index: 100; 
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
}

.can-move { 
    animation: bounce 0.6s infinite alternate; 
    cursor: pointer; 
    filter: drop-shadow(0 0 15px #48bb78) brightness(1.2) !important; 
        }
        @keyframes bounce { 
            from { transform: translateY(0); } 
            to { transform: translateY(-20px); }
        }

       /* 預設狀態：徹底消失，且不准點擊 */
/* 預設絕對隱藏 */
#controls {
    position: fixed !important;
    bottom: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 120px !important; /* 加高確保看得到 */
    background: white !important; /* 先用純白，好觀察 */
    display: none !important; /* 初始隱藏 */
    justify-content: center !important;
    align-items: center !important;
    gap: 30px !important;
    z-index: 10000 !important; /* 攻頂級層級 */
    border-top: 3px solid #48bb78 !important; /* 加一條綠邊確認它有出來 */
}

/* 針對按鈕的暴力樣式 */
#btn-roll {
    min-width: 150px !important;
    min-height: 50px !important;
    background-color: #48bb78 !important; /* 綠色 */
    color: white !important;
    font-size: 20px !important;
    font-weight: bold !important;
    border-radius: 10px !important;
    display: inline-block !important; /* 確保它是區塊 */
    visibility: visible !important;
    cursor: pointer !important;
}

/* 只有當 body 標籤被加上 .game-active 類別時，控制列才會出現 */
body.game-active #controls {
    display: flex !important; /* 遊戲開始後才打開 */
}
        
        body:not(:has(#start-screen:not([style*="display: none"]))) #controls {
            display: flex !important;
            z-index: 9999 !important; /* 同時解決你說的：進入遊戲後要浮在最前方 */
        }

        #dice-box { font-size: 45px; padding: 10px 25px; background: #edf2f7; border-radius: 15px; min-width: 60px; text-align: center; }

      #btn-roll {
    position: static !important; /* 讓它回到控制列內，不要在畫面上亂飛 */
    padding: 15px 40px !important; 
    font-size: 22px !important; 
    background: #48bb78 !important; /* 變回綠色 */
    color: white !important; 
    border: none !important; 
    border-radius: 50px !important; 
    cursor: pointer !important; 
    display: inline-block !important; /* 確保它是顯示的 */
    visibility: visible !important;
}
        
        #btn-roll:hover { background: #38a169; transform: scale(1.05); }
        #btn-roll:disabled { background: #cbd5e0; transform: scale(1); }

        #modal { 
            display: none; position: fixed; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            background: white; padding: 40px; border-radius: 40px; 
            z-index: 300; box-shadow: 0 30px 100px rgba(0,0,0,0.4); 
            text-align: center; width: 90%; max-width: 450px;
            border: 10px solid #ebf8ff;
        }

        #modal-text { font-size: 70px; font-weight: 900; margin: 25px 0; cursor: pointer; color: #2b6cb0; }
        
        .special-notice {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            z-index: 1000;
            padding: 40px 80px;
            border-radius: 100px;
            color: white;
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 0 50px rgba(0,0,0,0.3);
            opacity: 0;
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .special-notice:hover {
            transform: translate(-50%, -50%) scale(1.05);
            filter: brightness(1.1);
        }
        .special-notice.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .notice-event {
            background: linear-gradient(45deg, #4299e1, #667eea);
            border: 8px solid #ebf8ff;
        }
        .notice-goal {
            background: linear-gradient(45deg, #ecc94b, #ed8936);
            border: 8px solid #fffaf0;
            font-size: 60px;
            animation: gold-glow 1s infinite alternate;
        }
        @keyframes gold-glow {
            from { box-shadow: 0 0 20px #ecc94b; }
            to { box-shadow: 0 0 60px #f6ad55, 0 0 100px rgba(236, 201, 75, 0.5); }
        }
        /* 棋子被點擊時的縮放效果 */
.player:active {
    transform: scale(0.9) translateY(0);
    transition: 0.1s;
}

/* 讓語音辨識的按鈕看起來更像按鈕 */
#ai-sentence-text {
    background: #f7fafc;
    padding: 15px;
    border-radius: 15px;
    margin-top: 10px;
    border-left: 5px solid #4299e1;
    font-size: 18px;
    color: #4a5568;
}
        
/* --- 1. 先貼這段：定義基本的美化外觀 --- */
#character-pool {
    display: grid;
    grid-template-columns: repeat(4, 120px); /* 建議給固定寬度，背景才不會跑掉 */
    gap: 15px;
    width: 600px; /* 確保背景方格完美包裹 */
    margin: 0 auto;
    padding: 15px;
    background: rgba(255, 255, 255, 0.4); 
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 40px;
    border: 2px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    justify-items: center;
}

.char-opt {
    width: 100px;
    height: 100px;
    background: white;
    border-radius: 25px;
    padding: 5px;
    box-sizing: border-box;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 8px 15px rgba(0,0,0,0.05);
}

.char-opt:hover {
    transform: translateY(-15px) rotate(5deg) scale(1.15);
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}

/* --- 2. 再貼這段：針對手機螢幕做修正 --- */
@media (max-width: 600px) {
    #character-pool {
        /* 當螢幕很小時，自動把 4 欄擠成 2 欄 */
        grid-template-columns: repeat(2, 110px) !important;
    }
}
        
#start-game-btn {
    margin-top: 45px;
    padding: 18px 80px;
    font-size: 28px;
    font-weight: 900;
    color: white;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
    box-shadow: 0 8px 0 #2f855a, 0 15px 20px rgba(0,0,0,0.3);
    transition: all 0.1s ease;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    letter-spacing: 2px;
    animation: pulse 2s infinite;
}

#start-game-btn:active {
    transform: translateY(4px);
    box-shadow: 0 4px 0 #2f855a, 0 8px 10px rgba(0,0,0,0.2);
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}
        
/* 讓中間內容變成橫向排列 */
.selection-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    width: 100%;
}

/* 預覽框的基礎大小 */
/* ✅ 這是修正後的新樣式（呈透明朦朧感） */
.preview-box {
    width: 250px; 
    height: 250px;
    
    /* 1. 設定半透明背景色 (白色，透明度 0.3) */
    background: rgba(255, 255, 255, 0.3) !important; 
    
    /* 2. 調整邊框，讓它看起來更精緻 */
    border: 2px solid rgba(255, 255, 255, 0.5) !important;
    border-radius: 30px; /* 圓角稍微調大一點，看起來更柔和 */
    
    /* 3. 其他保持不變的排版設定 */
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden; /* 確保選中的圖片不會超出圓角 */
    
    /* 4. 調整陰影，讓它更輕盈 */
    box-shadow: 0 15px 35px rgba(0,0,0,0.1) !important;
}

/* 額外小優化：讓裡面的預設文字顏色變深一點，比較好閱讀 */
.preview-box span {
    color: #5d4037 !important;
    font-weight: bold;
}
        
body:has(#start-screen[style*="display: flex"]) #game-container {
    opacity: 0; /* 或者用 visibility: hidden */
}

/* 呼吸燈動畫 */
@keyframes breathing-p1 {
    0% { box-shadow: 0 0 5px var(--p1-color); }
    100% { box-shadow: 0 0 25px var(--p1-color), 0 0 10px var(--p1-color); }
}
@keyframes breathing-p2 {
    0% { box-shadow: 0 0 5px var(--p2-color); }
    100% { box-shadow: 0 0 25px var(--p2-color), 0 0 10px var(--p2-color); }
}

/* 棋子懸停時的跳動旋轉 */
.char-opt:hover {
    transform: translateY(-15px) rotate(8deg) scale(1.2) !important;
    filter: brightness(1.1);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 10;
}

/* 選定後的「砰」動畫 */
@keyframes pop-in {
    0% { transform: scale(0); opacity: 0; }
    80% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
}
.pop-effect {
    animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
/* --- 角色選中後的發光與呼吸動畫 --- */

/* 當玩家 1 選中時 */
.char-opt.selected-p1 {
    outline: 5px solid var(--p1-color) !important;
    outline-offset: -5px;
    animation: breathing-p1 0.8s infinite alternate !important;
    z-index: 5;
    transform: scale(1.1); /* 選中時稍微放大 */
}

/* 當玩家 2 選中時 */
.char-opt.selected-p2 {
    outline: 5px solid var(--p2-color) !important;
    outline-offset: -5px;
    animation: breathing-p2 0.8s infinite alternate !important;
    z-index: 5;
    transform: scale(1.1);
}

/* 定義呼吸燈動畫劇本 */
@keyframes breathing-p1 {
    0% { box-shadow: 0 0 5px var(--p1-color); }
    100% { box-shadow: 0 0 25px var(--p1-color), 0 0 10px var(--p1-color); }
}

@keyframes breathing-p2 {
    0% { box-shadow: 0 0 5px var(--p2-color); }
    100% { box-shadow: 0 0 25px var(--p2-color), 0 0 10px var(--p2-color); }
}

/* --- 特殊格子下移：取代馬路位置 --- */

.trap-cell, .boost-cell, .dino-cell {
    /* 將格子向下位移 */
    transform: translateY(110px) !important;
    z-index: 100 !important; 
    position: relative;
    overflow: visible !important; /* 確保上方的裝飾面板看得到 */
}

/* 移除原本的 ::after (馬路)，保留 ::before 用作裝飾面板 */
.trap-cell::after, .boost-cell::after, .dino-cell::after {
    display: none !important;
}

/* 1. 設定裝飾面板的通用樣式 (也就是原本上方文字格子的位置) */
.trap-cell::before, 
.boost-cell::before, 
.dino-cell::before {
    content: "EVENT" !important; 
    display: flex !important;
    justify-content: center;
    align-items: center;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 1px;
    
    position: absolute;
    top: -110px; /* 往回推到原本文字格的位置 */
    left: 0;
    width: 100%;
    height: 100%;
    
    border-radius: 15px;
    z-index: -1; /* 確保棋子踩在它上面 */
    transition: 0.3s;
}

/* 2. 為不同事件設定面板顏色與外框 */
.trap-cell::before { 
    background: rgba(250, 176, 5, 0.1) !important;

}
.boost-cell::before {

}
.dino-cell::before { 
    background: rgba(116, 195, 101, 0.1) !important;

}

/* 3. 互動效果：當滑鼠移到「下方格子」時，「上方面板」連動變亮 */
.trap-cell:hover, .boost-cell:hover, .dino-cell:hover {
    transform: translateY(110px) scale(1.02) !important;
}

.trap-cell:hover::before, .boost-cell:hover::before, .dino-cell:hover::before {

    transform: scale(1.05);
}

<body>

<div class="selection-container" style="display: flex; align-items: center; gap: 40px; width: 95%; max-width: 1400px; justify-content: center;">

 <div id="controls">

            <button onclick="startRecognition()" style="padding: 12px; background: #5d4037; color: white; border: none; border-radius: 15px; font-size: 18px; cursor: pointer; font-weight: bold;">🎤 AI 老師聽讀音</button>
            <button onclick="closeModal(true)" style="padding: 12px; background: #48bb78; color: white; border: none; border-radius: 15px; font-size: 18px; cursor: pointer; font-weight: bold;">✅ 我讀好了！</button>

<script>
let selectedP1 = "";
let selectedP2 = "";
let currentSelectingPlayer = 1; 
let pendingSteps = 0; 
let turn = 0, dice = 0, moving = false, timerInterval;
let waitingForClick = false; 
let specialEventActive = false;

const players = [{pos: 0, score: 0}, {pos: 0, score: 0}];
const traps = [1, 16, 39, 48, 61, 76, 96];
const boosts = [8, 20, 32, 51, 68, 80, 90];
const dinosaurs = [5, 12, 27, 43, 55, 70, 86, 103]; 

// ✅ 修正後的 selectChar 函數（唯一版本，請勿重複嵌套）
function selectChar(element, imgPath) {
    // 1. 如果點選的是已經選好的角色，就取消它 (觸發重設)
    if (currentSelectingPlayer === 1 && selectedP1 === imgPath) {
        resetSelection(1);
        return;
    }
    if (currentSelectingPlayer === 2 && selectedP2 === imgPath) {
        resetSelection(2);
        return;
    }

    // 2. 防止兩人選到同一個角色
    if (imgPath === selectedP1 || imgPath === selectedP2) {
        alert("這個角色已經被選走囉！");
        return;
    }

    // 3. 處理選擇邏輯 (這部分整合了美化特效)
    if (currentSelectingPlayer === 1) {
        selectedP1 = imgPath;
        const p1Preview = document.getElementById('p1-big-preview');
        if(p1Preview) {
            // ✅ 加入藍色漸層底色與「砰」動畫 (pop-effect)
            p1Preview.style.background = "linear-gradient(135deg, rgba(49, 130, 206, 0.4), rgba(255, 255, 255, 0.3))";
            p1Preview.innerHTML = `<img src="${imgPath}" class="pop-effect" style="width: 85%; height: 85%; object-fit: contain;">`;
        }
        currentSelectingPlayer = 2; // 自動換成 P2 選
        updateHint("請 玩家 2 選擇一個角色", "var(--p2-color)");
    } else {
        selectedP2 = imgPath;
        const p2Preview = document.getElementById('p2-big-preview');
        if(p2Preview) {
            // ✅ 加入粉色漸層底色與「砰」動畫 (pop-effect)
            p2Preview.style.background = "linear-gradient(135deg, rgba(213, 63, 140, 0.4), rgba(255, 255, 255, 0.3))";
            p2Preview.innerHTML = `<img src="${imgPath}" class="pop-effect" style="width: 85%; height: 85%; object-fit: contain;">`;
            
            // 只有選好後才讓 P2 方框可以點擊重選
            p2Preview.onclick = function() { resetSelection(2); };
            p2Preview.style.cursor = "pointer";
        }
        updateHint("選擇完成！可以點擊下方按鈕開始遊戲。", "#48bb78");
    }

    // 4. 更新下方角色池的發光動畫 (呼吸燈)
    updateHighlight();
}

function resetSelection(playerNum) {
    if (playerNum === 1) {
        selectedP1 = "";
        currentSelectingPlayer = 1;
        const p1Preview = document.getElementById('p1-big-preview');
        if(p1Preview) {
            p1Preview.style.background = "rgba(255, 255, 255, 0.3)"; 
            p1Preview.innerHTML = `<span style="color: white; font-weight: bold;">顯示 P1 棋子圖片</span>`;
        }
        updateHint("請 玩家 1 重新選擇角色", "var(--p1-color)");
    } else {
        selectedP2 = "";
        currentSelectingPlayer = 2;
        const p2Preview = document.getElementById('p2-big-preview');
        if(p2Preview) {
            p2Preview.style.background = "rgba(255, 255, 255, 0.3)"; 
            p2Preview.innerHTML = `<span style="color: white; font-weight: bold;">顯示 P2 棋子圖片</span>`;
            // ✅ 重置時關閉點擊功能
            p2Preview.onclick = null;
            p2Preview.style.cursor = "default";
        }
        updateHint("請 玩家 2 重新選擇角色", "var(--p2-color)");
    }
    updateHighlight();
}

// ✅ 輔助更新文字用的函數
function updateHint(text, color) {
    const hint = document.getElementById('selection-hint');
    if(hint) {
        hint.innerText = text;
        hint.style.color = color;
    }
}
    if (typeof updateHighlight === "function") {
        updateHighlight();
    }

// 更新視覺反饋：透過切換 Class 來觸發 CSS 動畫
function updateHighlight() {
    const opts = document.querySelectorAll('.char-opt');
    opts.forEach(opt => {
        const path = opt.getAttribute('src');
        
        // 1. 先移除所有選中狀態的 Class 和樣式重置
        opt.classList.remove('selected-p1', 'selected-p2');
        opt.style.opacity = "1"; 
        opt.style.animation = "none"; // 清除舊動畫
        opt.style.outline = "none";   // 清除舊框線

        // 2. 根據目前選擇的角色，重新加上對應的 Class
        if (path === selectedP1) {
            opt.classList.add('selected-p1');
        } 
        if (path === selectedP2) {
            opt.classList.add('selected-p2');
            opt.style.opacity = "0.6"; // 玩家 2 選中的角色稍微變暗，表示已被選走
        }
    });
}

// 開始遊戲按鈕
function startGame() {
    if (!selectedP1 || !selectedP2) {
        alert("兩位玩家都必須選擇角色喔！");
        return;
    }

    // 1. 設定角色圖片
    document.getElementById('p1').style.backgroundImage = `url('${selectedP1}')`;
    document.getElementById('p2').style.backgroundImage = `url('${selectedP2}')`;

    // 2. 隱藏首頁
    document.getElementById('start-screen').style.display = 'none';

    // 3. 核心動作：強行把控制列推上台
    const ctrl = document.getElementById('controls');
    if (ctrl) {
        ctrl.style.setProperty('display', 'flex', 'important');
    }

    // 4. 強行檢查按鈕是否存在並顯示
    const rollBtn = document.getElementById('btn-roll');
    if (rollBtn) {
        rollBtn.style.setProperty('display', 'inline-block', 'important');
        console.log("按鈕已強制啟動"); 
    } else {
        console.error("找不到 ID 為 btn-roll 的按鈕！請檢查 HTML");
    }

    if (typeof audio !== 'undefined' && audio.bgm.paused) toggleBGM();
}
    
// --- 音效與遊戲邏輯 (保持不變) ---
const audio = {
    bgm: new Audio('sounds/bgm.mp3'),
    dice: new Audio('sounds/sounds_dice.mp3'),
    win: new Audio('sounds/win.mp3')
};
audio.bgm.loop = true;
audio.bgm.volume = 0.1;

function toggleBGM() {
    if (audio.bgm.paused) {
        audio.bgm.play().catch(e => console.log("音樂播放被阻擋"));
        document.getElementById('music-ctrl').innerText = "🎶";
    } else {
        audio.bgm.pause();
        document.getElementById('music-ctrl').innerText = "🔇";
    }
}

function playSound(name) {
    if (audio[name]) {
        audio[name].currentTime = 0;
        audio[name].play().catch(e => {});
    }
}

async function roll() {
    // 檢查變數鎖定狀態
    if(moving || waitingForClick) return;

    // 1. 修正音效呼叫 (改用你之前定義的 audio 物件)
    try {
        if (typeof audio !== 'undefined' && audio.dice) {
            audio.dice.currentTime = 0;
            audio.dice.play();
        }
    } catch (e) { console.log("音效播放失敗，但不影響遊戲"); }

    // 禁用按鈕防止連點
    const rollBtn = document.getElementById('btn-roll');
    if (rollBtn) rollBtn.disabled = true;

    const diceBox = document.getElementById('dice-box');

    // 2. 轉動動畫
    for(let i=0; i<8; i++) {
        dice = Math.floor(Math.random() * 6) + 1; // 產生 1-6
        if (diceBox) {
            diceBox.innerText = dice; // 顯示數字
            diceBox.style.transform = `scale(${1 + Math.random() * 0.2})`; // 增加震動感
        }
        await new Promise(r => setTimeout(r, 80)); // 稍微拉長間隔，動畫更順
    }

    // 3. 動畫結束後的狀態
    waitingForClick = true;
    
    // 讓當前玩家的棋子閃爍，提醒玩家點擊
    const currentPlayerElement = document.getElementById('p' + (turn + 1));
    if (currentPlayerElement) {
        currentPlayerElement.classList.add('can-move');
    }

    // 修改提示文字
    const turnName = document.getElementById('player-turn-name');
    if (turnName) {
        turnName.innerText = (turn === 0 ? "玩家 1" : "玩家 2") + " 👈 請點擊棋子行走！";
    }
}

const rawWords = Object.keys(customDictionary);
let words = [];
let wordIdx = 0;
for (let i = 0; i < 110; i++) {
    if (i === 0) words.push("起點");
    else if (traps.includes(i) || boosts.includes(i) || dinosaurs.includes(i)) words.push("");
    else if (wordIdx < rawWords.length) { words.push(rawWords[wordIdx]); wordIdx++; }
    else { words.push("終點 🏆"); break; }
}

function init() {
    const board = document.getElementById('board');
    if (!board) return;
    board.innerHTML = "";
    let displayIndex = 1; 
    words.forEach((w, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = 'c' + i;
        
        if (i === words.length - 1) cell.classList.add('goal-cell');
        
        let iconText = "";
        if(traps.includes(i)) { iconText = "🍌"; cell.classList.add('trap-cell'); }
        else if(boosts.includes(i)) { iconText = "🚀"; cell.classList.add('boost-cell'); }
        else if(dinosaurs.includes(i)) { iconText = "🦖"; cell.classList.add('dino-cell'); }
        
        let numberHtml = (!i || i === words.length-1 || iconText) ? "" : `<span class="cell-index">${displayIndex++}</span>`;
        cell.innerHTML = `${numberHtml}${i === words.length - 1 ? `<div class="event-icon" style="font-size: 80px;">🏆</div><div class="cell-text">終點</div>` : (w !== "" ? `<div class="cell-text">${w}</div><span class="event-icon" style="position: absolute; bottom: 5px; right: 8px; font-size: 24px;">${iconText}</span>` : `<div class="event-icon" style="font-size: 50px;">${iconText}</div>`) }`;
        board.appendChild(cell);
    });
    setTimeout(updateDisplay, 100);
}

function updateDisplay() {
    players.forEach((p, i) => {
        const cell = document.getElementById('c' + p.pos);
        const pEl = document.getElementById('p' + (i + 1));
        if (!cell || !pEl) return;
        const centerX = cell.offsetLeft + (cell.offsetWidth / 2) - (pEl.offsetWidth / 2);
        pEl.style.left = centerX + 'px';
        if (cell.classList.contains('goal-cell')) {
            pEl.style.top = (cell.offsetTop + cell.offsetHeight / 2 + (i === 0 ? -40 : 20)) + 'px';
        } else {
            const roadAreaTop = cell.offsetTop + cell.offsetHeight + 15; 
            pEl.style.top = (i === 0 ? roadAreaTop - 10 : roadAreaTop + 35) + 'px';
        }
    });
}

async function handlePlayerClick(pid) {
    if (!waitingForClick || pid !== turn || moving) return;
    waitingForClick = false;
    document.getElementById('p' + (turn + 1)).classList.remove('can-move');
    if (specialEventActive) {
        let steps = pendingSteps;
        specialEventActive = false;
        pendingSteps = 0;
        await moveSteps(pid, steps);
        checkEndOrModal(pid);
    } else {
        await move(pid);
        if (!specialEventActive) checkEndOrModal(pid);
    }
}

async function move(pid) {
    moving = true;
    for(let i=0; i<dice; i++) {
        if (players[pid].pos < words.length - 1) {
            players[pid].pos++;
            updateDisplay();
            await new Promise(r => setTimeout(r, 300));
        }
    }
    moving = false;
    const pos = players[pid].pos;
    if(traps.includes(pos)) {
        await fancyAlert("🍌 哎呀！踩到香蕉滑倒了。<br><small>點擊棋子後退 1 格</small>");
        prepareSpecialStep(pid, -1);
    } else if(boosts.includes(pos)) {
        await fancyAlert("🚀 哈哈！坐上火箭衝刺！<br><small>點擊棋子前進 5 格</small>");
        prepareSpecialStep(pid, 5);
    } else if(dinosaurs.includes(pos)) {
        await fancyAlert("🦖 哇！是大恐龍！快逃...<br><small>點擊棋子後退 3 格</small>");
        prepareSpecialStep(pid, -3);
    }
}

function prepareSpecialStep(pid, steps) {
    waitingForClick = true;
    specialEventActive = true; 
    pendingSteps = steps;
    document.getElementById('p' + (pid + 1)).classList.add('can-move');
}

async function moveSteps(pid, steps) {
    moving = true;
    const isForward = steps > 0;
    for (let i = 0; i < Math.abs(steps); i++) {
        if (isForward) { if (players[pid].pos < words.length - 1) players[pid].pos++; }
        else { if (players[pid].pos > 0) players[pid].pos--; }
        updateDisplay();
        await new Promise(r => setTimeout(r, 300));
    }
    moving = false;
}

async function checkEndOrModal(pid) {
    const pos = players[pid].pos;
    if (pos === words.length - 1) {
        playSound('win');
        await fancyAlert(`🏆 玩家 ${pid + 1} 奪冠！`, "goal");
        location.reload();
    } else if (traps.includes(pos) || boosts.includes(pos) || dinosaurs.includes(pos) || pos === 0) {
        finishTurn();
    } else {
        showModal();
    }
}

function showModal() {
    const currentWord = words[players[turn].pos];
    if (!currentWord || currentWord === "起點") { finishTurn(); return; }
    document.getElementById('modal-text').innerText = currentWord;
    document.getElementById('ai-sentence-text').innerText = customDictionary[currentWord] || "請造句。";
    document.getElementById('modal').style.display = 'block';
    let timeLeft = 120;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = `⏳ 剩餘時間: ${timeLeft}s`;
        if(timeLeft <= 0) closeModal(false);
    }, 1000);
}

function speak() {
    window.speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(`${document.getElementById('modal-text').innerText}。${document.getElementById('ai-sentence-text').innerText}`);
    msg.lang = 'zh-HK';
    window.speechSynthesis.speak(msg);
}

function startRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return;
    const recognition = new SpeechRecognition();
    recognition.lang = 'zh-HK';
    const originalWord = document.getElementById('modal-text').innerText;
    recognition.start();
    recognition.onresult = (event) => {
        const result = event.results[0][0].transcript;
        if (result.includes(originalWord)) {
            players[turn].score += 5;
            document.getElementById('s' + (turn + 1)).innerText = players[turn].score;
            closeModal(true);
        }
    };
}

function fancyAlert(msg, type = 'event') {
    return new Promise(resolve => {
        const notice = document.createElement('div');
        notice.className = `special-notice notice-${type}`;
        notice.innerHTML = `${msg}<br><span style="font-size:16px; opacity:0.8;">( 點擊關閉並移動 )</span>`;
        document.body.appendChild(notice);
        setTimeout(() => notice.classList.add('show'), 10);
        notice.onclick = () => {
            notice.classList.remove('show');
            setTimeout(() => { notice.remove(); resolve(); }, 400);
        };
    });
}

function closeModal(addScore = true) {
    clearInterval(timerInterval);
    document.getElementById('modal').style.display = 'none';
    finishTurn();
}

function finishTurn() {
    turn = (turn === 0) ? 1 : 0;
    document.getElementById('player-turn-name').innerText = "玩家 " + (turn + 1);
    document.getElementById('player-turn-name').style.color = (turn === 0) ? "var(--p1-color)" : "var(--p2-color)";
    document.getElementById('btn-roll').disabled = false;
}

window.onload = init;
</script>
