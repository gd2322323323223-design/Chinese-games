<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>詞語大作戰</title>
    <style>
        :root { 
            --p1-color: #3182ce; 
            --p2-color: #d53f8c; 
            --cell-size: 90px; 
            --road-height: 90px;
        }
    
/* --- 第一部分：專門控制背景圖和模糊效果 --- */
body::before {
    content: "";
    position: fixed; 
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('images/board-bg-frontpage.png') !important;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 5;
    
    /* 這裡控制模糊，只會影響這張圖，不會影響你的棋盤文字 */
    filter: none !important; 
    -webkit-filter: none !important;
    z-index: 1;       /* 確保它在最底層 */
}

/* --- 第二部分：你原本的 body 樣式（微調） --- */
body {
    font-family: "Microsoft JhengHei", sans-serif;
    margin: 0;
    background-color: transparent !important;  
    background: transparent !important;  
    position: relative;
    overflow-y: scroll;
    padding-bottom: 200px;
    min-height: 100vh;
}
        
/* P1 選中效果：改用 outline 代替 border */
.char-opt[style*="var(--p1-color)"] {
    outline: 5px solid var(--p1-color); /* ✨ outline 不佔空間 */
    outline-offset: -5px;              /* 讓框線往內縮 */
    box-shadow: 0 0 20px var(--p1-color) !important;
    border: none !important;           /* 移除原本可能撐開空間的 border */
}

/* P2 選中效果 */
.char-opt[style*="var(--p2-color)"] {
    outline: 5px solid var(--p2-color);
    outline-offset: -5px;
    box-shadow: 0 0 20px var(--p2-color) !important;
    border: none !important;
}

/* [狀態 B] 被選取後的動作：hover 時乖乖站好不要亂跳 */
.char-opt[style*="var(--p1-color)"]:hover,
.char-opt[style*="var(--p2-color)"]:hover {
    transform: scale(1.05) translateY(0) !important; 
}

img {
  width: 100%;     /* 佔滿容器寬度 */
  height: 100%;    /* 佔滿容器高度 */
  object-fit: contain; /* 保持比例，完整顯示圖片 */
}
        
#game-container { position: relative; z-index: 10 !important; width: 95%; max-width: 1400px; margin: 20px auto; background: transparent !important;}

#board { 
    display: grid !important; 
    grid-template-columns: repeat(10, 1fr) !important; 
    gap: 140px 15px !important; 
    padding: 50px !important; 
    border-radius: 30px; 
    background: rgb(85, 61, 49, 0.7) !important; 
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: none !important;
    border: 12px solid #5d4037;
    outline: none; 
    
    /* 輕盈的投影，營造浮空感 */
    box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    
    width: 95%;
    max-width: 1400px;
    margin: 20px auto;
}

/* --- 基礎結構 (保留你的 height, flex 等設定) --- */
.cell { 
    height: var(--cell-size);
    border-radius: 20px; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    position: relative; 
    transition: 0.3s; 
    padding: 5px; 
    box-sizing: border-box;
}

.cell:not(.trap-cell):not(.boost-cell):not(.dino-cell) {
background: #ffffff !important;
    border: 2px solid #d1d5db !important;
    box-shadow: 0 8px 15px rgba(0,0,0,0.15), 0 4px 0 #94a3b8 !important; /* 雙層投影 */
    transform: translateY(-2px); /* 視覺上微浮 */
}

/* 懸停效果：變亮並彈起 */
.cell:not(.trap-cell):not(.boost-cell):not(.dino-cell):hover {
    background: #f8fafc !important;
    transform: translateY(-5px);
    box-shadow: 0 6px 0 #94a3b8 !important;
}

/* 鼠標移上去時的連動效果 */
.cell:not(.trap-cell):not(.boost-cell):not(.dino-cell):hover {
    background-color: #ffffff !important;
    transform: translateY(-5px); /* 稍微彈高一點點，更有回饋感 */
    
    /* ✨ 修正：將原本的藍灰色 #64748b 改為更深一點的泥土綠 */
    /* 這樣 hover 時的顏色變化才會跟整體森林色系連貫 */
    box-shadow: 0 8px 0 #9ba67e !important; 
}
        
/* --- 1. 香蕉格：修正空轉動態版 --- */

.trap-cell {
    background: radial-gradient(circle, #fff3bf 0%, #fab005 100%) !important;
    border: 3px dashed #873800 !important;
    position: relative;
    overflow: visible !important; 
    z-index: 10;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
}

/* 香蕉圖示：平時的搖擺動態 */
.trap-cell .event-icon {
    font-size: 50px !important;
    display: inline-block;
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
    /* ✅ 這裡改用 animation 複合寫法，確保初次載入會動 */
    animation: banana-wiggle 2s infinite ease-in-out; 
}

/* 鼠標移上去時：強制更換動畫為快速空轉 */
.trap-cell:hover .event-icon {
    /* 1s 表示轉一圈只要 1 秒，非常快 */
    animation: rotate-trap 0.3s infinite linear !important; 
}

/* --- 這裡是最重要的兩個動畫劇本 --- */

/* 1. 平時的搖擺 (Wiggle) */
@keyframes banana-wiggle {
    0%, 100% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(15deg) scale(1.1); }
}

/* 2. 觸發時的快速空轉 (Spin) - 確保這段在 CSS 裡 */
@keyframes rotate-trap {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* 鼠標移過去的背景變化 */
.trap-cell:hover {
    background: radial-gradient(circle, #fff3bf 0%, #e67e22 100%) !important;
    border-style: solid !important;
}
        
/* --- 2. 火箭格：星際穿越版 --- */

.boost-cell {
    /* ✨ 保留你最愛的 6 光點背景 */
    background: 
        radial-gradient(1.2px 1.2px at 15% 20%, white, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 80% 15%, white, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 50% 40%, white, rgba(255,255,255,0)),
        radial-gradient(1.3px 1.3px at 25% 75%, white, rgba(255,255,255,0)),
        radial-gradient(1.1px 1.1px at 70% 65%, white, rgba(255,255,255,0)),
        radial-gradient(1.4px 1.4px at 85% 85%, white, rgba(255,255,255,0)),
        linear-gradient(180deg, #0b1e3b 0%, #1a365d 100%) !important;
    
    border: 3px solid #63b3ed !important;
    position: relative;
    overflow: hidden !important; /* 為了讓流星效果不超出格線 */
    z-index: 10;
    box-shadow: 0 0 15px rgba(99, 179, 237, 0.4), inset 0 0 10px rgba(0,0,0,0.5);
    transition: all 0.5s ease;
}

/* 移除通用道路偽元素 */
.boost-cell::after, 
.boost-cell::before {
    display: none !important;
    content: none !important;
}

/* 火箭圖示設定 */
.boost-cell .event-icon {
    font-size: 50px !important;
    display: inline-block;
    filter: drop-shadow(0 0 8px rgba(66, 153, 225, 0.8));
    position: relative;
    z-index: 5;
    
    /* ✅ 常駐動態：火箭引擎的微小震動感 */
    animation: rocket-engine 0.2s infinite alternate;
}

/* 火箭引擎震動動畫 */
@keyframes rocket-engine {
    from { transform: translate(0, 0) rotate(-2deg); }
    to { transform: translate(1px, 1px) rotate(2deg); }
}

/* 鼠標移過去：啟動「超空間跳躍」效果 */
.boost-cell:hover {
    /* 背景光點拉長變成流星線條 */
    background: 
        linear-gradient(90deg, transparent, #fff, transparent) 10% 20% / 20px 1px no-repeat,
        linear-gradient(90deg, transparent, #fff, transparent) 80% 15% / 30px 1px no-repeat,
        linear-gradient(90deg, transparent, #fff, transparent) 40% 70% / 25px 1px no-repeat,
        linear-gradient(180deg, #0b1e3b 0%, #2c5282 100%) !important;
    
    box-shadow: 0 0 25px rgba(66, 153, 225, 0.8);
    transform: scale(1.05);
}

.boost-cell:hover .event-icon {
    /* 移過去時火箭向右上方衝刺出去 */
    animation: rocket-launch 0.5s infinite ease-in-out;
}

@keyframes rocket-launch {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(5px, -5px) scale(1.1); }
    100% { transform: translate(0, 0) scale(1); }
}

/* --- 3. 恐龍格：原始禁區綜合版 (方案A氛圍 + 方案B邊框) --- */

.dino-cell {
    /* ✨ 核心修改 1：深綠色原始叢林漸層背景 */
    background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 100%) !important;
    position: relative;
    overflow: hidden !important; /* 確保圓角裁剪 */
    z-index: 10;
    border-radius: 20px; /* 保持圓角一致 */
    
    /* ✨ 核心修改 2：使用 border-image 製作黃黑警告斜紋邊框 */
    border: 3px solid #48bb78 !important; /* 設定邊框寬度 */
    border-image: repeating-linear-gradient(45deg, #f1c40f, #f1c40f 10px, #000 10px, #000 20px) 10 !important;
    
    box-shadow: 0 0 15px rgba(72, 187, 120, 0.5), 0 6px 0 #064e3b !important;
    transition: 0.3s;
}

/* 移除通用道路偽元素防止干擾 */
.dino-cell::after, 
.dino-cell::before {
    display: none !important;
    content: none !important;
}

/* 恐龍圖示設定 */
.dino-cell .event-icon {
    font-size: 55px !important;
    display: inline-block;
    filter: drop-shadow(2px 4px 10px rgba(0,0,0,0.6)); /* 強化陰影，更立體 */
    position: relative;
    z-index: 5;
    
    /* ✅ 保留方案 A 的常駐動態：呼吸般的上下浮動 */
    animation: dino-breath 2s infinite ease-in-out;
}

/* 恐龍呼吸動畫 (方案 A) */
@keyframes dino-breath {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-6px) scale(1.03); }
}

/* 鼠標移過去時的效果強化 (結合方案 B 的震動咆哮) */
.dino-cell:hover {
    box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 0 15px rgba(116, 195, 101, 0.4);
}

.dino-cell:hover .event-icon {
    /* 移過去會變成生氣的咆哮震動 (方案 B 動態) */
    animation: dino-roar 0.3s infinite;
}

@keyframes dino-roar {
    0% { transform: translate(1px, 1px) rotate(0deg); }
    20% { transform: translate(-1px, -1px) rotate(-1deg); }
    40% { transform: translate(-2px, 0px) rotate(1deg); }
    60% { transform: translate(2px, 1px) rotate(0deg); }
    80% { transform: translate(-1px, -1px) rotate(1deg); }
    100% { transform: translate(1px, -2px) rotate(-1deg); }
}

/* 4. 終點整合樣式 (發光 + 佈局) */
.cell.goal-cell {
    grid-column: span 2;
    grid-row: span 2;
    height: auto;
    min-height: calc(var(--cell-size) * 2 + 130px); 
    background: radial-gradient(circle, #ffffff 0%, #fff9db 100%) !important;
    border: 6px solid #f56565 !important;
    z-index: 5;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
    gap: 10px; 
    box-shadow: 0 0 30px rgba(252, 196, 25, 0.4) !important;
    animation: goal-shine 2s infinite alternate;
}
@keyframes goal-shine {
    from { box-shadow: 0 0 20px rgba(252, 196, 25, 0.3); }
    to { box-shadow: 0 0 40px rgba(252, 196, 25, 0.6); }
}
.goal-cell .cell-text {
    font-size: 60px !important; 
    font-weight: 900;
}
.goal-cell .event-icon {
    font-size: 120px !important; 
    position: static !important; 
    order: 1 
}
.goal-cell::after, .goal-cell::before {
    display: none !important; /* 終點不需要道路 */
}

/* 5. 道路與通用效果 */
.cell:hover {
    transform: translateY(-5px);
    background-color: #fff !important;
    box-shadow: 0 10px 20px rgba(0,0,0,0.15);
}
        
.cell::after {
    content: "";
    position: absolute;
    bottom: -110px;
    left: -5px; 
    right: -5px;
    height: var(--road-height);

    /* ✨ 關鍵修改：紮實的深古道棕色 (如同你原本馬路的顏色) */
    background: #8d6e63 !important; 
    
    /* 🔴 關鍵修改 2：移除透明度 */
    opacity: 1 !important; 
    background-image: none !important; /* 保持實色 */
    
    /* 立體厚度邊框 */
    border-bottom: 6px solid #795548; 
    z-index: 1;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
        
.cell::before {
    content: "";
    position: absolute;
    bottom: calc(-110px + (var(--road-height) / 2));
    left: 10%;
    right: 10%;
    height: 2px;
    border-top: 2px dashed rgba(255, 255, 255, 0.4);
    z-index: 2;
}

.cell-text {
    color: #1a202c !important;
    text-shadow: 1px 1px 0px rgba(0,0,0,0.05); /* 極微細陰影增加清晰度 */
    font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
}
.cell-index { position: absolute; top: 8px; left: 10px; font-size: 14px; color: #a0aec0; }

.player { 
    width: 65px; 
    height: 65px; 
    position: absolute; 
    z-index: 100; 
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
}

.can-move { 
    animation: bounce 0.6s infinite alternate; 
    cursor: pointer; 
    filter: drop-shadow(0 0 15px #48bb78) brightness(1.2) !important; 
        }
        @keyframes bounce { 
            from { transform: translateY(0); } 
            to { transform: translateY(-20px); }
        }

       /* 預設狀態：徹底消失，且不准點擊 */
/* 預設絕對隱藏 */
#controls {
    position: fixed !important;
    bottom: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 120px !important; /* 加高確保看得到 */
    background: white !important; /* 先用純白，好觀察 */
    display: none !important; /* 初始隱藏 */
    justify-content: center !important;
    align-items: center !important;
    gap: 30px !important;
    z-index: 10000 !important; /* 攻頂級層級 */
    border-top: 3px solid #48bb78 !important; /* 加一條綠邊確認它有出來 */
}

/* 針對按鈕的暴力樣式 */
#btn-roll {
    min-width: 150px !important;
    min-height: 50px !important;
    background-color: #48bb78 !important; /* 綠色 */
    color: white !important;
    font-size: 20px !important;
    font-weight: bold !important;
    border-radius: 10px !important;
    display: inline-block !important; /* 確保它是區塊 */
    visibility: visible !important;
    cursor: pointer !important;
}

/* 只有當 body 標籤被加上 .game-active 類別時，控制列才會出現 */
body.game-active #controls {
    display: flex !important; /* 遊戲開始後才打開 */
}
        
        body:not(:has(#start-screen:not([style*="display: none"]))) #controls {
            display: flex !important;
            z-index: 9999 !important; /* 同時解決你說的：進入遊戲後要浮在最前方 */
        }

#dice-box {
    width: 60px !important;
    height: 60px !important;
    position: relative !important;
    transform-style: preserve-3d !important;
    transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
    background: transparent !important; /* 背景透明，因為我們要看裡面的面 */
    border: none !important; 
    margin: 0 auto !important;
}
/* 骰子的六個面共通樣式（這部分是新增，不影響原邏輯） */
.dice-face {
    position: absolute;
    width: 60px;
    height: 60px;
    background: white;
    border: 2px solid #cbd5e0;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
    color: #2d3748;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
}

/* 設定六個面的 3D 位置 */
.face-1 { transform: translateZ(30px); }
.face-2 { transform: rotateY(180deg) translateZ(30px); }
.face-3 { transform: rotateY(90deg) translateZ(30px); }
.face-4 { transform: rotateY(-90deg) translateZ(30px); }
.face-5 { transform: rotateX(90deg) translateZ(30px); }
.face-6 { transform: rotateX(-90deg) translateZ(30px); }

#btn-roll {
    position: static !important; /* 讓它回到控制列內，不要在畫面上亂飛 */
    padding: 15px 40px !important; 
    font-size: 22px !important; 
    background: #48bb78 !important; /* 變回綠色 */
    color: white !important; 
    border: none !important; 
    border-radius: 50px !important; 
    cursor: pointer !important; 
    display: inline-block !important; /* 確保它是顯示的 */
    visibility: visible !important;
}
        
        #btn-roll:hover { background: #38a169; transform: scale(1.05); }
        #btn-roll:disabled { background: #cbd5e0; transform: scale(1); }

#modal {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 85%;
    max-width: 450px;
    background: #ffffff;
    /* 移除綠色邊框改用深色，讓內容更顯眼 */
    border: 8px solid #2d3748; 
    border-radius: 40px;
    padding: 30px 20px;
    z-index: 2050;
    text-align: center;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4);
}

   #modal-text {
    font-size: 50px !important; /* 再放大幅度 */
    color: #000000 !important;   /* 強制純黑，絕對清晰 */
    font-weight: 900;
    margin: 20px 0;
    letter-spacing: 6px;
    /* 移除原本的陰影，避免視覺模糊 */
    text-shadow: none !important; 
    display: block;
}
    #modal-text:hover { transform: scale(1.1); }
        
    /* 按鈕美化 */
speak-trigger, #modal button {
    width: 100%;
    background: #2d3748 !important; /* 改用深色塊 */
    color: white !important;
    border: none;
    padding: 16px 0;
    border-radius: 50px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    margin: 10px 0;
    box-shadow: 0 4px 0 #000;
    transition: transform 0.1s;
}
        .special-notice {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            z-index: 2100;
            padding: 40px 80px;
            border-radius: 100px;
            color: white;
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 0 50px rgba(0,0,0,0.3);
            opacity: 0;
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .special-notice:hover {
            transform: translate(-50%, -50%) scale(1.05);
            filter: brightness(1.1);
        }
        .special-notice.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .notice-event {
            background: linear-gradient(45deg, #4299e1, #667eea);
            border: 8px solid #ebf8ff;
        }
        .notice-goal {
            background: linear-gradient(45deg, #ecc94b, #ed8936);
            border: 8px solid #fffaf0;
            font-size: 60px;
            animation: gold-glow 1s infinite alternate;
        }
        @keyframes modalPop {
    from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
    to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}
        /* 棋子被點擊時的縮放效果 */
.player:active {
    transform: scale(0.9) translateY(0);
    transition: 0.1s;
}

/* --- 3. 詞語造句文字：取消背景與邊框，保持清晰大字 --- */
#ai-sentence-text {
    background: transparent !important; /* 確保沒有背景方塊 */
    border: none !important;            /* 確保沒有任何邊框 */
    padding: 0 !important;              /* 移除內縮，讓文字置中 */
    margin: 15px 0 !important;          /* 給上下留一點呼吸空間 */
    font-size: 26px !important;         /* 保持大字體，閱讀不費力 */
    color: #1a202c !important;          /* 使用深灰色/黑色，最高對比度 */
    line-height: 1.6 !important;        /* 增加行高，避免文字太擠 */
    text-align: center !important;      /* 保持置中對齊 */

<script>
let selectedP1 = "";
let selectedP2 = "";
let currentSelectingPlayer = 1; 
let pendingSteps = 0; 
let turn = 0, dice = 0, moving = false, timerInterval;
let waitingForClick = false; 
let specialEventActive = false;

const players = [{pos: 0, score: 0}, {pos: 0, score: 0}];
const traps = [1, 16, 39, 48, 61, 76, 96];
const boosts = [8, 20, 32, 51, 68, 80, 90];
const dinosaurs = [5, 12, 27, 43, 55, 70, 86, 103]; 

// --- 角色選擇邏輯 ---
function selectChar(element, imgPath) {
    if (currentSelectingPlayer === 1 && selectedP1 === imgPath) { resetSelection(1); return; }
    if (currentSelectingPlayer === 2 && selectedP2 === imgPath) { resetSelection(2); return; }

    if (imgPath === selectedP1 || imgPath === selectedP2) {
        alert("這個角色已經被選走囉！");
        return;
    }

    if (currentSelectingPlayer === 1) {
        selectedP1 = imgPath;
        const p1Preview = document.getElementById('p1-big-preview');
        if(p1Preview) {
            p1Preview.style.background = "linear-gradient(135deg, rgba(49, 130, 206, 0.4), rgba(255, 255, 255, 0.3))";
            p1Preview.innerHTML = `<img src="${imgPath}" class="pop-effect" style="width: 85%; height: 85%; object-fit: contain;">`;
        }
        currentSelectingPlayer = 2;
        updateHint("請 玩家 2 選擇一個角色", "var(--p2-color)");
    } else {
        selectedP2 = imgPath;
        const p2Preview = document.getElementById('p2-big-preview');
        if(p2Preview) {
            p2Preview.style.background = "linear-gradient(135deg, rgba(213, 63, 140, 0.4), rgba(255, 255, 255, 0.3))";
            p2Preview.innerHTML = `<img src="${imgPath}" class="pop-effect" style="width: 85%; height: 85%; object-fit: contain;">`;
            p2Preview.onclick = function() { resetSelection(2); };
            p2Preview.style.cursor = "pointer";
        }
        updateHint("選擇完成！可以點擊下方按鈕開始遊戲。", "#48bb78");
    }
    updateHighlight();
}

function resetSelection(playerNum) {
    if (playerNum === 1) {
        selectedP1 = ""; currentSelectingPlayer = 1;
        const p1Preview = document.getElementById('p1-big-preview');
        if(p1Preview) {
            p1Preview.style.background = "rgba(255, 255, 255, 0.3)"; 
            p1Preview.innerHTML = `<span style="color: white; font-weight: bold;">顯示 P1 棋子圖片</span>`;
        }
        updateHint("請 玩家 1 重新選擇角色", "var(--p1-color)");
    } else {
        selectedP2 = ""; currentSelectingPlayer = 2;
        const p2Preview = document.getElementById('p2-big-preview');
        if(p2Preview) {
            p2Preview.style.background = "rgba(255, 255, 255, 0.3)"; 
            p2Preview.innerHTML = `<span style="color: white; font-weight: bold;">顯示 P2 棋子圖片</span>`;
            p2Preview.onclick = null; p2Preview.style.cursor = "default";
        }
        updateHint("請 玩家 2 重新選擇角色", "var(--p2-color)");
    }
    updateHighlight();
}

function updateHint(text, color) {
    const hint = document.getElementById('selection-hint');
    if(hint) { hint.innerText = text; hint.style.color = color; }
}

function updateHighlight() {
    const opts = document.querySelectorAll('.char-opt');
    opts.forEach(opt => {
        const path = opt.getAttribute('src');
        opt.classList.remove('selected-p1', 'selected-p2');
        opt.style.opacity = "1"; 
        if (path === selectedP1) opt.classList.add('selected-p1');
        if (path === selectedP2) { opt.classList.add('selected-p2'); opt.style.opacity = "0.6"; }
    });
}

function startGame() {
    if (!selectedP1 || !selectedP2) { alert("兩位玩家都必須選擇角色喔！"); return; }
    document.getElementById('p1').style.backgroundImage = `url('${selectedP1}')`;
    document.getElementById('p2').style.backgroundImage = `url('${selectedP2}')`;
    document.getElementById('start-screen').style.display = 'none';
    const ctrl = document.getElementById('controls');
    if (ctrl) ctrl.style.setProperty('display', 'flex', 'important');
    const rollBtn = document.getElementById('btn-roll');
    if (rollBtn) rollBtn.style.setProperty('display', 'inline-block', 'important');
    if (typeof audio !== 'undefined' && audio.bgm.paused) toggleBGM();
}

// --- 音效與語音邏輯 ---
const audio = {
    bgm: new Audio('sounds/bgm.mp3'),
    dice: new Audio('sounds/sounds_dice.mp3'),
    win: new Audio('sounds/win.mp3')
};
audio.bgm.loop = true;
audio.bgm.volume = 0.05;

function toggleBGM() {
    if (audio.bgm.paused) {
        audio.bgm.play().catch(e => console.log("音樂播放被阻擋"));
        document.getElementById('music-ctrl').innerText = "🎶";
    } else {
        audio.bgm.pause();
        document.getElementById('music-ctrl').innerText = "🔇";
    }
}

function playSound(name) {
    if (audio[name]) { audio[name].currentTime = 0; audio[name].play().catch(e => {}); }
}

// 🔊 修改後的語音函式：支援「只讀詞語」或「讀全句」
function speak(manualFlag = false, mode = 'full') {
    // 防禦機制
    if (manualFlag !== true) return;

    window.speechSynthesis.cancel();
    
    const word = document.getElementById('modal-text').innerText;
    const sentence = document.getElementById('ai-sentence-text').innerText;
    
    if (!word || word === "詞語") return;

    // 根據 mode 決定讀什麼
    let textToSpeak = "";
    if (mode === 'wordOnly') {
        textToSpeak = word; // 只讀詞語
    } else {
        textToSpeak = `${word}。${sentence}`; // 讀詞語+句子
    }

    const msg = new SpeechSynthesisUtterance(textToSpeak);
    msg.lang = 'zh-HK';
    msg.rate = 0.9;
    window.speechSynthesis.speak(msg);
}

// --- 遊戲運作邏輯 ---
async function roll() {
    // 1. 保留原本的防止重複觸發邏輯
    if(moving || waitingForClick) return;
    
    // 2. 播放音效並禁用按鈕
    playSound('dice');
    const rollBtn = document.getElementById('btn-roll');
    if (rollBtn) rollBtn.disabled = true;

    const diceBox = document.getElementById('dice-box');
    if (!diceBox) return;

    // 3. 產生最終點數 (1-6)
    const num = Math.floor(Math.random() * 6) + 1;
    
    // 4. 定義 3D 旋轉角度對應表
    const rotations = {
        1: 'rotateX(0deg) rotateY(0deg)',
        2: 'rotateX(0deg) rotateY(180deg)',
        3: 'rotateX(0deg) rotateY(-90deg)',
        4: 'rotateX(0deg) rotateY(90deg)',
        5: 'rotateX(-90deg) rotateY(0deg)',
        6: 'rotateX(90deg) rotateY(0deg)'
    };

    // 5. 3D 滾動動畫效果
    // 先讓骰子隨機亂轉幾圈 (加上 720 度讓它轉得更久一點)
    const randomRotate = `rotateX(${Math.random() * 360 + 720}deg) rotateY(${Math.random() * 360 + 720}deg)`;
    diceBox.style.transform = randomRotate;

    // 等待 600 毫秒後，定格到正確的點數面
    await new Promise(r => setTimeout(r, 600));
    diceBox.style.transform = rotations[num];

    // 6. 等待定格動畫完成後，執行你原本的後續邏輯
    await new Promise(r => setTimeout(r, 400));
    
    // 將結果存入全局變數 dice (這與你原本 movePlayer 的邏輯對接)
    dice = num; 

    // 7. 保留原本的提示與移動準備邏輯
    waitingForClick = true;
    const pEl = document.getElementById('p' + (turn + 1));
    if (pEl) pEl.classList.add('can-move');
    
    const turnName = document.getElementById('player-turn-name');
}

況。", "打招呼": "見到老師要主動打招呼。", "買水果": "市場裡的水果很新鮮，我們買了一些。", "比賽": "在比賽中，友誼第一，比賽第二。", "說話": "公共場所說話要小聲一點。", "摺紙": "勞作課上，老師教我們摺紙鶴。", "下棋": "爺爺最喜歡和鄰居在樹下下棋。", "玩拼圖": "玩拼圖需要耐心和觀察力。" };
const rawWords = Object.keys(customDictionary);
let words = [];
let wordIdx = 0;
for (let i = 0; i < 110; i++) {
    if (i === 0) words.push("起點");
    else if (traps.includes(i) || boosts.includes(i) || dinosaurs.includes(i)) words.push("");
    else if (wordIdx < rawWords.length) { words.push(rawWords[wordIdx]); wordIdx++; }
    else { words.push("終點 🏆"); break; }
}

function init() {
    const board = document.getElementById('board');
    if (!board) return;
    board.innerHTML = "";
    let displayIndex = 1; 
    words.forEach((w, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell'; cell.id = 'c' + i;
        if (i === words.length - 1) cell.classList.add('goal-cell');
        let iconText = "";
        if(traps.includes(i)) { iconText = "🍌"; cell.classList.add('trap-cell'); }
        else if(boosts.includes(i)) { iconText = "🚀"; cell.classList.add('boost-cell'); }
        else if(dinosaurs.includes(i)) { iconText = "🦖"; cell.classList.add('dino-cell'); }
        let numberHtml = (!i || i === words.length-1 || iconText) ? "" : `<span class="cell-index">${displayIndex++}</span>`;
        cell.innerHTML = `${numberHtml}${i === words.length - 1 ? `<div class="event-icon" style="font-size: 80px;">🏆</div><div class="cell-text">終點</div>` : (w !== "" ? `<div class="cell-text">${w}</div><span class="event-icon" style="position: absolute; bottom: 5px; right: 8px; font-size: 24px;">${iconText}</span>` : `<div class="event-icon" style="font-size: 50px;">${iconText}</div>`) }`;
        board.appendChild(cell);
    });
    setTimeout(updateDisplay, 100);
}

function updateDisplay() {
    players.forEach((p, i) => {
        const cell = document.getElementById('c' + p.pos);
        const pEl = document.getElementById('p' + (i + 1));
        if (!cell || !pEl) return;
        const centerX = cell.offsetLeft + (cell.offsetWidth / 2) - (pEl.offsetWidth / 2);
        pEl.style.left = centerX + 'px';
        if (cell.classList.contains('goal-cell')) {
            pEl.style.top = (cell.offsetTop + cell.offsetHeight / 2 + (i === 0 ? -40 : 20)) + 'px';
        } else {
            const roadAreaTop = cell.offsetTop + cell.offsetHeight + 15; 
            pEl.style.top = (i === 0 ? roadAreaTop - 10 : roadAreaTop + 35) + 'px';
        }
    });
}

async function handlePlayerClick(pid) {
    if (!waitingForClick || pid !== turn || moving) return;
    waitingForClick = false;
    document.getElementById('p' + (turn + 1)).classList.remove('can-move');
    if (specialEventActive) {
        let steps = pendingSteps; specialEventActive = false; pendingSteps = 0;
        await moveSteps(pid, steps);
        checkEndOrModal(pid);
    } else {
        await move(pid);
        if (!specialEventActive) checkEndOrModal(pid);
    }
}

async function move(pid) {
    moving = true;
    for(let i=0; i<dice; i++) {
        if (players[pid].pos < words.length - 1) {
            players[pid].pos++; updateDisplay();
            await new Promise(r => setTimeout(r, 300));
        }
    }
    moving = false;
    const pos = players[pid].pos;
    if(traps.includes(pos)) {
        await fancyAlert("🍌 哎呀！踩到香蕉滑倒了。<br><small>點擊棋子後退 1 格</small>");
        prepareSpecialStep(pid, -1);
    } else if(boosts.includes(pos)) {
        await fancyAlert("🚀 哈哈！坐上火箭衝刺！<br><small>點擊棋子前進 5 格</small>");
        prepareSpecialStep(pid, 5);
    } else if(dinosaurs.includes(pos)) {
        await fancyAlert("🦖 哇！是大恐龍！快逃...<br><small>點擊棋子後退 3 格</small>");
        prepareSpecialStep(pid, -3);
    }
}

function prepareSpecialStep(pid, steps) {
    waitingForClick = true; specialEventActive = true; pendingSteps = steps;
    document.getElementById('p' + (pid + 1)).classList.add('can-move');
}

async function moveSteps(pid, steps) {
    moving = true;
    const isForward = steps > 0;
    for (let i = 0; i < Math.abs(steps); i++) {
        if (isForward) { if (players[pid].pos < words.length - 1) players[pid].pos++; }
        else { if (players[pid].pos > 0) players[pid].pos--; }
        updateDisplay();
        await new Promise(r => setTimeout(r, 300));
    }
    moving = false;
}

async function checkEndOrModal(pid) {
    const pos = players[pid].pos;
    if (pos === words.length - 1) {
        playSound('win');
        await fancyAlert(`🏆 玩家 ${pid + 1} 奪冠！`, "goal");
        location.reload();
    } else if (traps.includes(pos) || boosts.includes(pos) || dinosaurs.includes(pos) || pos === 0) {
        finishTurn();
    } else {
        showModal();
    }
}

function showModal() {
    const currentWord = words[players[turn].pos];
    if (!currentWord || currentWord === "起點") { 
        finishTurn(); 
        return; 
    }

    // ✨ 核心修正：打開彈窗前先強制取消所有正在排隊的語音
    window.speechSynthesis.cancel();

    // 填入文字內容
    document.getElementById('modal-text').innerText = currentWord;
    document.getElementById('ai-sentence-text').innerText = customDictionary[currentWord] || "請嘗試用這個詞語造句。";
    
    // 顯示遮罩與彈窗
    const overlay = document.getElementById('modal-overlay');
    const modal = document.getElementById('modal');
    if (overlay) overlay.style.display = 'block';
    if (modal) modal.style.display = 'block';

    // 啟動計時器
    let timeLeft = 120;
    const timerDisplay = document.getElementById('timer');
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft--;
        if (timerDisplay) timerDisplay.innerText = `⏳ 剩餘時間: ${timeLeft}s`;
        if (timeLeft <= 0) closeModal(false);
    }, 1000);
}

function startRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return;
    const recognition = new SpeechRecognition();
    recognition.lang = 'zh-HK';
    const originalWord = document.getElementById('modal-text').innerText;
    recognition.start();
    recognition.onresult = (event) => {
        const result = event.results[0][0].transcript;
        if (result.includes(originalWord)) {
            players[turn].score += 5;
            const scoreEl = document.getElementById('s' + (turn + 1));
            if (scoreEl) scoreEl.innerText = players[turn].score;
            closeModal(true);
        }
    };
}

function fancyAlert(msg, type = 'event') {
    return new Promise(resolve => {
        const notice = document.createElement('div');
        notice.className = `special-notice notice-${type}`;
        notice.innerHTML = `${msg}<br><span style="font-size:16px; opacity:0.8;">( 點擊關閉並移動 )</span>`;
        document.body.appendChild(notice);
        setTimeout(() => notice.classList.add('show'), 10);
        notice.onclick = () => {
            notice.classList.remove('show');
            setTimeout(() => { notice.remove(); resolve(); }, 400);
        };
    });
}

function closeModal(addScore = true) {
    // 🚪 關閉彈窗時也強制停止語音
    window.speechSynthesis.cancel();
    clearInterval(timerInterval);
    
    // 隱藏遮罩與彈窗
    const overlay = document.getElementById('modal-overlay');
    const modal = document.getElementById('modal');
    if (overlay) overlay.style.display = 'none';
    if (modal) modal.style.display = 'none';
    
    finishTurn();
}
    
function finishTurn() {
    turn = (turn === 0) ? 1 : 0;
    const turnName = document.getElementById('player-turn-name');
    if (turnName) {
        turnName.innerText = "玩家 " + (turn + 1);
        turnName.style.color = (turn === 0) ? "var(--p1-color)" : "var(--p2-color)";
    }
    const rollBtn = document.getElementById('btn-roll');
    if (rollBtn) rollBtn.disabled = false;
}

// ✅ 核心修正：將所有「點擊監聽器」放在 window.onload 確保元素已載入
window.onload = function() {
    init();

    document.addEventListener('click', function(e) {
        const target = e.target;
        
        // 1. 如果點擊的是大字詞語 (ID 為 modal-text) -> 只讀詞語
        if (target && target.id === 'modal-text') {
            speak(true, 'wordOnly');
        } 
        // 2. 如果點擊的是「讀出句子」按鈕 -> 讀全句
        else if (target && (target.classList.contains('speak-trigger') || target.innerText.includes('🔊'))) {
            speak(true, 'full');
        }
    });
};
</script>
