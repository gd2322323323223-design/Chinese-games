<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貓狗詞語大作戰</title>
    <style>
        :root { 
            --p1-color: #3182ce; 
            --p2-color: #d53f8c; 
            --cell-size: 90px; 
            --road-height: 90px;
        }

        body { 
            font-family: "Microsoft JhengHei", sans-serif; 
            margin: 0; 
            background: #f0f4f8; 
            overflow-y: scroll; 
            padding-bottom: 200px; 
        }

        #game-container { position: relative; width: 95%; max-width: 1400px; margin: 20px auto; }

        #board { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            gap: 140px 15px; 
            padding: 40px 40px 150px 40px; 
            border-radius: 40px; 
            background-image: url('images/board-bg.jpg');
            background-size: cover;
            background-position: center;
            background-color: #ffffff; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.1); 
            border: 12px solid white;
        }

        .cell { 
            height: var(--cell-size);
            border-radius: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            transition: 0.3s; 
            background-color: rgba(255, 255, 255, 0.9); 
            padding: 5px; 
            box-sizing: border-box; 
            border: 2px solid #e2e8f0;
            backdrop-filter: blur(5px);
        }

        .cell.goal-cell {
            grid-column: span 2;
            grid-row: span 2;
            height: auto;
            min-height: calc(var(--cell-size) * 2 + 130px); 
            background: linear-gradient(135deg, #fff5f5 0%, #fff 100%) !important;
            border: 6px solid #f56565 !important;
            z-index: 5;
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
            gap: 10px; 
        }
        
        .goal-cell .cell-text {
            font-size: 60px !important; 
            font-weight: 900;
        }
        
        .goal-cell .event-icon {
            font-size: 120px !important; 
            position: static !important; 
            order: 1 
        }
        
        .goal-cell::after, 
        .goal-cell::before {
            display: none !important;
        }
        
        .cell::after {
            content: "";
            position: absolute;
            bottom: -110px;
            left: -10px; 
            right: -10px;
            height: var(--road-height);
            background: #4a5568; 
            border-bottom: 6px solid #cbd5e0; 
            z-index: 1;
            border-radius: 10px;
        }

        .cell::before {
            content: "";
            position: absolute;
            bottom: calc(-110px + (var(--road-height) / 2));
            left: 10%;
            right: 10%;
            height: 2px;
            border-top: 2px dashed rgba(255,255,255,0.3);
            z-index: 2;
        }

        .cell-text { font-size: 30px; font-weight: 900; color: #1a202c; z-index: 3; margin: 0; line-height: 1.2; }
        .cell-index { position: absolute; top: 8px; left: 10px; font-size: 14px; color: #a0aec0; }

        .player { 
            width: 65px; 
            height: 65px; 
            position: absolute; 
            z-index: 100; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }
        #p1 { background-image: url('images/p1.png'); }
        #p2 { background-image: url('images/p2.png'); }

        .can-move { 
            animation: bounce 0.6s infinite alternate; 
            cursor: pointer; 
            filter: drop-shadow(0 0 15px #48bb78) brightness(1.2) !important; 
        }
        @keyframes bounce { 
            from { transform: translateY(0); } 
            to { transform: translateY(-20px); }
        }

        #controls { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: rgba(255, 255, 255, 0.95); 
            display: flex; justify-content: center; align-items: center; 
            gap: 30px; padding: 20px; z-index: 100; 
            box-shadow: 0 -10px 30px rgba(0,0,0,0.05); 
            backdrop-filter: blur(10px);
        }

        #dice-box { font-size: 45px; padding: 10px 25px; background: #edf2f7; border-radius: 15px; min-width: 60px; text-align: center; }

        #btn-roll { 
            padding: 15px 40px; font-size: 22px; background: #48bb78; 
            color: white; border: none; border-radius: 50px; 
            cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        #btn-roll:hover { background: #38a169; transform: scale(1.05); }
        #btn-roll:disabled { background: #cbd5e0; transform: scale(1); }

        #modal { 
            display: none; position: fixed; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            background: white; padding: 40px; border-radius: 40px; 
            z-index: 300; box-shadow: 0 30px 100px rgba(0,0,0,0.4); 
            text-align: center; width: 90%; max-width: 450px;
            border: 10px solid #ebf8ff;
        }

        #modal-text { font-size: 70px; font-weight: 900; margin: 25px 0; cursor: pointer; color: #2b6cb0; }
        
        .special-notice {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            z-index: 1000;
            padding: 40px 80px;
            border-radius: 100px;
            color: white;
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 0 50px rgba(0,0,0,0.3);
            opacity: 0;
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .special-notice:hover {
            transform: translate(-50%, -50%) scale(1.05);
            filter: brightness(1.1);
        }
        .special-notice.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .notice-event {
            background: linear-gradient(45deg, #4299e1, #667eea);
            border: 8px solid #ebf8ff;
        }
        .notice-goal {
            background: linear-gradient(45deg, #ecc94b, #ed8936);
            border: 8px solid #fffaf0;
            font-size: 60px;
            animation: gold-glow 1s infinite alternate;
        }
        @keyframes gold-glow {
            from { box-shadow: 0 0 20px #ecc94b; }
            to { box-shadow: 0 0 60px #f6ad55, 0 0 100px rgba(236, 201, 75, 0.5); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="board"></div>
    <div id="p1" class="player" onclick="handlePlayerClick(0)"></div>
    <div id="p2" class="player" onclick="handlePlayerClick(1)"></div>
</div>

<div id="controls">
    <div style="font-size: 20px; font-weight: bold; color: #4a5568;">
        <span style="color:var(--p1-color)">P1: <span id="s1">0</span></span> | 
        <span style="color:var(--p2-color)">P2: <span id="s2">0</span></span>
    </div>
    <div id="status" style="font-size: 20px; font-weight: bold;">輪到：<span id="player-turn-name" style="color:var(--p1-color)">玩家 1</span></div>
    <div id="dice-box">🎲</div>
    <button id="btn-roll" onclick="roll()">擲骰子</button>
</div>

<div id="modal">
    <div id="timer" style="font-size: 18px; color: #e67e22; font-weight: bold;">⏳ 剩餘時間: 120s</div>
    <div id="modal-text" onclick="speak()">詞語</div>
    <div id="ai-sentence-box" style="margin: 15px 0; padding: 15px; background: #f7fafc; border-left: 5px solid #4299e1; border-radius: 10px; text-align: left;">
        <div style="font-size: 14px; color: #4299e1; font-weight: bold; margin-bottom: 5px;">🤖 AI 老師造句：</div>
        <div id="ai-sentence-text" style="font-size: 20px; color: #4a5568; line-height: 1.4;">這是一個例句。</div>
    </div>
    <p style="font-size: 14px; color: #a0aec0; margin-bottom: 20px;">💡 點擊詞語可重複聽讀音</p>
    <div style="display: flex; gap: 15px; flex-direction: column;">
        <button onclick="startRecognition()" style="padding: 12px; background: #4299e1; color: white; border: none; border-radius: 15px; font-size: 18px; cursor: pointer; font-weight: bold;">🤖 AI 檢查讀音</button>
        <button onclick="closeModal(true)" style="padding: 12px; background: #48bb78; color: white; border: none; border-radius: 15px; font-size: 18px; cursor: pointer; font-weight: bold;">✅ 我讀好了！</button>
    </div>
</div>

<script>
// --- 基礎變數定義 ---
let pendingSteps = 0; 
let turn = 0, dice = 0, moving = false, timerInterval;
let waitingForClick = false; 
let specialEventActive = false;

const players = [{pos: 0, score: 0}, {pos: 0, score: 0}];
const traps = [1, 16, 39, 48, 61, 76, 96];
const boosts = [8, 20, 32, 51, 68, 80, 90];
const dinosaurs = [5, 12, 27, 43, 55, 70, 86, 103]; 

const rawWords = ["學校", "禮堂", "校務處", "操場", "音樂室", "課室", "洗手間", "電腦室", "樓梯", "圖書館", "走廊", "升降機", "教員室", "草地上", "沙灘", "山頂", "運動場", "籃球場", "足球場", "燒烤場", "公園", "家裏", "客廳", "浴室", "睡房", "廚房", "清真寺", "商場", "超市", "街市", "麵包店", "理髮店", "便利店", "藥房", "餐廳", "醫院", "補習社", "博物館", "銀行", "地鐵站", "巴士站", "行人道", "刷牙", "洗澡", "洗手", "喝水", "吃飯", "睡覺", "穿衣服", "戴口罩", "做家務", "倒垃圾", "洗碗", "抹窗戶", "煮飯", "上課", "做功課", "溫習", "看書", "畫畫", "做早操", "跑步", "游泳", "跳繩", "踢足球", "打籃球", "騎單車", "遠足", "拍照", "表演", "唱歌", "跳舞", "慶祝", "排隊", "玩遊戲", "看手機", "打電話", "打招呼", "買水果", "比賽", "說話", "摺紙", "下棋", "玩拼圖"];

const sentenceElements = {
    times: ["早上", "中午", "放學後", "星期六", "今天", "晚上", "星期日", "早上八時", "昨天", "明天"],
    people: ["媽媽", "爸爸", "老師", "小明", "我", "姐姐", "妹妹", "叔叔", "同學", "哥哥", "弟弟", "爺爺", "姨姨", "我們"]
};

const allPlaces = rawWords.slice(0, 42); 
const allActions = rawWords.slice(42);
    
let words = [];
let wordIdx = 0;
for (let i = 0; i < 110; i++) {
    if (i === 0) words.push("起點");
    else if (traps.includes(i) || boosts.includes(i) || dinosaurs.includes(i)) words.push(""); 
    else if (wordIdx < rawWords.length) { words.push(rawWords[wordIdx]); wordIdx++; }
    else { words.push("終點 🏆"); break; }
}

function init() {
    const board = document.getElementById('board');
    board.innerHTML = "";
    let displayIndex = 1; 

    words.forEach((w, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = 'c' + i;
        const isGoal = (i === words.length - 1);
        const isStart = (i === 0);
        const isSpecial = traps.includes(i) || boosts.includes(i) || dinosaurs.includes(i);

        if (isGoal) cell.classList.add('goal-cell');
        if (isSpecial) cell.style.backgroundColor = "rgba(255, 235, 200, 0.9)";

        let iconText = "";
        if(traps.includes(i)) iconText = "🍌";
        else if(boosts.includes(i)) iconText = "🚀";
        else if(dinosaurs.includes(i)) iconText = "🦖";

        let numberHtml = "";
        if (!isStart && !isGoal && !isSpecial) {
            numberHtml = `<span class="cell-index">${displayIndex}</span>`;
            displayIndex++;
        }

        cell.innerHTML = `
            ${numberHtml}
            ${isGoal ? 
                `<div class="event-icon" style="font-size: 120px; position: static; order: 1;">🏆</div>
                 <div class="cell-text" style="font-size: 30px; order: 2;">終點</div>` :
                (w !== "" ? 
                    `<div class="cell-text">${w}</div>
                     <span class="event-icon" style="position: absolute; bottom: 5px; right: 8px; font-size: 30px;">${iconText}</span>` :
                    `<div class="event-icon" style="font-size: 70px;">${iconText}</div>`
                )
            }
        `;
        board.appendChild(cell);
    });
    setTimeout(updateDisplay, 50);
}

function updateDisplay() {
    players.forEach((p, i) => {
        const cell = document.getElementById('c' + p.pos);
        const pEl = document.getElementById('p' + (i + 1));
        if (!cell || !pEl) return;
        const centerX = cell.offsetLeft + (cell.offsetWidth / 2) - 32;
        pEl.style.left = centerX + 'px';
        if (cell.classList.contains('goal-cell')) {
            const centerY = cell.offsetTop + (cell.offsetHeight / 2) + (i === 0 ? -40 : 20);
            pEl.style.top = centerY + 'px';
        } else {
            const roadAreaTop = cell.offsetTop + cell.offsetHeight + 20; 
            pEl.style.top = (i === 0 ? roadAreaTop - 16 : roadAreaTop + 30) + 'px';
        }
    });
}

async function roll() {
    if(moving || waitingForClick) return;
    document.getElementById('btn-roll').disabled = true;
    for(let i=0; i<8; i++) {
        dice = Math.floor(Math.random()*6)+1;
        document.getElementById('dice-box').innerText = dice;
        await new Promise(r => setTimeout(r, 60));
    }
    waitingForClick = true;
    document.getElementById('p' + (turn + 1)).classList.add('can-move');
    document.getElementById('player-turn-name').innerText = "👈 請點擊棋子行走！";
}

async function handlePlayerClick(pid) {
    if (!waitingForClick || pid !== turn || moving) return;
    
    waitingForClick = false;
    document.getElementById('p' + (turn + 1)).classList.remove('can-move');

    if (specialEventActive) {
        let steps = pendingSteps;
        specialEventActive = false;
        pendingSteps = 0;
        await moveSteps(pid, steps);
    } else {
        await move(pid);
    }
    checkEndOrModal(pid);
}

async function checkEndOrModal(pid) {
    const pos = players[pid].pos;
    const isGoal = (pos === words.length - 1);
    const isSpecial = traps.includes(pos) || boosts.includes(pos) || dinosaurs.includes(pos);
    const isStart = (pos === 0);

    if (isGoal) {
        await fancyAlert(`🏆 玩家 ${pid + 1} 奪冠！`, "goal");
        location.reload();
    } else if (isSpecial || isStart) {
        finishTurn();
    } else {
        showModal();
    }
}

async function move(pid) {
    moving = true;
    for(let i=0; i<dice; i++) {
        if (players[pid].pos < words.length - 1) {
            players[pid].pos++;
            updateDisplay();
            await new Promise(r => setTimeout(r, 300));
        }
    }
    moving = false;

    const pos = players[pid].pos;
    if(traps.includes(pos)) {
        await fancyAlert("🍌 哎呀！踩到香蕉滑倒了。<br><small>點擊棋子後退 1 格</small>");
        prepareSpecialStep(pid, -1);
    } else if(boosts.includes(pos)) {
        await fancyAlert("🚀 哈哈！坐上火箭衝刺！<br><small>點擊棋子前進 5 格</small>");
        prepareSpecialStep(pid, 5);
    } else if(dinosaurs.includes(pos)) {
        await fancyAlert("🦖 哇！是大恐龍！快逃...<br><small>點擊棋子後退 3 格</small>");
        prepareSpecialStep(pid, -3);
    }
}

function prepareSpecialStep(pid, steps) {
    moving = false;
    waitingForClick = true;
    specialEventActive = true; 
    pendingSteps = steps;
    document.getElementById('p' + (pid + 1)).classList.add('can-move');
    document.getElementById('player-turn-name').innerText = "👈 請點擊棋子執行特殊事件！";
}

async function moveSteps(pid, steps) {
    if (steps === 0) return;
    moving = true;
    const isForward = steps > 0;
    const totalSteps = Math.abs(steps);
    for (let i = 0; i < totalSteps; i++) {
        if (isForward) {
            if (players[pid].pos < words.length - 1) players[pid].pos++;
        } else {
            if (players[pid].pos > 0) players[pid].pos--;
        }
        updateDisplay();
        await new Promise(r => setTimeout(r, 300));
    }
    moving = false;
}

function showModal() {
    const currentWord = words[players[turn].pos];
    document.getElementById('modal-text').innerText = currentWord;
    const sentenceText = document.getElementById('ai-sentence-text');
    const rTime = sentenceElements.times[Math.floor(Math.random() * sentenceElements.times.length)];
    const rPerson = sentenceElements.people[Math.floor(Math.random() * sentenceElements.people.length)];
    let finalSentence = "";

    if (allPlaces.includes(currentWord)) {
        const randomAction = allActions[Math.floor(Math.random() * allActions.length)];
        finalSentence = `${rTime}，${rPerson}在${currentWord}${randomAction}。`;
    } else {
        const randomPlace = allPlaces[Math.floor(Math.random() * allPlaces.length)];
        finalSentence = `${rTime}，${rPerson}在${randomPlace}${currentWord}。`;
    }

    sentenceText.innerText = finalSentence;
    document.getElementById('modal').style.display = 'block';
    let timeLeft = 60;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = `⏳ 剩餘時間: ${timeLeft}s`;
        if(timeLeft <= 0) closeModal(false);
    }, 1000);
}

function speak() {
    window.speechSynthesis.cancel();
    const word = document.getElementById('modal-text').innerText;
    const sentence = document.getElementById('ai-sentence-text').innerText;
    const msg = new SpeechSynthesisUtterance(`${word}。……句子練習：${sentence}`);
    msg.lang = 'zh-HK';
    msg.rate = 0.8;
    window.speechSynthesis.speak(msg);
}

function startRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert("抱歉，您的瀏覽器不支持語音辨識功能。建議使用 Chrome 瀏覽器。");
        return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = 'zh-HK';
    const modalText = document.getElementById('modal-text');
    const originalWord = modalText.innerText;
    modalText.innerHTML = `<span style="color:#4299e1">🎤 正在聽...請讀出「${originalWord}」</span>`;
    recognition.start();

    recognition.onresult = (event) => {
        const result = event.results[0][0].transcript;
        if (result.includes(originalWord)) {
            modalText.innerHTML = `<div style="color:#48bb78">✅ 太棒了！</div><div style="font-size:24px; color:#a0aec0">(你說: ${result})</div>`;
            players[turn].score += 5;
            document.getElementById('s' + (turn + 1)).innerText = players[turn].score;
        } else {
            modalText.innerHTML = `<div style="color:#f56565">❌ 不太對喔</div><div style="font-size:24px; color:#a0aec0">(聽成: ${result})</div>`;
        }
        setTimeout(() => { modalText.innerText = originalWord; }, 3000);
    };
    recognition.onerror = () => {
        modalText.innerHTML = `<span style="color:#e53e3e">⚠️ 無法辨識</span>`;
        setTimeout(() => { modalText.innerText = originalWord; }, 2000);
    };
}

function fancyAlert(msg, type = 'event') {
    return new Promise(resolve => {
        const notice = document.createElement('div');
        notice.className = `special-notice notice-${type}`;
        notice.innerHTML = `${msg}<br><span style="font-size:16px; opacity:0.8;">( 點擊關閉 )</span>`;
        document.body.appendChild(notice);
        setTimeout(() => notice.classList.add('show'), 10);
        notice.onclick = () => {
            notice.classList.remove('show');
            setTimeout(() => { notice.remove(); resolve(); }, 400);
        };
    });
}

function closeModal(addScore = true) {
    if (timerInterval) clearInterval(timerInterval);
    if (addScore) {
        players[turn].score += 10;
        document.getElementById('s' + (turn + 1)).innerText = players[turn].score;
    }
    document.getElementById('modal').style.display = 'none';
    finishTurn();
}

function finishTurn() {
    turn = (turn === 0) ? 1 : 0;
    const nameEl = document.getElementById('player-turn-name');
    if (nameEl) {
        nameEl.innerText = `輪到：玩家 ${turn + 1}`;
        nameEl.style.color = (turn === 0) ? 'var(--p1-color)' : 'var(--p2-color)';
    }
    document.getElementById('btn-roll').disabled = false;
    moving = false;
    waitingForClick = false;
    specialEventActive = false; 
    pendingSteps = 0;
}

window.onload = init;
</script>

</body>
</html>
