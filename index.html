<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中文詞語大富翁：88關大挑戰</title>
    <style>
        :root { --p1-color: #4299e1; --p2-color: #f687b3; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f0f7ff; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        /* 棋盤容器：自動適應寬度 */
        #game-container { position: relative; width: 100%; max-width: 1000px; margin-bottom: 100px; }
        
        #board { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); /* 固定10欄，寬度均分 */
            gap: 8px; 
            background: #fff; 
            padding: 15px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .cell { 
            aspect-ratio: 1/1; border: 2px solid #e2e8f0; border-radius: 10px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            text-align: center; font-size: 14px; font-weight: bold; position: relative; 
            background: #fff; transition: 0.3s; cursor: pointer;
        }
        .cell:hover { background: #edf2f7; }
        .cell-index { position: absolute; top: 2px; left: 4px; font-size: 10px; color: #a0aec0; }
        .start { background: #ebf8ff; border-color: #4299e1; color: #2b6cb0; }

        /* 玩家圖標 */
        .player { 
            width: 30px; height: 30px; border-radius: 50%; position: absolute; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            z-index: 10; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #p1 { background: var(--p1-color); }
        #p2 { background: var(--p2-color); }
        .can-move { animation: bounce 0.5s infinite alternate; }
        @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.3); } }

        /* 控制台固定在底部 */
        #controls { 
            position: fixed; bottom: 0; width: 100%; background: white; 
            display: flex; justify-content: center; align-items: center; gap: 20px; 
            padding: 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); z-index: 100;
        }
        #dice-box { font-size: 40px; font-weight: bold; width: 60px; text-align: center; color: #2d3748; }
        #btn-roll { padding: 12px 30px; font-size: 20px; border-radius: 30px; border: none; background: #48bb78; color: white; cursor: pointer; }
        #btn-roll:disabled { background: #cbd5e0; }

        /* 彈窗 */
        #modal { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: white; padding: 40px; border-radius: 20px; z-index: 200; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.4); text-align: center; border: 6px solid #4299e1;
        }
        #modal-text { font-size: 60px; margin-bottom: 20px; color: #2d3748; }
        #btn-speak { background: #ecc94b; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; margin-bottom: 20px; font-size: 16px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="board"></div>
    <div id="p1" class="player"></div>
    <div id="p2" class="player"></div>
</div>

<div id="controls">
    <div id="status" style="font-weight:bold;">輪到：玩家 1</div>
    <div id="dice-box">?</div>
    <button id="btn-roll" onclick="roll()">擲骰子 🎲</button>
</div>

<div id="modal">
    <div style="color:#718096; margin-bottom:10px;">請大聲讀出：</div>
    <div id="modal-text">詞語</div>
    <button id="btn-speak" onclick="speak()">🔊 聽聽發音</button><br>
    <button onclick="closeModal()" style="background:#48bb78; color:white; padding:15px 40px; border:none; border-radius:10px; font-size:20px; cursor:pointer;">讀好了！</button>
</div>

<script>
    // 你的 88 個詞語清單
    const words = ["起點", "學校", "禮堂", "校務處", "操場", "音樂室", "課室", "洗手間", "電腦室", "樓梯", "圖書館", "走廊", "升降機", "教員室", "草地上", "沙灘", "山頂", "運動場", "籃球場", "足球場", "燒烤場", "公園", "家裏", "客廳", "浴室", "睡房", "廚房", "清真寺", "商場", "超市", "街市", "麵包店", "理髮店", "便利店", "藥房", "餐廳", "醫院", "補習社", "博物館", "銀行", "地鐵站", "巴士站", "行人道", "刷牙", "洗澡", "洗手", "喝水", "吃飯", "睡覺", "穿衣服", "戴口罩", "做家務", "倒垃圾", "洗碗", "抹窗戶", "煮飯", "上課", "做功課", "溫習", "看書", "畫畫", "做早操", "跑步", "游泳", "跳繩", "踢足球", "打籃球", "騎單車", "遠足", "拍照", "表演", "唱歌", "跳舞", "慶祝", "排隊", "玩遊戲", "看手機", "打電話", "打招呼", "買水果", "比賽", "說話", "摺紙", "下棋", "玩拼圖"];

    const players = [{pos: 0, el: 'p1'}, {pos: 0, el: 'p2'}];
    let turn = 0, dice = 0, moving = false;

    // 初始化棋盤
    function init() {
        const board = document.getElementById('board');
        words.forEach((w, i) => {
            const cell = document.createElement('div');
            cell.className = 'cell' + (i===0?' start':'');
            cell.id = 'c' + i;
            cell.innerHTML = `<span class="cell-index">${i}</span>${w}`;
            board.appendChild(cell);
        });
        // 角色點擊事件
        document.getElementById('p1').onclick = () => move(0);
        document.getElementById('p2').onclick = () => move(1);
        setTimeout(updateDisplay, 100);
    }

    // 更新角色位置
    function updateDisplay() {
        players.forEach((p, i) => {
            const cell = document.getElementById('c' + p.pos);
            const rect = cell.getBoundingClientRect();
            const bRect = document.getElementById('board').getBoundingClientRect();
            const pEl = document.getElementById(p.el);
            const offset = i === 0 ? -8 : 8;
            pEl.style.left = (rect.left - bRect.left + rect.width/2 - 15 + offset) + 'px';
            pEl.style.top = (rect.top - bRect.top + rect.height/2 - 15 + offset) + 'px';
        });
    }

    async function roll() {
        document.getElementById('btn-roll').disabled = true;
        for(let i=0; i<10; i++) {
            dice = Math.floor(Math.random()*6)+1;
            document.getElementById('dice-box').innerText = dice;
            await new Promise(r => setTimeout(r, 50));
        }
        document.getElementById(players[turn].el).classList.add('can-move');
    }

    async function move(pid) {
        if(pid !== turn || dice === 0 || moving) return;
        moving = true;
        document.getElementById(players[pid].el).classList.remove('can-move');
        
        for(let i=0; i<dice; i++) {
            players[pid].pos = (players[pid].pos + 1) % words.length;
            updateDisplay();
            await new Promise(r => setTimeout(r, 300));
        }
        
        dice = 0;
        if(players[pid].pos !== 0) {
            document.getElementById('modal-text').innerText = words[players[pid].pos];
            document.getElementById('modal').style.display = 'block';
            speak(); // 到達時自動讀一次
        } else {
            endTurn();
        }
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
        endTurn();
    }

    function endTurn() {
        turn = turn === 0 ? 1 : 0;
        document.getElementById('status').innerText = `輪到：玩家 ${turn+1}`;
        document.getElementById('btn-roll').disabled = false;
        document.getElementById('dice-box').innerText = "?";
        moving = false;
    }

    // 語音功能
    function speak() {
        const text = document.getElementById('modal-text').innerText;
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-HK'; // 廣東話，如需普通話改為 'zh-CN'
        window.speechSynthesis.speak(msg);
    }

    window.onload = init;
</script>
</body>
</html>
