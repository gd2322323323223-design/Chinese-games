<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>語文挑戰遊戲</title>
    <link rel="stylesheet" href="style.css">
</head>
    
<body>
    <div id="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1999;"></div> 

    <div id="start-screen">
        <h1>詞語大作戰</h1>

        <div class="selection-container">
            <div class="player-preview">
                <h3 class="hint-label p1-theme">玩家 1 預覽</h3>
                <div id="p1-big-preview" class="preview-box" onclick="resetSelection(1)">
                    <span class="placeholder-text">P1 棋子</span>
                </div>
            </div>

            <div id="character-pool-wrapper">
                <div id="selection-hint">請 玩家 1 選擇一個角色</div>
                <div id="character-pool">
                    <img src="images/dragon.png" class="char-opt" onclick="selectChar(this, 'images/dragon.png')">
                    <img src="images/fish.png" class="char-opt" onclick="selectChar(this, 'images/fish.png')">
                    <img src="images/snail.png" class="char-opt" onclick="selectChar(this, 'images/snail.png')">
                    <img src="images/octopus.png" class="char-opt" onclick="selectChar(this, 'images/octopus.png')">
                    <img src="images/cat.png" class="char-opt" onclick="selectChar(this, 'images/cat.png')">
                    <img src="images/dog.png" class="char-opt" onclick="selectChar(this, 'images/dog.png')">
                    <img src="images/bee.png" class="char-opt" onclick="selectChar(this, 'images/bee.png')">
                    <img src="images/fairy.png" class="char-opt" onclick="selectChar(this, 'images/fairy.png')">
                    <img src="images/turtle.png" class="char-opt" onclick="selectChar(this, 'images/turtle.png')">
                    <img src="images/knight.png" class="char-opt" onclick="selectChar(this, 'images/knight.png')">
                    <img src="images/star.png" class="char-opt" onclick="selectChar(this, 'images/star.png')">
                    <img src="images/panda.png" class="char-opt" onclick="selectChar(this, 'images/panda.png')">
                </div>
                <button id="start-game-btn" onclick="startGame()">開始大作戰</button>
            </div>

            <div class="player-preview">
                <h3 class="hint-label p2-theme">玩家 2 預覽</h3>
                <div id="p2-big-preview" class="preview-box" onclick="resetSelection(2)">
                    <span class="placeholder-text">P2 棋子</span>
                </div>
            </div>
        </div> 
    </div>

    <!-- 音樂開關 (正常，沒有重複) -->
    <div id="music-ctrl" onclick="toggleBGM()">🎵</div>
    
    <!-- 遊戲容器 + 唯一的棋盤 board -->
    <div id="game-container" style="display:none;">
        <div id="board"></div>
        <div id="p1" class="player" onclick="handlePlayerClick(0)"></div>
        <div id="p2" class="player" onclick="handlePlayerClick(1)"></div>
    </div>

    <div id="controls"> 
        <div id="player-turn-name">玩家 1</div>
        <div id="dice-box">
            <div class="dice-face face-1">1</div>
            <div class="dice-face face-2">2</div>
            <div class="dice-face face-3">3</div>
            <div class="dice-face face-4">4</div>
            <div class="dice-face face-5">5</div>
            <div class="dice-face face-6">6</div>
        </div>
        <button id="btn-roll" onclick="roll()">擲骰子</button>
    </div>

    <div id="modal" style="display:none;">
        <div id="timer">⏳ 剩餘時間: 120s</div>
        <div id="modal-content"></div> 
        <div id="modal-actions"></div>
    </div>

    <div id="win-modal" style="display:none;">
        <div class="win-content">
            <div class="win-title">🏆 恭喜奪冠 🏆</div>
            <div id="win-player"></div>
            <div id="win-score"></div>
            <button onclick="restartGame()" class="win-btn">再玩一局</button>
        </div>
    </div>

    <div id="test-panel">
        <strong style="color:#5d4037; text-align:center;">題型測試面板</strong>
        <button onclick="testModal('fill')">1. 供詞填充</button>
        <button onclick="testModal('reorder')">2. 重組句子</button>
        <button onclick="testModal('match')">3. 看圖配詞</button>
        <button onclick="testModal('radical')">4. 部件辨析</button>
        <button onclick="testModal('punc')">5. 標點符號</button>
        <button onclick="testModal('continue')">6. 續寫句子</button>
        <button onclick="testModal('stroke')">7. 筆順辨認</button>
        <button onclick="testModal('understand')">8. 閱讀理解</button>
        <button onclick="document.getElementById('test-panel').remove()" style="background:#f56565; color:white; border:none; margin-top:5px; cursor:pointer;">❌ 關閉測試面板</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
