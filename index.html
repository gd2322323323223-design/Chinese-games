<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>詞語大作戰</title>
    <style>
        :root { 
            --p1-color: #3182ce; 
            --p2-color: #d53f8c; 
            --cell-size: 90px; 
            --road-height: 90px;
        }
    
/* --- 第一部分：專門控制背景圖和模糊效果 --- */
body::before {
    content: "";
    position: fixed;   /* 固定住，不隨捲軸滾動 */
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    
    /* 這裡放你的背景圖片 */
    background-image: url('images/forest-bg.jpg'); 
    background-size: cover;
    background-position: center;
    
    /* 這裡控制模糊，只會影響這張圖，不會影響你的棋盤文字 */
    filter: blur(8px); 
    -webkit-filter: blur(8px);
    z-index: -1;       /* 確保它在最底層 */
}

/* --- 第二部分：你原本的 body 樣式（微調） --- */
body {
    font-family: "Microsoft JhengHei", sans-serif;
    margin: 0;
    background-color: transparent;   
    position: relative;
    overflow-y: scroll;
    padding-bottom: 200px;
    min-height: 100vh;
}
.char-opt {
    width: 85px; 
    height: 85px; 
    object-fit: contain; 
    cursor: pointer; 
    border: 4px solid transparent; 
    border-radius: 15px; 
    background: white;
    transition: transform 0.2s, border 0.2s; /* 建議加上轉場效果，看起來更順手 */
        } 
        

#game-container { position: relative; width: 95%; max-width: 1400px; margin: 20px auto; }

#board { 
    display: grid; 
    grid-template-columns: repeat(10, 1fr); 
    gap: 140px 15px; 
    padding: 40px 40px 150px 40px; 
    border-radius: 40px; 
    background-image: url("images/board-bg.png") !important; 
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    border: 12px solid #8d6e63;
    outline: 6px solid #5d4037;
    box-shadow: 
        0 15px 0 #5d4037,           
        0 30px 60px rgba(0,0,0,0.4); 
}

.cell { 
    height: var(--cell-size);
    border-radius: 20px; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    position: relative; 
    transition: 0.3s; 
    background-color: rgba(255, 255, 255, 0.9); 
    padding: 5px; 
    box-sizing: border-box; 
    border: 2px solid #e2e8f0;
    backdrop-filter: blur(5px);
        }

.cell.goal-cell {
    grid-column: span 2;
    grid-row: span 2;
    height: auto;
    min-height: calc(var(--cell-size) * 2 + 130px); 
    background: linear-gradient(135deg, #fff5f5 0%, #fff 100%) !important;
    border: 6px solid #f56565 !important;
    z-index: 5;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
    gap: 10px; 
        }
        
    .goal-cell .cell-text {
        font-size: 60px !important; 
        font-weight: 900;
        }
        
    .goal-cell .event-icon {
        font-size: 120px !important; 
        position: static !important; 
        order: 1 
        }
        
    .goal-cell::after, 
    .goal-cell::before {
    display: none !important;
        }
        
        /* 修改道路外觀 */
.cell::after {
    content: "";
    position: absolute;
    bottom: -110px;
    left: -10px; 
    right: -10px;
    height: var(--road-height);
    /* 這裡改為森林泥土色 */
    background: #a1887f; 
    border-bottom: 6px solid #795548; /* 泥土側面 */
    z-index: 1;
    border-radius: 15px; /* 圓角稍微調大一點更可愛 */
}

/* 虛線改為落葉色或淺沙色，減少現代感 */
.cell::before {
    content: "";
    position: absolute;
    bottom: calc(-110px + (var(--road-height) / 2));
    left: 10%;
    right: 10%;
    height: 2px;
    border-top: 2px dashed rgba(255, 255, 255, 0.4); /* 增加一點點透明度 */
    z-index: 2;
}

.cell-text { font-size: 30px; font-weight: 900; color: #1a202c; z-index: 3; margin: 0; line-height: 1.2; }
.cell-index { position: absolute; top: 8px; left: 10px; font-size: 14px; color: #a0aec0; }

.player { 
    width: 65px; 
    height: 65px; 
    position: absolute; 
    z-index: 100; 
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
}
#p1 { background-image: url('images/p1.png'); }
#p2 { background-image: url('images/p2.png'); }

.can-move { 
    animation: bounce 0.6s infinite alternate; 
    cursor: pointer; 
    filter: drop-shadow(0 0 15px #48bb78) brightness(1.2) !important; 
        }
        @keyframes bounce { 
            from { transform: translateY(0); } 
            to { transform: translateY(-20px); }
        }

        #controls { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: rgba(255, 255, 255, 0.95); 
            display: flex; justify-content: center; align-items: center; 
            gap: 30px; padding: 20px; z-index: 100; 
            box-shadow: 0 -10px 30px rgba(0,0,0,0.05); 
            backdrop-filter: blur(10px);
        }

        #dice-box { font-size: 45px; padding: 10px 25px; background: #edf2f7; border-radius: 15px; min-width: 60px; text-align: center; }

        #btn-roll { 
            padding: 15px 40px; font-size: 22px; background: #48bb78; 
            color: white; border: none; border-radius: 50px; 
            cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        #btn-roll:hover { background: #38a169; transform: scale(1.05); }
        #btn-roll:disabled { background: #cbd5e0; transform: scale(1); }

        #modal { 
            display: none; position: fixed; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            background: white; padding: 40px; border-radius: 40px; 
            z-index: 300; box-shadow: 0 30px 100px rgba(0,0,0,0.4); 
            text-align: center; width: 90%; max-width: 450px;
            border: 10px solid #ebf8ff;
        }

        #modal-text { font-size: 70px; font-weight: 900; margin: 25px 0; cursor: pointer; color: #2b6cb0; }
        
        .special-notice {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            z-index: 1000;
            padding: 40px 80px;
            border-radius: 100px;
            color: white;
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 0 50px rgba(0,0,0,0.3);
            opacity: 0;
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .special-notice:hover {
            transform: translate(-50%, -50%) scale(1.05);
            filter: brightness(1.1);
        }
        .special-notice.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .notice-event {
            background: linear-gradient(45deg, #4299e1, #667eea);
            border: 8px solid #ebf8ff;
        }
        .notice-goal {
            background: linear-gradient(45deg, #ecc94b, #ed8936);
            border: 8px solid #fffaf0;
            font-size: 60px;
            animation: gold-glow 1s infinite alternate;
        }
        @keyframes gold-glow {
            from { box-shadow: 0 0 20px #ecc94b; }
            to { box-shadow: 0 0 60px #f6ad55, 0 0 100px rgba(236, 201, 75, 0.5); }
        }
        /* 棋子被點擊時的縮放效果 */
.player:active {
    transform: scale(0.9) translateY(0);
    transition: 0.1s;
}

/* 讓語音辨識的按鈕看起來更像按鈕 */
#ai-sentence-text {
    background: #f7fafc;
    padding: 15px;
    border-radius: 15px;
    margin-top: 10px;
    border-left: 5px solid #4299e1;
    font-size: 18px;
    color: #4a5568;
}
    </style>
    
</head>
<body>
    <div id="start-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.98); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(15px);">
        <h1 style="font-size: 42px; color: #5d4037; margin-bottom: 10px;">請選擇你的棋子角色</h1>
        
        <p id="selection-hint" style="font-size: 22px; color: var(--p1-color); font-weight: bold; margin-bottom: 30px;">
            請 玩家 1 點擊一個角色
        </p>

        <div id="character-pool" style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; max-width: 850px; background: #f7fafc; padding: 30px; border-radius: 30px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);">
            <img src="images/dragon.png" class="char-opt" onclick="selectChar(this, 'images/dragon.png')">
            <img src="images/fish.png" class="char-opt" onclick="selectChar(this, 'images/fish.png')">
            <img src="images/jelly fish.png" class="char-opt" onclick="selectChar(this, 'images/jelly fish.png')">
            <img src="images/octopus.png" class="char-opt" onclick="selectChar(this, 'images/octopus.png')">
            <img src="images/p1.png" class="char-opt" onclick="selectChar(this, 'images/p1.png')">
            <img src="images/p2.png" class="char-opt" onclick="selectChar(this, 'images/p2.png')">
            <img src="images/star.png" class="char-opt" onclick="selectChar(this, 'images/star.png')">
        </div>

        <div style="margin-top: 30px; display: flex; gap: 60px; font-size: 20px;">
            <div style="text-align: center;">
                <span style="color: var(--p1-color); font-weight: bold;">P1 已選：</span><br>
                <span id="p1-choice-name">未選擇</span>
            </div>
            <div style="text-align: center;">
                <span style="color: var(--p2-color); font-weight: bold;">P2 已選：</span><br>
                <span id="p2-choice-name">未選擇</span>
            </div>
        </div>

        <button id="start-game-btn" onclick="startGame()" style="margin-top: 45px; padding: 15px 60px; font-size: 26px; background: #48bb78; color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 10px 20px rgba(72,187,120,0.3); transition: 0.2s;">
            開始詞語大作戰！
        </button>
    </div>

    <div id="music-ctrl" onclick="toggleBGM()" style="position:fixed; top:20px; right:20px; z-index:1000; cursor:pointer; font-size:30px; background:white; border-radius:50%; width:50px; height:50px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,0.2);">
        🎵
    </div>
    
    <div id="game-container">
        <div id="board"></div>
        <div id="p1" class="player" onclick="handlePlayerClick(0)"></div>
        <div id="p2" class="player" onclick="handlePlayerClick(1)"></div>
    </div>
    
    <div id="controls">
        <div style="font-size: 20px; font-weight: bold; color: #4a5568;">
            <span style="color:var(--p1-color)">P1: <span id="s1">0</span></span> | 
            <span style="color:var(--p2-color)">P2: <span id="s2">0</span></span>
        </div>
        <div id="status" style="font-size: 20px; font-weight: bold;">輪到：<span id="player-turn-name" style="color:var(--p1-color)">玩家 1</span></div>
        <div id="dice-box">🎲</div>
        <button id="btn-roll" onclick="roll()">擲骰子</button>
    </div>

    <div id="modal">
        <div id="timer" style="font-size: 18px; color: #e67e22; font-weight: bold;">⏳ 剩餘時間: 120s</div>
        <div id="modal-text" onclick="speak()">詞語</div>
        <div id="ai-sentence-box" style="margin: 15px 0; padding: 15px; background: #f7fafc; border-left: 5px solid #4299e1; border-radius: 10px; text-align: left;">
            <div style="font-size: 14px; color: #4299e1; font-weight: bold; margin-bottom: 5px;">🤖 AI 老師造句：</div>
            <div id="ai-sentence-text" style="font-size: 20px; color: #4a5568; line-height: 1.4;">這是一個例句。</div>
        </div>
        <p style="font-size: 14px; color: #a0aec0; margin-bottom: 20px;">💡 點擊詞語可重複聽讀音</p>
        <div style="display: flex; gap: 15px; flex-direction: column;">
            <button onclick="startRecognition()" style="padding: 12px; background: #5d4037; color: white; border: none; border-radius: 15px; font-size: 18px; cursor: pointer; font-weight: bold;">🎤 AI 老師聽讀音</button>
            <button onclick="closeModal(true)" style="padding: 12px; background: #48bb78; color: white; border: none; border-radius: 15px; font-size: 18px; cursor: pointer; font-weight: bold;">✅ 我讀好了！</button>
        </div>
    </div>
    
<script>
// --- 核心變數與遊戲狀態 ---
let selectedP1 = "";
let selectedP2 = "";
let currentSelectingPlayer = 1; // 1 代表 P1 選, 2 代表 P2 選
let pendingSteps = 0; 
let turn = 0, dice = 0, moving = false, timerInterval;
let waitingForClick = false; 
let specialEventActive = false;

const players = [{pos: 0, score: 0}, {pos: 0, score: 0}];
const traps = [1, 16, 39, 48, 61, 76, 96];
const boosts = [8, 20, 32, 51, 68, 80, 90];
const dinosaurs = [5, 12, 27, 43, 55, 70, 86, 103]; 

function selectChar(element, imgPath) {
    if (imgPath === selectedP1 || imgPath === selectedP2) {
        alert("這個角色已經被選走囉！請選其他的。");
        return;
    }
    if (currentSelectingPlayer === 1) {
        selectedP1 = imgPath;
        document.getElementById('p1-choice-name').innerText = imgPath.split('/').pop().replace('.png', '');
        currentSelectingPlayer = 2;
        const hint = document.getElementById('selection-hint');
        if(hint) {
            hint.innerText = "請 玩家 2 選擇一個角色";
            hint.style.color = "var(--p2-color)";
        }
    } else {
        selectedP2 = imgPath;
        document.getElementById('p2-choice-name').innerText = imgPath.split('/').pop().replace('.png', '');
        currentSelectingPlayer = 1;
        const hint = document.getElementById('selection-hint');
        if(hint) {
            hint.innerText = "選擇完成！可以點擊下方按鈕開始遊戲。";
            hint.style.color = "#48bb78";
        }
    }
    updateHighlight();
}

// 更新視覺反饋
function updateHighlight() {
    const opts = document.querySelectorAll('.char-opt');
    opts.forEach(opt => {
        const path = opt.getAttribute('src');
        opt.style.border = "4px solid transparent";
        opt.style.opacity = "1";

        if (path === selectedP1) {
            opt.style.border = "5px solid var(--p1-color)";
        } 
        if (path === selectedP2) {
            opt.style.border = "5px solid var(--p2-color)";
            opt.style.opacity = "0.6";
        }
    });
}

// 開始遊戲按鈕
function startGame() {
    if (!selectedP1 || !selectedP2) {
        alert("兩位玩家都必須選擇角色喔！");
        return;
    }
    document.getElementById('p1').style.backgroundImage = `url('${selectedP1}')`;
    document.getElementById('p2').style.backgroundImage = `url('${selectedP2}')`;
    document.getElementById('start-screen').style.display = 'none';
    
    // 注意：這裡要確保你的音效對象 audio 已經在後面定義了
    if (typeof audio !== 'undefined' && audio.bgm.paused) toggleBGM();
}

// --- 音效初始化 ---
const audio = {
    bgm: new Audio('sounds/bgm.mp3'),
    dice: new Audio('sounds/dice.mp3'),
    win: new Audio('sounds/win.mp3')
};

// 背景音樂設定：循環播放、音量適中
audio.bgm.loop = true;
audio.bgm.volume = 0.1;

// 控制背景音樂開關
function toggleBGM() {
    if (audio.bgm.paused) {
        audio.bgm.play().catch(e => console.log("音樂播放被瀏覽器阻擋:", e));
        document.getElementById('music-ctrl').innerText = "🎶";
    } else {
        audio.bgm.pause();
        document.getElementById('music-ctrl').innerText = "🔇";
    }
}

// 播放音效輔助函式
function playSound(name) {
    if (audio[name]) {
        audio[name].currentTime = 0; // 每次播放重置時間，確保連點有效
        audio[name].play().catch(e => {});
    }
}

// --- 修改現有的函式來觸發音效 ---

// 1. 修改擲骰子函式
async function roll() {
    if(moving || waitingForClick) return;
    
    // 🎲 播放擲骰子音效
    playSound('dice');
    
    document.getElementById('btn-roll').disabled = true;
    for(let i=0; i<8; i++) {
        dice = Math.floor(Math.random()*6)+1;
        document.getElementById('dice-box').innerText = dice;
        await new Promise(r => setTimeout(r, 60));
    }
    waitingForClick = true;
    document.getElementById('p' + (turn + 1)).classList.add('can-move');
    document.getElementById('player-turn-name').innerText = "👈 請點擊棋子行走！";
}

// 2. 修改檢查終點與彈窗的函式
async function checkEndOrModal(pid) {
    const pos = players[pid].pos;
    const isGoal = (pos === words.length - 1);
    const isSpecial = traps.includes(pos) || boosts.includes(pos) || dinosaurs.includes(pos);

    if (isGoal) {
        // 🏆 播放獲勝音效
        playSound('win');
        
        await fancyAlert(`🏆 玩家 ${pid + 1} 奪冠！`, "goal");
        location.reload();
    } else if (isSpecial || pos === 0) {
        finishTurn();
    } else {
        showModal();
    }
}

// 你可以在這裡輸入你想要的句子，確保邏輯百分之百正確

// --- 1. 建立詞語與地圖對應表 ---
const rawWords = Object.keys(customDictionary);
let words = [];
let wordIdx = 0;

// 生成 110 格的地圖資料
for (let i = 0; i < 110; i++) {
    if (i === 0) {
        words.push("起點");
    } else if (traps.includes(i) || boosts.includes(i) || dinosaurs.includes(i)) {
        words.push(""); // 特殊格不放文字
    } else if (wordIdx < rawWords.length) {
        words.push(rawWords[wordIdx]); 
        wordIdx++;
    } else {
        words.push("終點 🏆"); 
        break; // 到達詞庫上限或終點就停止
    }
}

// --- 2. 棋盤渲染函數 ---
function init() {
    const board = document.getElementById('board');
    if (!board) return;
    board.innerHTML = "";
    let displayIndex = 1; 

    words.forEach((w, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = 'c' + i;
        
        const isGoal = (i === words.length - 1);
        const isStart = (i === 0);
        const isSpecial = traps.includes(i) || boosts.includes(i) || dinosaurs.includes(i);

        if (isGoal) cell.classList.add('goal-cell');

        let iconText = "";
        if(traps.includes(i)) iconText = "🍌";
        else if(boosts.includes(i)) iconText = "🚀";
        else if(dinosaurs.includes(i)) iconText = "🦖";

        // 生成編號（僅限普通詞語格）
        let numberHtml = "";
        if (!isStart && !isGoal && !isSpecial) {
            numberHtml = `<span class="cell-index">${displayIndex}</span>`;
            displayIndex++;
        }

        cell.innerHTML = `
            ${numberHtml}
            ${isGoal ? 
                `<div class="event-icon" style="font-size: 80px;">🏆</div><div class="cell-text">終點</div>` :
                (w !== "" ? 
                    `<div class="cell-text">${w}</div><span class="event-icon" style="position: absolute; bottom: 5px; right: 8px; font-size: 24px;">${iconText}</span>` :
                    `<div class="event-icon" style="font-size: 50px;">${iconText}</div>`
                )
            }
        `;
        board.appendChild(cell);
    });
    
    // 初始化後立即定位棋子
    setTimeout(updateDisplay, 100);
}

// --- 3. 棋子定位函數 ---
function updateDisplay() {
    players.forEach((p, i) => {
        const cell = document.getElementById('c' + p.pos);
        const pEl = document.getElementById('p' + (i + 1));
        if (!cell || !pEl) return;

        // 計算格子中心位置
        const centerX = cell.offsetLeft + (cell.offsetWidth / 2) - (pEl.offsetWidth / 2);
        pEl.style.left = centerX + 'px';

        if (cell.classList.contains('goal-cell')) {
            const centerY = cell.offsetTop + (cell.offsetHeight / 2) + (i === 0 ? -40 : 20);
            pEl.style.top = centerY + 'px';
        } else {
            // 讓棋子站在路徑（Road Area）上
            const roadAreaTop = cell.offsetTop + cell.offsetHeight + 15; 
            pEl.style.top = (i === 0 ? roadAreaTop - 10 : roadAreaTop + 35) + 'px';
        }
    });
}

// ✨ 修復核心：處理玩家點擊（包含正常移動與特殊事件後續移動）
async function handlePlayerClick(pid) {
    if (!waitingForClick || pid !== turn || moving) return;
    
    waitingForClick = false; // 立即關閉點擊許可，防止連點
    document.getElementById('p' + (turn + 1)).classList.remove('can-move');

    if (specialEventActive) {
        // 如果是特殊事件（如踩到香蕉）引發的點擊
        let steps = pendingSteps;
        specialEventActive = false;
        pendingSteps = 0;
        await moveSteps(pid, steps);
        checkEndOrModal(pid); // 移動完後再檢查
    } else {
        // 正常的擲骰子移動
        await move(pid);
        // 注意：move 內部會處理是否觸發特殊事件彈窗
        // 如果 move 沒觸發特殊事件彈窗，會在這裡檢查彈窗
        if (!specialEventActive) {
            checkEndOrModal(pid);
        }
    }
}

async function move(pid) {
    moving = true;
    for(let i=0; i<dice; i++) {
        if (players[pid].pos < words.length - 1) {
            players[pid].pos++;
            updateDisplay();
            await new Promise(r => setTimeout(r, 300));
        }
    }
    moving = false;

    const pos = players[pid].pos;
    if(traps.includes(pos)) {
        await fancyAlert("🍌 哎呀！踩到香蕉滑倒了。<br><small>點擊棋子後退 1 格</small>");
        prepareSpecialStep(pid, -1);
    } else if(boosts.includes(pos)) {
        await fancyAlert("🚀 哈哈！坐上火箭衝刺！<br><small>點擊棋子前進 5 格</small>");
        prepareSpecialStep(pid, 5);
    } else if(dinosaurs.includes(pos)) {
        await fancyAlert("🦖 哇！是大恐龍！快逃...<br><small>點擊棋子後退 3 格</small>");
        prepareSpecialStep(pid, -3);
    }
}

function prepareSpecialStep(pid, steps) {
    moving = false;
    waitingForClick = true;
    specialEventActive = true; 
    pendingSteps = steps;
    document.getElementById('p' + (pid + 1)).classList.add('can-move');
    document.getElementById('player-turn-name').innerText = "👈 請點擊棋子執行特殊事件！";
}

async function moveSteps(pid, steps) {
    moving = true;
    const isForward = steps > 0;
    const totalSteps = Math.abs(steps);
    for (let i = 0; i < totalSteps; i++) {
        if (isForward) {
            if (players[pid].pos < words.length - 1) players[pid].pos++;
        } else {
            if (players[pid].pos > 0) players[pid].pos--;
        }
        updateDisplay();
        await new Promise(r => setTimeout(r, 300));
    }
    moving = false;
}

async function checkEndOrModal(pid) {
    const pos = players[pid].pos;
    const isGoal = (pos === words.length - 1);
    const isSpecial = traps.includes(pos) || boosts.includes(pos) || dinosaurs.includes(pos);

    if (isGoal) {
        playSound('win'); // 播放獲勝音效
        await fancyAlert(`🏆 玩家 ${pid + 1} 奪冠！`, "goal");
        location.reload();
    } else if (isSpecial || pos === 0) {
        // 如果落在特殊格（如火箭、香蕉、起點），不彈窗，直接結束回合
        finishTurn();
    } else {
        // 落在普通詞語格，顯示題目彈窗
        showModal();
    }
}

function showModal() {
    const currentWord = words[players[turn].pos];
    if (!currentWord || currentWord === "" || currentWord === "起點" || currentWord === "終點 🏆") { 
        finishTurn(); 
        return; 
    }
    
    // 取得預設好的句子
    const specificSentence = customDictionary[currentWord] || "請用這個詞語造一個句子。";

    document.getElementById('modal-text').innerText = currentWord;
    document.getElementById('ai-sentence-text').innerText = specificSentence; // 直接顯示特定句子

    document.getElementById('modal').style.display = 'block';
    
    let timeLeft = 120;
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = `⏳ 剩餘時間: ${timeLeft}s`;
        if(timeLeft <= 0) closeModal(false);
    }, 1000);
}

function speak() {
    window.speechSynthesis.cancel();
    const word = document.getElementById('modal-text').innerText;
    const sentence = document.getElementById('ai-sentence-text').innerText;
    
    // 朗讀詞語 + 句子
    const msg = new SpeechSynthesisUtterance(`${word}。句子練習：${sentence}`);
    msg.lang = 'zh-HK';
    msg.rate = 0.8;
    window.speechSynthesis.speak(msg);
}

function startRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert("請使用 Chrome 瀏覽器以支援語音辨識。");
        return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = 'zh-HK';
    const modalText = document.getElementById('modal-text');
    const originalWord = modalText.innerText;
    modalText.innerHTML = `<span style="color:#4299e1">🎤 正在聽...讀出「${originalWord}」</span>`;
    recognition.start();

    recognition.onresult = (event) => {
        const result = event.results[0][0].transcript;
        if (result.includes(originalWord)) {
            modalText.innerHTML = `<div style="color:#48bb78">✅ 太棒了！</div>`;
            players[turn].score += 5;
            document.getElementById('s' + (turn + 1)).innerText = players[turn].score;
        } else {
            modalText.innerHTML = `<div style="color:#f56565">❌ 聽成: ${result}</div>`;
        }
        setTimeout(() => { modalText.innerText = originalWord; }, 2000);
    };
}

function fancyAlert(msg, type = 'event') {
    return new Promise(resolve => {
        const notice = document.createElement('div');
        notice.className = `special-notice notice-${type}`;
        notice.innerHTML = `${msg}<br><span style="font-size:16px; opacity:0.8;">( 點擊關閉並移動 )</span>`;
        document.body.appendChild(notice);
        setTimeout(() => notice.classList.add('show'), 10);
        notice.onclick = () => {
            notice.classList.remove('show');
            setTimeout(() => { notice.remove(); resolve(); }, 400);
        };
    });
}

function closeModal(addScore = true) {
    if (timerInterval) clearInterval(timerInterval);
    if (addScore) {
        players[turn].score += 10;
        document.getElementById('s' + (turn + 1)).innerText = players[turn].score;
    }
    document.getElementById('modal').style.display = 'none';
    finishTurn();
}

function finishTurn() {
    turn = (turn === 0) ? 1 : 0;
    const nameEl = document.getElementById('player-turn-name');
    nameEl.innerText = `輪到：玩家 ${turn + 1}`;
    nameEl.style.color = (turn === 0) ? 'var(--p1-color)' : 'var(--p2-color)';
    document.getElementById('btn-roll').disabled = false;
    moving = false;
    waitingForClick = false;
    specialEventActive = false;
}

window.onload = init;
</script>
