<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>詞語大作戰</title>
 <style>
        :root { 
            --p1-color: #3182ce; 
            --p2-color: #d53f8c; 
            --cell-size: 90px; 
            --road-height: 90px;
        }
    
/* --- 第一部分：專門控制背景圖和模糊效果 --- */
body::before {
    content: "";
    position: fixed; 
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('images/board-bg-frontpage.png') !important;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 5;
    
    /* 這裡控制模糊，只會影響這張圖，不會影響你的棋盤文字 */
    filter: none !important; 
    -webkit-filter: none !important;
    z-index: 1;       /* 確保它在最底層 */
}

/* --- 第二部分：你原本的 body 樣式（微調） --- */
body {
    font-family: "Microsoft JhengHei", sans-serif;
    margin: 0;
    background-color: transparent !important;  
    background: transparent !important;  
    position: relative;
    overflow-y: scroll;
    padding-bottom: 200px;
    min-height: 100vh;
}
        
/* P1 選中效果：改用 outline 代替 border */
.char-opt[style*="var(--p1-color)"] {
    outline: 5px solid var(--p1-color); /* ✨ outline 不佔空間 */
    outline-offset: -5px;              /* 讓框線往內縮 */
    box-shadow: 0 0 20px var(--p1-color) !important;
    border: none !important;           /* 移除原本可能撐開空間的 border */
}

/* P2 選中效果 */
.char-opt[style*="var(--p2-color)"] {
    outline: 5px solid var(--p2-color);
    outline-offset: -5px;
    box-shadow: 0 0 20px var(--p2-color) !important;
    border: none !important;
}

/* [狀態 B] 被選取後的動作：hover 時乖乖站好不要亂跳 */
.char-opt[style*="var(--p1-color)"]:hover,
.char-opt[style*="var(--p2-color)"]:hover {
    transform: scale(1.05) translateY(0) !important; 
}

img {
  width: 100%;     /* 佔滿容器寬度 */
  height: 100%;    /* 佔滿容器高度 */
  object-fit: contain; /* 保持比例，完整顯示圖片 */
}
        
#game-container { position: relative; z-index: 10 !important; width: 95%; max-width: 1400px; margin: 20px auto; background: transparent !important;}

#board { 
    display: grid !important; 
    grid-template-columns: repeat(10, 1fr) !important; 
    gap: 140px 15px !important; 
    padding: 40px 40px 150px 40px !important; 
    border-radius: 40px; 

    /* ✨ 關鍵修改 1：沙褐色 + 70% 透明度 (如同你原本馬路的設定) */
    background: rgba(226, 210, 180, 0.7) !important; 
    
    /* 🔴 徹底拿掉模糊，讓森林的光影直接透出來 */
    backdrop-filter: none !important; 
    -webkit-backdrop-filter: none !important;
    
    /* ✨ 關鍵修改 2：邊框改為紮實的實色木頭褐色 */
    border: 12px solid #8d6e63;
    outline: none; 
    
    /* 輕盈的投影，營造浮空感 */
    box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    
    width: 95%;
    max-width: 1400px;
    margin: -40px auto 20px auto;
}

/* --- 基礎結構 (保留你的 height, flex 等設定) --- */
.cell { 
    height: var(--cell-size);
    border-radius: 20px; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    position: relative; 
    transition: 0.3s; 
    padding: 5px; 
    box-sizing: border-box;
}

.cell:not(.trap-cell):not(.boost-cell):not(.dino-cell) {
    /* ✨ 關鍵修改 1：全實色純白，與底板拉開層次 */
    background: #ffffff !important; 
    
    /* 文字使用深軍綠色，對比清晰 */
    color: #3d4a22 !important; 
    
    /* 邊框與立體陰影調紮實 */
    border: 1px solid #e2e8f0 !important;
    box-shadow: 0 4px 0 #cbd5e1 !important; /* 紮實的立體感 */
    border-radius: 15px;
}

/* 懸停效果：變亮並彈起 */
.cell:not(.trap-cell):not(.boost-cell):not(.dino-cell):hover {
    background: #f8fafc !important;
    transform: translateY(-5px);
    box-shadow: 0 6px 0 #94a3b8 !important;
}

/* 鼠標移上去時的連動效果 */
.cell:not(.trap-cell):not(.boost-cell):not(.dino-cell):hover {
    background-color: #ffffff !important;
    transform: translateY(-5px); /* 稍微彈高一點點，更有回饋感 */
    
    /* ✨ 修正：將原本的藍灰色 #64748b 改為更深一點的泥土綠 */
    /* 這樣 hover 時的顏色變化才會跟整體森林色系連貫 */
    box-shadow: 0 8px 0 #9ba67e !important; 
}
        
/* --- 1. 香蕉格：修正空轉動態版 --- */

.trap-cell {
    background: radial-gradient(circle, #fff3bf 0%, #fab005 100%) !important;
    border: 3px dashed #873800 !important;
    position: relative;
    overflow: visible !important; 
    z-index: 10;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
}

/* 香蕉圖示：平時的搖擺動態 */
.trap-cell .event-icon {
    font-size: 50px !important;
    display: inline-block;
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
    /* ✅ 這裡改用 animation 複合寫法，確保初次載入會動 */
    animation: banana-wiggle 2s infinite ease-in-out; 
}

/* 鼠標移上去時：強制更換動畫為快速空轉 */
.trap-cell:hover .event-icon {
    /* 1s 表示轉一圈只要 1 秒，非常快 */
    animation: rotate-trap 0.3s infinite linear !important; 
}

/* --- 這裡是最重要的兩個動畫劇本 --- */

/* 1. 平時的搖擺 (Wiggle) */
@keyframes banana-wiggle {
    0%, 100% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(15deg) scale(1.1); }
}

/* 2. 觸發時的快速空轉 (Spin) - 確保這段在 CSS 裡 */
@keyframes rotate-trap {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* 鼠標移過去的背景變化 */
.trap-cell:hover {
    background: radial-gradient(circle, #fff3bf 0%, #e67e22 100%) !important;
    border-style: solid !important;
}
        
/* --- 2. 火箭格：星際穿越版 --- */

.boost-cell {
    /* ✨ 保留你最愛的 6 光點背景 */
    background: 
        radial-gradient(1.2px 1.2px at 15% 20%, white, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 80% 15%, white, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 50% 40%, white, rgba(255,255,255,0)),
        radial-gradient(1.3px 1.3px at 25% 75%, white, rgba(255,255,255,0)),
        radial-gradient(1.1px 1.1px at 70% 65%, white, rgba(255,255,255,0)),
        radial-gradient(1.4px 1.4px at 85% 85%, white, rgba(255,255,255,0)),
        linear-gradient(180deg, #0b1e3b 0%, #1a365d 100%) !important;
    
    border: 3px solid #63b3ed !important;
    position: relative;
    overflow: hidden !important; /* 為了讓流星效果不超出格線 */
    z-index: 10;
    box-shadow: 0 0 15px rgba(99, 179, 237, 0.4), inset 0 0 10px rgba(0,0,0,0.5);
    transition: all 0.5s ease;
}

/* 移除通用道路偽元素 */
.boost-cell::after, 
.boost-cell::before {
    display: none !important;
    content: none !important;
}

/* 火箭圖示設定 */
.boost-cell .event-icon {
    font-size: 50px !important;
    display: inline-block;
    filter: drop-shadow(0 0 8px rgba(66, 153, 225, 0.8));
    position: relative;
    z-index: 5;
    
    /* ✅ 常駐動態：火箭引擎的微小震動感 */
    animation: rocket-engine 0.2s infinite alternate;
}

/* 火箭引擎震動動畫 */
@keyframes rocket-engine {
    from { transform: translate(0, 0) rotate(-2deg); }
    to { transform: translate(1px, 1px) rotate(2deg); }
}

/* 鼠標移過去：啟動「超空間跳躍」效果 */
.boost-cell:hover {
    /* 背景光點拉長變成流星線條 */
    background: 
        linear-gradient(90deg, transparent, #fff, transparent) 10% 20% / 20px 1px no-repeat,
        linear-gradient(90deg, transparent, #fff, transparent) 80% 15% / 30px 1px no-repeat,
        linear-gradient(90deg, transparent, #fff, transparent) 40% 70% / 25px 1px no-repeat,
        linear-gradient(180deg, #0b1e3b 0%, #2c5282 100%) !important;
    
    box-shadow: 0 0 25px rgba(66, 153, 225, 0.8);
    transform: scale(1.05);
}

.boost-cell:hover .event-icon {
    /* 移過去時火箭向右上方衝刺出去 */
    animation: rocket-launch 0.5s infinite ease-in-out;
}

@keyframes rocket-launch {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(5px, -5px) scale(1.1); }
    100% { transform: translate(0, 0) scale(1); }
}

/* --- 3. 恐龍格：原始禁區綜合版 (方案A氛圍 + 方案B邊框) --- */

.dino-cell {
    /* ✨ 核心修改 1：深綠色原始叢林漸層背景 */
    background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 100%) !important;
    position: relative;
    overflow: hidden !important; /* 確保圓角裁剪 */
    z-index: 10;
    border-radius: 20px; /* 保持圓角一致 */
    
    /* ✨ 核心修改 2：使用 border-image 製作黃黑警告斜紋邊框 */
    border: 10px solid transparent !important; /* 設定邊框寬度 */
    border-image: repeating-linear-gradient(45deg, #f1c40f, #f1c40f 10px, #000 10px, #000 20px) 10 !important;
    
    box-shadow: inset 0 0 25px rgba(0,0,0,0.7); /* 強化內陰影，增加幽暗感 */
    transition: 0.3s;
}

/* 移除通用道路偽元素防止干擾 */
.dino-cell::after, 
.dino-cell::before {
    display: none !important;
    content: none !important;
}

/* 恐龍圖示設定 */
.dino-cell .event-icon {
    font-size: 55px !important;
    display: inline-block;
    filter: drop-shadow(2px 4px 10px rgba(0,0,0,0.6)); /* 強化陰影，更立體 */
    position: relative;
    z-index: 5;
    
    /* ✅ 保留方案 A 的常駐動態：呼吸般的上下浮動 */
    animation: dino-breath 2s infinite ease-in-out;
}

/* 恐龍呼吸動畫 (方案 A) */
@keyframes dino-breath {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-6px) scale(1.03); }
}

/* 鼠標移過去時的效果強化 (結合方案 B 的震動咆哮) */
.dino-cell:hover {
    box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 0 15px rgba(116, 195, 101, 0.4);
}

.dino-cell:hover .event-icon {
    /* 移過去會變成生氣的咆哮震動 (方案 B 動態) */
    animation: dino-roar 0.3s infinite;
}

@keyframes dino-roar {
    0% { transform: translate(1px, 1px) rotate(0deg); }
    20% { transform: translate(-1px, -1px) rotate(-1deg); }
    40% { transform: translate(-2px, 0px) rotate(1deg); }
    60% { transform: translate(2px, 1px) rotate(0deg); }
    80% { transform: translate(-1px, -1px) rotate(1deg); }
    100% { transform: translate(1px, -2px) rotate(-1deg); }
}

/* 🏆 終點格子的特別樣式 */
.cell.goal-cell {
    /* 1. 讓它變大 (佔兩格寬與高) */
    grid-column: span 2;
    grid-row: span 2;
    height: auto;
    min-height: calc(var(--cell-size) * 2 + 20px); 
    
    /* 2. 黃金流光背景 */
    background: linear-gradient(135deg, #ffd700, #ffae00, #fff700) !important;
    background-size: 200% 200% !important;
    
    /* 3. 邊框與發光 */
    border: 5px solid #fff !important;
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.8), inset 0 0 20px rgba(255,255,255,0.5);
    z-index: 10;
    
    /* 4. 佈局設定 */
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
    gap: 10px;
    
    /* 5. 呼吸動畫 */
    animation: goal-shine 3s infinite ease-in-out, gold-flow 3s infinite linear;
    position: relative;
}

/* 讓金色背景動起來的動畫 */
@keyframes gold-flow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* 呼吸縮放動畫 */
@keyframes goal-shine {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); filter: brightness(1.2); }
    100% { transform: scale(1); }
}

/* 終點文字：加粗、變大 */
.goal-cell .cell-text {
    font-size: 48px !important;
    font-weight: 900 !important;
    color: #8b4513 !important; /* 深棕色在金色上更好看 */
    text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
    order: 2;
}

/* 終點圖標：大獎盃 */
.goal-cell .event-icon {
    font-size: 100px !important;
    order: 1;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.8));
}

/* 移除終點格子的道路線條，保持乾淨 */
.goal-cell::after, .goal-cell::before {
    display: none !important;
}
        
/* 5. 道路與通用效果 */
.cell:hover {
    transform: translateY(-5px);
    background-color: #fff !important;
    box-shadow: 0 10px 20px rgba(0,0,0,0.15);
}

.cell.goal-cell:hover {
    background: linear-gradient(135deg, #ffd700, #ffae00, #fff700) !important;
    transform: scale(1.05) translateY(-5px) !important;
    filter: brightness(1.2) !important;
}
        
.cell::after {
    content: "";
    position: absolute;
    bottom: -110px;
    left: -5px; 
    right: -5px;
    height: var(--road-height);

    /* ✨ 關鍵修改：紮實的深古道棕色 (如同你原本馬路的顏色) */
    background: #8d6e63 !important; 
    
    /* 🔴 關鍵修改 2：移除透明度 */
    opacity: 1 !important; 
    background-image: none !important; /* 保持實色 */
    
    /* 立體厚度邊框 */
    border-bottom: 6px solid #795548; 
    z-index: 1;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
        
.cell::before {
    content: "";
    position: absolute;
    bottom: calc(-110px + (var(--road-height) / 2));
    left: 10%;
    right: 10%;
    height: 2px;
    border-top: 2px dashed rgba(255, 255, 255, 0.4);
    z-index: 2;
}

.cell-text { font-size: 30px; font-weight: 900; color: #1a202c; z-index: 3; margin: 0; line-height: 1.2; }
.cell-index { position: absolute; top: 8px; left: 10px; font-size: 14px; color: #a0aec0; }

.player { 
    width: 65px; 
    height: 65px; 
    position: absolute; 
    z-index: 100; 
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
}

.can-move { 
    animation: bounce 0.6s infinite alternate; 
    cursor: pointer; 
    filter: drop-shadow(0 0 15px #48bb78) brightness(1.2) !important; 
        }
        @keyframes bounce { 
            from { transform: translateY(0); } 
            to { transform: translateY(-20px); }
        }

#controls {
    position: fixed; /* 保持固定位置 */
    bottom: 20px;    /* 距離底部一點距離，不要貼死 */
    right: 20px;     /* 移到右下角，避開棋盤主體 */
    width: auto !important;   /* 🚩 關鍵：寬度不要全滿 */
    background: rgba(255, 255, 255, 0.8) !important; /* 半透明白色，透出背景森林 */
    backdrop-filter: blur(5px); /* 毛玻璃效果 */
    border: 2px solid #48bb78 !important; /* 綠色邊框 */
    border-radius: 50px !important;       /* 圓角化，看起來更像控制台 */
    padding: 10px 25px !important;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2) !important;
    display: flex;
    align-items: center;
    gap: 15px;
    z-index: 1000;
}

/* 只有當 body 標籤被加上 .game-active 類別時，控制列才會出現 */
body.game-active #controls {
    display: flex !important; /* 遊戲開始後才打開 */
}
        
        body:not(:has(#start-screen:not([style*="display: none"]))) #controls {
            display: flex !important;
            z-index: 9999 !important; /* 同時解決你說的：進入遊戲後要浮在最前方 */
        }

#dice-box {
    width: 60px !important;
    height: 60px !important;
    position: relative !important;
    transform-style: preserve-3d !important;
    transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
    background: transparent !important; /* 背景透明，因為我們要看裡面的面 */
    border: none !important; 
    margin: 0 auto !important;
}
/* 骰子的六個面共通樣式（這部分是新增，不影響原邏輯） */
.dice-face {
    position: absolute;
    width: 60px;
    height: 60px;
    background: white;
    border: 2px solid #cbd5e0;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
    color: #000000;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
}

/* 設定六個面的 3D 位置 */
.face-1 { transform: translateZ(30px); }
.face-2 { transform: rotateY(180deg) translateZ(30px); }
.face-3 { transform: rotateY(90deg) translateZ(30px); }
.face-4 { transform: rotateY(-90deg) translateZ(30px); }
.face-5 { transform: rotateX(90deg) translateZ(30px); }
.face-6 { transform: rotateX(-90deg) translateZ(30px); }

#btn-roll {
    position: static !important; /* 讓它回到控制列內，不要在畫面上亂飛 */
    padding: 15px 40px !important; 
    font-size: 22px !important; 
    background: #48bb78 !important; /* 變回綠色 */
    color: white !important; 
    border: none !important; 
    border-radius: 50px !important; 
    cursor: pointer !important; 
    display: none; 
    visibility: visible !important;
}
        
        #btn-roll:hover { background: #38a169; transform: scale(1.05); }
        #btn-roll:disabled { background: #cbd5e0; transform: scale(1); }

#modal {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 85%;
    max-width: 450px;
    background: #ffffff;
    /* 移除綠色邊框改用深色，讓內容更顯眼 */
    border: 8px solid #3182ce; 
    border-radius: 40px;
    padding: 30px 20px;
    z-index: 2050;
    text-align: center;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4);
}

   #modal-text {
    font-size: 60px !important; /* 再放大幅度 */
    color: #1a365d !important;   /* 強制純黑，絕對清晰 */
    font-weight: 900;
    margin: 20px 0;
    letter-spacing: 6px;
    /* 移除原本的陰影，避免視覺模糊 */
    text-shadow: none !important; 
    display: block;
}
    #modal-text:hover { transform: scale(1.1); }
        

        .special-notice {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            z-index: 2100;
            padding: 40px 80px;
            border-radius: 100px;
            color: white;
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 0 50px rgba(0,0,0,0.3);
            opacity: 0;
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .special-notice:hover {
            transform: translate(-50%, -50%) scale(1.05);
            filter: brightness(1.1);
        }
        .special-notice.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .notice-event {
            background: linear-gradient(45deg, #4299e1, #667eea);
            border: 8px solid #ebf8ff;
        }
        .notice-goal {
            background: linear-gradient(45deg, #ecc94b, #ed8936);
            border: 8px solid #fffaf0;
            font-size: 60px;
            animation: gold-glow 1s infinite alternate;
        }
        @keyframes modalPop {
    from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }

// --- 遊戲運作邏輯 ---
async function roll() {
    // 1. 保留原本的防止重複觸發邏輯
    if(moving || waitingForClick) return;
    
    // 2. 播放音效並禁用按鈕
    playSound('dice');
    const rollBtn = document.getElementById('btn-roll');
    if (rollBtn) rollBtn.disabled = true;

    const diceBox = document.getElementById('dice-box');
    if (!diceBox) return;

    // 3. 產生最終點數 (1-6)
    const num = Math.floor(Math.random() * 6) + 1;
    
    // 4. 定義 3D 旋轉角度對應表
    const rotations = {
        1: 'rotateX(0deg) rotateY(0deg)',
        2: 'rotateX(0deg) rotateY(180deg)',
        3: 'rotateX(0deg) rotateY(-90deg)',
        4: 'rotateX(0deg) rotateY(90deg)',
        5: 'rotateX(-90deg) rotateY(0deg)',
        6: 'rotateX(90deg) rotateY(0deg)'
    };

    // 5. 3D 滾動動畫效果
    // 先讓骰子隨機亂轉幾圈 (加上 720 度讓它轉得更久一點)
    const randomRotate = `rotateX(${Math.random() * 360 + 720}deg) rotateY(${Math.random() * 360 + 720}deg)`;
    diceBox.style.transform = randomRotate;

    // 等待 600 毫秒後，定格到正確的點數面
    await new Promise(r => setTimeout(r, 600));
    diceBox.style.transform = rotations[num];

    // 6. 等待定格動畫完成後，執行你原本的後續邏輯
    await new Promise(r => setTimeout(r, 400));
    
    // 將結果存入全局變數 dice (這與你原本 movePlayer 的邏輯對接)
    dice = num; 

    // 7. 保留原本的提示與移動準備邏輯
    waitingForClick = true;
    const pEl = document.getElementById('p' + (turn + 1));
    if (pEl) pEl.classList.add('can-move');
    
    const turnName = document.getElementById('player-turn-name');
}

function init() {
    const board = document.getElementById('board');
    if (!board) return;
    board.innerHTML = "";
    let displayIndex = 1; 

    // --- 重新設定棋盤文字邏輯 ---
words = []; // 先清空
for (let i = 0; i < 110; i++) {
    if (i === 0) words.push("起點");
    else if (i === 109) words.push("終點 🏆");
    else if (traps.includes(i) || boosts.includes(i) || dinosaurs.includes(i)) words.push("");
    else words.push("語文挑戰"); 
}
    
    words.forEach((w, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell'; 
        cell.id = 'c' + i;

        // 🟢 重點：在這裡定義 isGoal
        const isGoal = (i === words.length - 1);

        if (isGoal) {
            // 🏆 終點格子邏輯
            cell.classList.add('goal-cell');
            cell.innerHTML = `
                <div class="event-icon">🏆</div>
                <div class="cell-text">終點</div>
            `;
        } else {
            // 🍌🚀🦖 其他格子邏輯
            let iconText = "";
            if(traps.includes(i)) { iconText = "🍌"; cell.classList.add('trap-cell'); }
            else if(boosts.includes(i)) { iconText = "🚀"; cell.classList.add('boost-cell'); }
            else if(dinosaurs.includes(i)) { iconText = "🦖"; cell.classList.add('dino-cell'); }

            let numberHtml = (!i || iconText) ? "" : `<span class="cell-index">${displayIndex++}</span>`;
            
            cell.innerHTML = `
                ${numberHtml}
                ${w !== "" ? `<div class="cell-text">${w}</div>` : ""}
                <span class="event-icon" style="${w !== "" ? 'position: absolute; bottom: 5px; right: 8px; font-size: 24px;' : 'font-size: 50px;'}">${iconText}</span>
            `;
        }
        board.appendChild(cell);
    });
    setTimeout(updateDisplay, 100);
}

function updateDisplay() {
    players.forEach((p, i) => {
        const cell = document.getElementById('c' + p.pos);
        const pEl = document.getElementById('p' + (i + 1));
        if (!cell || !pEl) return;
        const centerX = cell.offsetLeft + (cell.offsetWidth / 2) - (pEl.offsetWidth / 2);
        pEl.style.left = centerX + 'px';
        if (cell.classList.contains('goal-cell')) {
            pEl.style.top = (cell.offsetTop + cell.offsetHeight / 2 + (i === 0 ? -40 : 20)) + 'px';
        } else {
            const roadAreaTop = cell.offsetTop + cell.offsetHeight + 15; 
            pEl.style.top = (i === 0 ? roadAreaTop - 10 : roadAreaTop + 35) + 'px';
        }
    });
}

async function handlePlayerClick(pid) {
    if (!waitingForClick || pid !== turn || moving) return;
    waitingForClick = false;
    document.getElementById('p' + (turn + 1)).classList.remove('can-move');
    if (specialEventActive) {
        let steps = pendingSteps; specialEventActive = false; pendingSteps = 0;
        await moveSteps(pid, steps);
        checkEndOrModal(pid);
    } else {
        await move(pid);
        if (!specialEventActive) checkEndOrModal(pid);
    }
}

async function move(pid) {
    moving = true;
    for(let i=0; i<dice; i++) {
        if (players[pid].pos < words.length - 1) {
            players[pid].pos++; updateDisplay();
            await new Promise(r => setTimeout(r, 300));
        }
    }
    moving = false;
    const pos = players[pid].pos;
    if(traps.includes(pos)) {
        await fancyAlert("🍌 哎呀！踩到香蕉滑倒了。<br><small>點擊棋子後退 1 格</small>");
        prepareSpecialStep(pid, -1);
    } else if(boosts.includes(pos)) {
        await fancyAlert("🚀 哈哈！坐上火箭衝刺！<br><small>點擊棋子前進 5 格</small>");
        prepareSpecialStep(pid, 5);
    } else if(dinosaurs.includes(pos)) {
        await fancyAlert("🦖 哇！是大恐龍！快逃...<br><small>點擊棋子後退 3 格</small>");
        prepareSpecialStep(pid, -3);
    }
}

function prepareSpecialStep(pid, steps) {
    waitingForClick = true; specialEventActive = true; pendingSteps = steps;
    document.getElementById('p' + (pid + 1)).classList.add('can-move');
}

async function moveSteps(pid, steps) {
    moving = true;
    const isForward = steps > 0;
    for (let i = 0; i < Math.abs(steps); i++) {
        if (isForward) { if (players[pid].pos < words.length - 1) players[pid].pos++; }
        else { if (players[pid].pos > 0) players[pid].pos--; }
        updateDisplay();
        await new Promise(r => setTimeout(r, 300));
    }
    moving = false;
}

async function checkEndOrModal(pid) {
    const pos = players[pid].pos;
    if (pos === words.length - 1) {
        playSound('win');
        await fancyAlert(`🏆 玩家 ${pid + 1} 奪冠！`, "goal");
        location.reload();
    } else if (traps.includes(pos) || boosts.includes(pos) || dinosaurs.includes(pos) || pos === 0) {
        finishTurn();
    } else {
        showModal();
    }
}

function showModal() {
    // 1. 隨機抽一題
    const task = allTasks[Math.floor(Math.random() * allTasks.length)];
    
    // 2. 獲取 HTML 容器
    const content = document.getElementById('modal-content');
    const actions = document.getElementById('modal-actions');
    if (!content || !actions) return;

    // 清空舊內容
    content.innerHTML = "";
    actions.innerHTML = "";

    // 3. 根據題型生成 HTML 內容
    let html = `<div class="challenge-container">`;
    
    if (task.gif) { // 看圖配詞
        html += `<img src="images/${task.gif}" style="width:200px; border-radius:10px; margin-bottom:10px;">`;
    }
    if (task.sentence) { // 閱讀理解
        html += `<div style="background:#f0f7ff; padding:15px; border-radius:10px; margin-bottom:10px; text-align:left;">${task.sentence}</div>`;
    }
    
    html += `<p style="font-size:24px; font-weight:bold; margin-bottom:20px;">${task.question}</p>`;
    
    if (task.type === "reorder") {
        // --- 重組句子題型 ---
        html += `<div id="reorder-zone" style="min-height:50px; border:2px dashed #ccc; padding:10px; margin-bottom:10px; display:flex; flex-wrap:wrap; gap:5px; justify-content:center;"></div>`;
        html += `<div class="word-pool">`;
        task.words.forEach(w => {
            html += `<button class="opt-btn" style="width:auto; margin:5px;" onclick="addToReorder(this)">${w}</button>`;
        });
        html += `</div></div>`;
        content.innerHTML = html;

        // 建立提交按鈕
        const submitBtn = document.createElement('button');
        submitBtn.className = "opt-btn";
        submitBtn.style.background = "#3182ce";
        submitBtn.style.marginTop = "15px";
        submitBtn.innerText = "確認句子順序";
        submitBtn.onclick = () => {
            const userSentence = Array.from(document.getElementById('reorder-zone').children)
                                     .map(btn => btn.innerText).join("");
            checkUserAnswer(userSentence, task.answer);
        };
        actions.appendChild(submitBtn);
    } else {
        // --- 其他題型 (填充、選擇、標點、部件等) ---
        html += `</div>`;
        content.innerHTML = html;

        // 只有在非重組題型下才生成選項按鈕
        if (task.options) {
            task.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "opt-btn";
                btn.innerText = opt;
                btn.onclick = () => checkUserAnswer(opt, task.answer);
                actions.appendChild(btn);
            });
        }
    }

    // 4. 顯示彈窗與遮罩
    document.getElementById('modal-overlay').style.display = 'block';
    document.getElementById('modal').style.display = 'block';

    // 5. 啟動計時器
    let timeLeft = 120;
    const timerDisplay = document.getElementById('timer');
    clearInterval(timerInterval); 
    timerInterval = setInterval(() => {
        timeLeft--;
        if (timerDisplay) timerDisplay.innerText = `⏳ 剩餘時間: ${timeLeft}s`;
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            closeModal(); 
        }
    }, 1000);
}

// --- 2. 檢查答案 (由按鈕觸發) ---
function checkUserAnswer(userSelect, correctAnswer) {
    if (userSelect === correctAnswer) {
        alert("✅ 太棒了！答對了。");
        // 如果要加分：players[turn].score += 10;
    } else {
        alert("❌ 差一點點！正確答案是：" + correctAnswer);
    }
    closeModal(); // 檢查完畢後關閉彈窗
}
    // 點擊詞語方塊將其加入上方空格
function addToReorder(btn) {
    const zone = document.getElementById('reorder-zone');
    if (!zone) return;
    
    // 複製一個方塊放到上方區域
    const newBtn = btn.cloneNode(true);
    newBtn.onclick = function() { this.remove(); }; // 點擊上方的方塊可以移除
    zone.appendChild(newBtn);
}

// --- 3. 關閉彈窗並換人 ---
function closeModal() {
    // 停止所有活動
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    clearInterval(timerInterval);
    
    // 隱藏 UI
    const overlay = document.getElementById('modal-overlay');
    const modal = document.getElementById('modal');
    if (overlay) overlay.style.display = 'none';
    if (modal) modal.style.display = 'none';
    
    // 執行換人
    finishTurn();
}

// --- 4. 切換回合 (核心邏輯) ---
function finishTurn() {
    turn = (turn === 0) ? 1 : 0;
    const turnName = document.getElementById('player-turn-name');
    if (turnName) {
        turnName.innerText = "玩家 " + (turn + 1);
        turnName.style.color = (turn === 0) ? "var(--p1-color)" : "var(--p2-color)";
    }
    // 重新啟用骰子按鈕
    const rollBtn = document.getElementById('btn-roll');
    if (rollBtn) rollBtn.disabled = false;
}

// --- 5. 事件提示 (香蕉皮、火箭等) ---
function fancyAlert(msg, type = 'event') {
    return new Promise(resolve => {
        const notice = document.createElement('div');
        notice.className = `special-notice notice-${type}`;
        notice.innerHTML = `${msg}<br><span style="font-size:16px; opacity:0.8;">( 點擊關閉 )</span>`;
        document.body.appendChild(notice);
        setTimeout(() => notice.classList.add('show'), 10);
        notice.onclick = () => {
            notice.classList.remove('show');
            setTimeout(() => { notice.remove(); resolve(); }, 400);
        };
    });
}
    
// ✅ 修正後的 window.onload 結構
window.onload = function() {
    // 只有當 init 函數存在時才執行
    if (typeof init === "function") {
        init();
    }
};
</script>
