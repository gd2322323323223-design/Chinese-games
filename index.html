<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>語文挑戰遊戲</title>
    <link rel="stylesheet" href="style.css">
</head>
    
<body>
  <div id="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1999;"></div> 

  <div id="start-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('images/board-bg-frontpage.png') no-repeat center center; background-size: cover; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    
    <h1 style="font-size: 60px; color: #5d4037; font-weight: 900; margin-bottom: 40px; background: rgba(255, 255, 255, 0.8); padding: 10px 40px; border-radius: 50px; border: 4px solid #8d6e63; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-shadow: 2px 2px 0px rgba(255,255,255,0.8);">詞語大作戰</h1>

    <div class="selection-container" style="display: flex; align-items: flex-start; gap: 20px; width: 100%; max-width: 1200px; justify-content: center; flex-wrap: wrap;">
      
      <div class="player-preview" style="flex: 1; display: flex; flex-direction: column; align-items: center;">
          <h3 style="background: #3182ce; color: #ffffff; padding: 8px 25px; border-radius: 15px; border: 2px solid #ffffff;">玩家 1 預覽</h3>
          <div id="p1-big-preview" class="preview-box" onclick="resetSelection(1)" style="cursor: pointer;">P1 棋子</div>
      </div>

      <div id="character-pool-wrapper" style="text-align: center;">
          <div id="selection-hint" style="font-size: 24px; font-weight: bold; margin-bottom: 15px; color: #5d4037;">請 玩家 1 選擇一個角色</div>
          <div id="character-pool">
              <img src="images/dragon.png" class="char-opt" onclick="selectChar(this, 'images/dragon.png')">
              <img src="images/fish.png" class="char-opt" onclick="selectChar(this, 'images/fish.png')">
              <img src="images/snail.png" class="char-opt" onclick="selectChar(this, 'images/snail.png')">
              <img src="images/octopus.png" class="char-opt" onclick="selectChar(this, 'images/octopus.png')">
              <img src="images/cat.png" class="char-opt" onclick="selectChar(this, 'images/cat.png')">
              <img src="images/dog.png" class="char-opt" onclick="selectChar(this, 'images/dog.png')">
              <img src="images/bee.png" class="char-opt" onclick="selectChar(this, 'images/bee.png')">
              <img src="images/fairy.png" class="char-opt" onclick="selectChar(this, 'images/fairy.png')">
              <img src="images/turtle.png" class="char-opt" onclick="selectChar(this, 'images/turtle.png')">
              <img src="images/knight.png" class="char-opt" onclick="selectChar(this, 'images/knight.png')">
              <img src="images/star.png" class="char-opt" onclick="selectChar(this, 'images/star.png')">
              <img src="images/panda.png" class="char-opt" onclick="selectChar(this, 'images/panda.png')">
          </div>
      </div>

      <div class="player-preview" style="flex: 1; display: flex; flex-direction: column; align-items: center;">
          <h3 style="background: #d53f8c; color: #ffffff; padding: 8px 25px; border-radius: 15px; border: 2px solid #ffffff;">玩家 2 預覽</h3>
          <div id="p2-big-preview" class="preview-box" onclick="resetSelection(2)" style="cursor: pointer;">P2 棋子</div>
      </div>
    </div> 
    
    <button id="start-game-btn" onclick="startGame()" style="margin-top: 40px; padding: 15px 60px; font-size: 28px; background: #48bb78; color: #ffffff; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">開始大作戰</button>
  </div>

  <div id="music-ctrl" onclick="toggleBGM()" style="position:fixed; top:20px; right:20px; z-index:2000; cursor:pointer; font-size:30px; background:#ffffff; border-radius:50%; width:50px; height:50px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,0.2);">🎵</div>

  <div id="game-container">
    <div id="board"></div>
    <div id="p1" class="player" onclick="handlePlayerClick(0)"></div>
    <div id="p2" class="player" onclick="handlePlayerClick(1)"></div>
  </div>

  <div id="controls" style="display:none;"> 
      <div id="player-turn-name">玩家 1</div>
      <div id="dice-box">
          <div class="dice-face face-1">1</div>
          <div class="dice-face face-2">2</div>
          <div class="dice-face face-3">3</div>
          <div class="dice-face face-4">4</div>
          <div class="dice-face face-5">5</div>
          <div class="dice-face face-6">6</div>
      </div>
      <button id="btn-roll" onclick="roll()">擲骰子</button>
  </div>

 <div id="modal" style="display:none;">
    <div id="timer">⏳ 剩餘時間: 120s</div>
    <div id="modal-content"></div> 
    <div id="modal-actions"></div>
</div>
    
    <div id="test-panel" style="position:fixed; bottom:80px; left:20px; z-index:9999; background:rgba(255,255,255,0.9); padding:15px; border:3px solid #3182ce; border-radius:20px; display:flex; flex-direction:column; gap:8px; box-shadow:0 10px 30px rgba(0,0,0,0.2);">
    <strong style="color:#5d4037; text-align:center;">題型測試面板</strong>
    <button onclick="testModal('fill')" style="background:#fff9c4; border:1px solid #ccc; cursor:pointer; padding:5px;">1. 填充題</button>
    <button onclick="testModal('reorder')" style="background:#fff9c4; border:1px solid #ccc; cursor:pointer; padding:5px;">2. 重組句子</button>
    <button onclick="testModal('match')" style="background:#fff9c4; border:1px solid #ccc; cursor:pointer; padding:5px;">3. 看圖配詞</button>
    <button onclick="testModal('radical')" style="background:#fff9c4; border:1px solid #ccc; cursor:pointer; padding:5px;">4. 部件辨析</button>
    <button onclick="testModal('punc')" style="background:#fff9c4; border:1px solid #ccc; cursor:pointer; padding:5px;">5. 標點符號</button>
    <button onclick="testModal('continue')" style="background:#fff9c4; border:1px solid #ccc; cursor:pointer; padding:5px;">6. 續寫句子</button>
    <button onclick="testModal('stroke')" style="background:#fff9c4; border:1px solid #ccc; cursor:pointer; padding:5px;">7. 筆順辨認</button>
    <button onclick="testModal('understand')" style="background:#fff9c4; border:1px solid #ccc; cursor:pointer; padding:5px;">8. 閱讀理解</button>
    <button onclick="document.getElementById('test-panel').remove()" style="background:#f56565; color:white; border:none; margin-top:5px; cursor:pointer;">❌ 關閉測試面板</button>
</div>
<script src="script.js"></script>
</body>
</html>
